# 英语例句：从 Tatoeba（CC BY 2.0 FR）取英中对照句，生成 lang/en-ex-*.json。在 Actions 页面手动运行。
name: English example sentences (Tatoeba)

on:
  workflow_dispatch:
    inputs:
      lang:
        description: en（英语分级词库例句）/ ja（日语人工翻译例句）
        required: false
        default: en

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: |
          pip install -q opencc-python-reimplemented
          if [ "${{ github.event.inputs.lang }}" = "ja" ]; then
            pip install -q fugashi unidic-lite
            python3 tools/fetch_tatoeba_ja.py
            python3 tools/build_examples.py
          else
            python3 tools/fetch_tatoeba.py
          fi
      - name: Commit
        run: |
          git config user.name "examples-bot"
          git config user.email "examples-bot@users.noreply.github.com"
          git add lang/en-ex-*.json lang/ja-ex-*.json tools/examples_tatoeba.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Example sentences from Tatoeba (CC BY 2.0 FR): ${{ github.event.inputs.lang }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
