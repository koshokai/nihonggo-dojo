# 英语例句：从 Tatoeba（CC BY 2.0 FR）取英中对照句，生成 lang/en-ex-*.json。在 Actions 页面手动运行。
name: English example sentences (Tatoeba)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: |
          pip install -q opencc-python-reimplemented
          python3 tools/fetch_tatoeba.py
      - name: Commit
        run: |
          git config user.name "examples-bot"
          git config user.email "examples-bot@users.noreply.github.com"
          git add lang/en-ex-*.json
          git diff --cached --quiet && exit 0
          git commit -qm "English example sentences from Tatoeba (CC BY 2.0 FR)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
