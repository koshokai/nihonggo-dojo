# 每小时调用一次 Supabase Edge Function notify：给到了提醒时间、今天还没学的用户发学习提醒。
# 需要仓库 Secret NOTIFY_CRON_SECRET（和 Supabase 里的 CRON_SECRET 一样），没设置时直接跳过。见 docs/SUPABASE_SETUP.md 第 9 节。
name: Study reminders

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Call notify
        env:
          SECRET: ${{ secrets.NOTIFY_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "NOTIFY_CRON_SECRET not set; skipping"; exit 0; fi
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" config.js | head -1)
          curl -sS --fail-with-body -X POST "$URL/functions/v1/notify" -H "x-cron-secret: $SECRET" -H "Content-Type: application/json" -d '{}'
