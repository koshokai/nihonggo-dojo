# 网站发布（GitHub Pages）。
# 以前用的是「从 main 分支直接发布」，网站有 800 多 MB、7 万多个文件（大部分是录音），GitHub 默认的发布步骤
# 10 分钟就超时，最近经常失败。改成自己的工作流：
#   - 发布等待时间放宽到 30 分钟；
#   - 只发布网站需要的文件，tools/（原稿和脚本）、docs/、tests/、app/ 不放到网站上。
# 需要在仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」（只需设置一次）。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 只复制网站需要的文件
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools/' --exclude 'docs/' --exclude 'tests/' \
            --exclude 'app/' --exclude 'supabase/' --exclude 'audio/index-anime.json' --exclude 'README.md' --exclude '_site' ./ _site/
          touch _site/.nojekyll
          du -sh _site; find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
