<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>道场后台</title>
<style>
:root { --bg: #FAF7F4; --surface: #fff; --ink: #2A2226; --muted: #7A6F74; --line: #E8DFE3; --ai: #D9578A; --ok: #2E9E6A; --warn: #C9861B; --bad: #C8463A; }
@media (prefers-color-scheme: dark) { :root { --bg: #1B1619; --surface: #241D21; --ink: #F1E9ED; --muted: #A99CA3; --line: #3A3036; --ai: #F28DB0; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Hiragino Sans", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.3rem; margin: 0 0 4px; } h2 { font-size: 1.05rem; margin: 0 0 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: .86rem; }
button, select, input, textarea { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.btn.pri { background: var(--ai); border-color: var(--ai); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); cursor: pointer; }
.chip.on { background: var(--ai); border-color: var(--ai); color: #fff; }
input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
textarea { min-height: 80px; resize: vertical; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px 12px; } .stat b { display: block; font-size: 1.4rem; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 720px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
tr.sel td { background: color-mix(in srgb, var(--ai) 10%, transparent); }
.tag { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: .78rem; }
.t-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.t-warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.t-bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.preview { border: 1px dashed var(--ai); border-radius: 12px; padding: 10px 12px; background: var(--bg); }
.preview .pv-reps span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; margin: 4px 4px 0 0; font-size: .85rem; }
.list > div { border-bottom: 1px solid var(--line); padding: 6px 0; }
label.f { display: block; margin: 8px 0 2px; font-size: .86rem; color: var(--muted); }
</style>
</head>
<body>
<main id="app"><p class="muted">加载中……</p></main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
