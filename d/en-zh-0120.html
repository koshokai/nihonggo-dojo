<p class="muted">英语每日一句 · 1月20日 · 日常</p><h1 lang="en">Easy does it.</h1><p><b>慢点，小心。</b></p><p>提醒别人动作放慢、小心一点，比如搬东西、倒车、扶老人时。也可以劝人冷静别冲动。语气轻松友好。</p>
