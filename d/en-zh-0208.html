<p class="muted">英语每日一句 · 2月8日 · 饮食</p><h1 lang="en">I&#x27;m stuffed!</h1><p><b>我吃撑了！</b></p><p>stuffed 原意是“塞满”，口语表示吃得非常饱。比 I&#x27;m full. 更夸张、更随意。在正式宴会上可以说 I&#x27;m full, thank you.</p>
<h2>例句</h2><div class="ex"><div lang="en">No dessert for me, thanks. I&#x27;m stuffed!</div><div class="tr">甜点我就不要了，谢谢。我吃撑了！</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-0207.html">← 2/7 Help yourself.</a><a href="../d/en-zh-0209.html">2/9 The more, the merrier. →</a></div>
