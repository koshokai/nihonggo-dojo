<p class="muted">英语每日一句 · 2月27日 · 日常</p><h1 lang="en">I&#x27;m under the weather.</h1><p><b>我有点不舒服。</b></p><p>表示身体有点不舒服，比如感冒、没精神，但不严重。比 I&#x27;m sick. 委婉，请假或推掉约会时常用。</p>
<h2>例句</h2><div class="ex"><div lang="en">I&#x27;m a bit under the weather today, so I&#x27;ll work from home.</div><div class="tr">我今天有点不舒服，就在家办公吧。</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-0226.html">← 2/26 Let&#x27;s call it a day.</a><a href="../d/en-zh-0228.html">2/28 Bless you! →</a></div>
