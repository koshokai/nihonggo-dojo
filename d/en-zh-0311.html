<p class="muted">英语每日一句 · 3月11日 · 职场</p><h1 lang="en">I&#x27;m new here.</h1><p><b>我是新来的。</b></p><p>表示自己刚入职、刚搬来或第一次来某地，可以顺便请别人多关照。这句话很谦虚，能自然地开启对话。</p>
