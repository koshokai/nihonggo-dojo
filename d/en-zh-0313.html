<p class="muted">英语每日一句 · 3月13日 · 日常</p><h1 lang="en">I&#x27;m all ears.</h1><p><b>我洗耳恭听。</b></p><p>表示非常想听对方说，注意力全在对方身上。常在对方说“我有个主意”时回应，口语、友好。</p>
