<p class="muted">英语每日一句 · 4月3日 · 日常</p><h1 lang="en">You&#x27;re pulling my leg.</h1><p><b>你在逗我吧。</b></p><p>pull someone&#x27;s leg 是“开某人玩笑、捉弄某人”。听到难以置信的话时用，和“你骗我吧”差不多，语气友好。</p>
