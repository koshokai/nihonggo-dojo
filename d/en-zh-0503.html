<p class="muted">英语每日一句 · 5月3日 · 习语</p><h1 lang="en">No pain, no gain.</h1><p><b>不劳无获。</b></p><p>不付出辛苦就没有收获，健身房里最常听到。也可用于学习、工作，语气带点鼓劲的感觉。</p>
