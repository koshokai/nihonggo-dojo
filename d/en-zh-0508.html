<p class="muted">英语每日一句 · 5月8日 · 旅行</p><h1 lang="en">Let&#x27;s hit the road!</h1><p><b>我们出发吧！</b></p><p>hit the road 是“上路、出发”，开车旅行出发时最常说。也可以表示“该走了”，比如聚会结束时。</p>
