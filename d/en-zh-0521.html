<p class="muted">英语每日一句 · 5月21日 · 交友</p><h1 lang="en">You&#x27;re the best!</h1><p><b>你最好了！</b></p><p>别人帮了你或给你惊喜时说，既是感谢也是夸奖。非常口语、热情，朋友和家人之间常用，正式场合少用。</p>
