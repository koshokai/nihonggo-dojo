<p class="muted">英语每日一句 · 5月27日 · 职场</p><h1 lang="en">I&#x27;m swamped this week.</h1><p><b>我这周忙死了。</b></p><p>swamped 原意是“被水淹没”，形容事情多到应付不过来。比 busy 更强烈，婉拒邀请时也常用。</p>
