<p class="muted">英语每日一句 · 5月30日 · 习语</p><h1 lang="en">Break a leg!</h1><p><b>祝你演出成功！</b></p><p>演员上台前的祝福语，因为直接说 Good luck 被认为不吉利。现在也用于演讲、面试等，不是诅咒别人摔断腿。</p>
