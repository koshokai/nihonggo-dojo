<p class="muted">英语每日一句 · 6月19日 · 情绪</p><h1 lang="en">My dad is my hero.</h1><p><b>我爸爸是我心中的英雄。</b></p><p>表达对父亲的崇拜和感激，常出现在父亲节卡片、演讲中。hero 在这里指“最敬佩的人”，不是超级英雄。</p>
<h2>例句</h2><div class="ex"><div lang="en">My dad worked two jobs to raise us. My dad is my hero.</div><div class="tr">我爸打两份工把我们养大，他是我心中的英雄。</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-0618.html">← 6/18 Happy Father&#x27;s Day!</a><a href="../d/en-zh-0620.html">6/20 Dream big. →</a></div>
