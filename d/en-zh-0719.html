<p class="muted">英语每日一句 · 7月19日 · 情绪</p><h1 lang="en">Shoot for the moon.</h1><p><b>志存高远。</b></p><p>鼓励人把目标定得高一些，即使没完全达到，也会有不错的成果。语气积极，常用于激励年轻人。</p>
