<p class="muted">英语每日一句 · 7月25日 · 习语</p><h1 lang="en">Piece of cake!</h1><p><b>小菜一碟！</b></p><p>表示事情非常容易，像吃块蛋糕一样。常用来回答“难吗？”，或自信地接下任务。口语、轻松。</p>
