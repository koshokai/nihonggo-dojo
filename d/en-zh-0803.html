<p class="muted">英语每日一句 · 8月3日 · 情绪</p><h1 lang="en">Every day is a gift.</h1><p><b>每一天都是礼物。</b></p><p>表示要珍惜每一天，常在经历病痛或失去后说，语气真诚温暖。也适合写在卡片或日记里。</p>
<h2>例句</h2><div class="ex"><div lang="en">After his surgery, my father says every day is a gift.</div><div class="tr">手术后，我爸爸说每一天都是礼物。</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-0802.html">← 8/2 Live in the moment.</a><a href="../d/en-zh-0804.html">8/4 Enjoy the little things. →</a></div>
