<p class="muted">英语每日一句 · 8月7日 · 日常</p><h1 lang="en">What a coincidence!</h1><p><b>真巧啊！</b></p><p>表示事情巧合得让人惊讶，比如同一天生日、同时到达。coincidence 是“巧合”，发音注意重音在第二音节。</p>
<h2>例句</h2><div class="ex"><div lang="en">You were born on May 3rd too? What a coincidence!</div><div class="tr">你也是5月3日出生的？真巧啊！</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-0806.html">← 8/6 Speak of the devil!</a><a href="../d/en-zh-0808.html">8/8 Great minds think alike. →</a></div>
