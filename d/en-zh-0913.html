<p class="muted">英语每日一句 · 9月13日 · 日常</p><h1 lang="en">No worries.</h1><p><b>没事儿，别在意。</b></p><p>对方道歉或道谢时都能用，意思是“没关系、不客气”。澳大利亚英语中特别常用，语气轻松随和。</p>
<h2>例句</h2><div class="ex"><div lang="en">You&#x27;re five minutes late? No worries, I just got here too.</div><div class="tr">你迟到了五分钟？没事儿，我也刚到。</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-0912.html">← 9/12 My bad.</a><a href="../d/en-zh-0914.html">9/14 Don&#x27;t mention it. →</a></div>
