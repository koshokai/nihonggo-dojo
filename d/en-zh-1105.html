<p class="muted">英语每日一句 · 11月5日 · 购物</p><h1 lang="en">It&#x27;s a steal!</h1><p><b>太划算了！</b></p><p>steal 这里是名词，意思是便宜得像白拿一样。夸东西物超所值时说，口语、热情。不是“偷东西”。</p>
<h2>例句</h2><div class="ex"><div lang="en">This leather bag was only twenty dollars. It&#x27;s a steal!</div><div class="tr">这个皮包才二十美元，太划算了！</div></div><a class="cta" href="../#en">在猫先生每天学一句 →</a><div class="pn"><a href="../d/en-zh-1104.html">← 11/4 Can I try this on?</a><a href="../d/en-zh-1106.html">11/6 That&#x27;s a rip-off! →</a></div>
