<p class="muted">英语每日一句 · 12月3日 · 情绪</p><h1 lang="en">Let it go.</h1><p><b>算了吧，放下吧。</b></p><p>劝人别再纠结一件事，放下烦恼或怨气。语气可以温和也可以带点不耐烦，看语境和语调。</p>
