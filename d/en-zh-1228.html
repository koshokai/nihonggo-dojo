<p class="muted">英语每日一句 · 12月28日 · 饮食</p><h1 lang="en">Cheers!</h1><p><b>干杯！</b></p><p>举杯时的说法。在英式英语中，Cheers 还可以表示“谢谢”或“再见”，非常常用，别只理解为干杯。</p>
