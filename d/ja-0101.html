<p class="muted">日语每日一句 · 1月1日 · 季节</p><h1 lang="ja">あけましておめでとうございます</h1><p><b>新年快乐</b></p><p>新年第一次见面或写贺年卡时的固定问候语，通常只在新年头几天（松の内）使用，口语里常简说成「あけおめ」。</p>
<h2>例句</h2><div class="ex"><div lang="ja">あけましておめでとうございます。今年もどうぞよろしくお願いします。</div><div class="py" lang="ja">あけまして おめでとう ございます。 ことしも どうぞ よろしく おねがいします。</div><div class="tr">新年快乐！今年也请多多关照。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><span></span><a href="../d/ja-0102.html">1/2 初夢 →</a></div>
