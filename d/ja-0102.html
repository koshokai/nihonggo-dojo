<p class="muted">日语每日一句 · 1月2日 · 季节</p><h1 lang="ja">初夢</h1><p class="py" lang="ja">はつゆめ</p><p><b>新年第一个梦</b></p><p>指新年里做的第一个梦，一般指元旦夜到1月2日夜之间的梦；传说梦见「一富士、二鹰、三茄子」最吉利。</p>
