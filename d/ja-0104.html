<p class="muted">日语每日一句 · 1月4日 · 谚语</p><h1 lang="ja">少年老い易く学成り難し</h1><p class="py" lang="ja">しょうねんおいやすくがくなりがたし</p><p><b>少年易老学难成</b></p><p>意思是人很快就会老去，而学问却难以成就，所以要珍惜光阴、努力学习。</p>
