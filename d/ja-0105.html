<p class="muted">日语每日一句 · 1月5日 · 季节</p><h1 lang="ja">小寒</h1><p class="py" lang="ja">しょうかん</p><p><b>小寒（二十四节气）</b></p><p>二十四节气之一，每年1月5日前后，从这天起进入「寒の入り」，一年中最冷的时期开始。</p>
