<p class="muted">日语每日一句 · 1月6日 · 四字熟语</p><h1 lang="ja">無理難題</h1><p class="py" lang="ja">むりなんだい</p><p><b>无理的要求；强人所难</b></p><p>日语中指根本无法做到的、不讲理的要求，常说「無理難題を押し付ける」，不同于中文&quot;难题&quot;的一般含义。</p>
