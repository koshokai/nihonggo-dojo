<p class="muted">日语每日一句 · 1月7日 · 季节</p><h1 lang="ja">七草粥</h1><p class="py" lang="ja">ななくさがゆ</p><p><b>七草粥</b></p><p>1月7日早上用芹、荠等「春之七草」煮的粥，寓意祈求一年无病无灾，也让过年吃得太多的肠胃休息一下。</p>
