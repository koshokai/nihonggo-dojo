<p class="muted">日语每日一句 · 1月10日 · 谚语</p><h1 lang="ja">出る杭は打たれる</h1><p class="py" lang="ja">でるくいはうたれる</p><p><b>枪打出头鸟；木秀于林，风必摧之</b></p><p>字面意思是「冒出来的桩子会被敲打」，比喻太出众或太出风头的人容易遭人嫉恨或打压。</p>
