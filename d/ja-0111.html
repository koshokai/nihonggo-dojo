<p class="muted">日语每日一句 · 1月11日 · 季节</p><h1 lang="ja">鏡開き</h1><p class="py" lang="ja">かがみびらき</p><p><b>开镜饼</b></p><p>把新年供奉的圆形年糕「鏡餅」敲开分食的习俗，多在1月11日；忌讳说「切る」「割る」，所以用吉利的「開く」。</p>
<h2>例句</h2><div class="ex"><div lang="ja">鏡開きのお餅でおしるこを作った。</div><div class="py" lang="ja">かがみびらきの おもちで おしるこお つくった。</div><div class="tr">用开镜饼的年糕做了红豆年糕汤。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-0110.html">← 1/10 出る杭は打たれる</a><a href="../d/ja-0112.html">1/12 無我夢中 →</a></div>
