<p class="muted">日语每日一句 · 1月12日 · 四字熟语</p><h1 lang="ja">無我夢中</h1><p class="py" lang="ja">むがむちゅう</p><p><b>全神贯注、忘我地投入</b></p><p>指专心到忘记自我的状态，常用于拼命做某事时。中文可说&quot;忘乎所以&quot;&quot;全神贯注&quot;。</p>
