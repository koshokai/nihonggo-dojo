<p class="muted">日语每日一句 · 1月14日 · 暖心话</p><h1 lang="ja">お疲れ様</h1><p class="py" lang="ja">おつかれさま</p><p><b>辛苦了</b></p><p>日本人最常用的慰劳话，下班、完成工作或见到同事时都说；对上级更礼貌地说「お疲れ様です」「お疲れ様でした」。</p>
