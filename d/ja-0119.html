<p class="muted">日语每日一句 · 1月19日 · 谚语</p><h1 lang="ja">壁に耳あり障子に目あり</h1><p class="py" lang="ja">かべにみみありしょうじにめあり</p><p><b>隔墙有耳</b></p><p>字面意思是「墙上有耳朵，纸拉门上有眼睛」，比喻秘密容易泄露，说话要小心。</p>
