<p class="muted">日语每日一句 · 1月21日 · 四字熟语</p><h1 lang="ja">頭寒足熱</h1><p class="py" lang="ja">ずかんそくねつ</p><p><b>头凉脚暖（有益健康）</b></p><p>日本传统养生说法，认为头部保持凉爽、脚部保持温暖有利于健康和睡眠。</p>
