<p class="muted">日语每日一句 · 1月22日 · 惯用句</p><h1 lang="ja">棚に上げる</h1><p class="py" lang="ja">たなにあげる</p><p><b>把自己的问题搁置一边（不提）</b></p><p>字面是&quot;放到架子上&quot;，指对自己的缺点避而不谈，却去指责别人。</p>
