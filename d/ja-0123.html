<p class="muted">日语每日一句 · 1月23日 · 暖心话</p><h1 lang="ja">おかえりなさい</h1><p><b>欢迎回来</b></p><p>迎接家人回家时说的话，回来的人说「ただいま」；也可以用来欢迎久别归来的朋友。</p>
