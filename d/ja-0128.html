<p class="muted">日语每日一句 · 1月28日 · 谚语</p><h1 lang="ja">百聞は一見に如かず</h1><p class="py" lang="ja">ひゃくぶんはいっけんにしかず</p><p><b>百闻不如一见</b></p><p>意思是听别人说一百次，不如亲眼看一次，源自《汉书》，与中文成语相同。</p>
