<p class="muted">日语每日一句 · 1月29日 · 四字熟语</p><h1 lang="ja">油断大敵</h1><p class="py" lang="ja">ゆだんたいてき</p><p><b>大意是最大的敌人；千万不可掉以轻心</b></p><p>「油断」是日语词，意为疏忽大意，与中文&quot;油断了&quot;无关。相当于中文的&quot;麻痹大意要不得&quot;&quot;骄兵必败&quot;。</p>
