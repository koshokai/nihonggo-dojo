<p class="muted">日语每日一句 · 1月31日 · 暖心话</p><h1 lang="ja">頑張りすぎないで</h1><p class="py" lang="ja">がんばりすぎないで</p><p><b>别太拼了</b></p><p>对已经很努力的人说的体贴话，比一味说「頑張って」更温柔，提醒对方照顾好自己。</p>
