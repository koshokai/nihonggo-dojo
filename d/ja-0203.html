<p class="muted">日语每日一句 · 2月3日 · 季节</p><h1 lang="ja">節分</h1><p class="py" lang="ja">せつぶん</p><p><b>节分（立春前一天）</b></p><p>立春前一天，家家户户撒豆子，一边喊「鬼は外、福は内」驱邪招福，还有朝着当年吉利方位吃「恵方巻」的习俗。</p>
<h2>例句</h2><div class="ex"><div lang="ja">節分の夜は、子どもと一緒に「鬼は外、福は内」と豆をまいた。</div><div class="py" lang="ja">せつぶんの よるわ、 こどもと いっしょに「 おにわ そと、 ふくわ うち」と まめお まいた。</div><div class="tr">节分的晚上，和孩子一起边喊「鬼出去，福进来」边撒豆子。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-0202.html">← 2/2 意気投合</a><a href="../d/ja-0204.html">2/4 立春 →</a></div>
