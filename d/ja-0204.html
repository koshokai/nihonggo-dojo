<p class="muted">日语每日一句 · 2月4日 · 季节</p><h1 lang="ja">立春</h1><p class="py" lang="ja">りっしゅん</p><p><b>立春</b></p><p>二十四节气之一，每年2月4日前后，历法上春天从这天开始，不过实际上还很冷。</p>
