<p class="muted">日语每日一句 · 2月10日 · 季节</p><h1 lang="ja">風花</h1><p class="py" lang="ja">かざはな</p><p><b>晴天飘雪</b></p><p>晴朗的天空中像花瓣一样随风飘落的细雪，多是远处山上的雪被风吹来，是很美的冬季词语。</p>
