<p class="muted">日语每日一句 · 2月11日 · 惯用句</p><h1 lang="ja">油を売る</h1><p class="py" lang="ja">あぶらをうる</p><p><b>偷懒闲聊；磨洋工</b></p><p>据说江户时代卖头油的商人边和客人闲聊边慢慢倒油，后比喻工作时间偷懒闲聊。</p>
