<p class="muted">日语每日一句 · 2月14日 · 季节</p><h1 lang="ja">バレンタインデー</h1><p class="py" lang="ja">ばれんたいんでー</p><p><b>情人节</b></p><p>在日本主要是女性送巧克力的日子，有送心上人的「本命チョコ」、送同事的「義理チョコ」、送朋友的「友チョコ」等。</p>
