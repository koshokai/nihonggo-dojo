<p class="muted">日语每日一句 · 2月15日 · 四字熟语</p><h1 lang="ja">不言実行</h1><p class="py" lang="ja">ふげんじっこう</p><p><b>埋头苦干、少说多做</b></p><p>日本人创造的四字熟语，指不多说话，默默把事情做好。近似中文&quot;少说多做&quot;&quot;默默耕耘&quot;。</p>
