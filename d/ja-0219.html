<p class="muted">日语每日一句 · 2月19日 · 季节</p><h1 lang="ja">雨水</h1><p class="py" lang="ja">うすい</p><p><b>雨水（二十四节气）</b></p><p>二十四节气之一，每年2月19日前后，雪渐渐化为雨，冰雪消融，传统上是摆出女儿节人偶的好时候。</p>
