<p class="muted">日语每日一句 · 2月20日 · 四字熟语</p><h1 lang="ja">馬耳東風</h1><p class="py" lang="ja">ばじとうふう</p><p><b>当耳旁风</b></p><p>出自李白的诗句&quot;有如东风射马耳&quot;，指对别人的意见完全不放在心上。中文更常说&quot;耳旁风&quot;。</p>
