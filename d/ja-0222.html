<p class="muted">日语每日一句 · 2月22日 · 暖心话</p><h1 lang="ja">成長したね</h1><p class="py" lang="ja">せいちょうしたね</p><p><b>你成长了</b></p><p>感慨对方比以前进步、成熟了，是对努力的肯定。</p>
