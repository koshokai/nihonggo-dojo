<p class="muted">日语每日一句 · 2月25日 · 四字熟语</p><h1 lang="ja">七転八倒</h1><p class="py" lang="ja">しちてんばっとう</p><p><b>痛得满地打滚</b></p><p>形容极度痛苦、翻来覆去地挣扎。注意中文&quot;七颠八倒&quot;指乱七八糟、颠三倒四，意思不同。</p>
