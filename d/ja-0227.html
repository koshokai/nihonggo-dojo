<p class="muted">日语每日一句 · 2月27日 · 暖心话</p><h1 lang="ja">元気をもらった</h1><p class="py" lang="ja">げんきをもらった</p><p><b>从你那里得到了力量</b></p><p>表示因为对方的话语、笑容或表现而受到鼓舞，是日本人很常用的感谢方式。</p>
