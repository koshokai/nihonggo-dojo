<p class="muted">日语每日一句 · 3月1日 · 惯用句</p><h1 lang="ja">白羽の矢が立つ</h1><p class="py" lang="ja">しらはのやがたつ</p><p><b>被选中；被看中</b></p><p>传说神明要选人做祭品时，会把白羽箭插在那户人家的屋顶上，现在多指被选中担任重要角色。</p>
