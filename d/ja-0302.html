<p class="muted">日语每日一句 · 3月2日 · 暖心话</p><h1 lang="ja">一人じゃないよ</h1><p class="py" lang="ja">ひとりじゃないよ</p><p><b>你不是一个人</b></p><p>告诉孤独或困难中的人，身边还有自己和其他人陪着。</p>
