<p class="muted">日语每日一句 · 3月3日 · 季节</p><h1 lang="ja">ひな祭り</h1><p class="py" lang="ja">ひなまつり</p><p><b>女儿节</b></p><p>3月3日为女孩祈求健康成长的节日，家里摆雏人偶，吃散寿司、菱饼、喝白酒（甜米酒），又叫「桃の節句」。</p>
