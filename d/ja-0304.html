<p class="muted">日语每日一句 · 3月4日 · 谚语</p><h1 lang="ja">若い時の苦労は買ってでもせよ</h1><p class="py" lang="ja">わかいときのくろうはかってでもせよ</p><p><b>年轻时吃的苦是财富</b></p><p>意思是年轻时的辛苦经历会成为将来的财富，花钱买也值得。</p>
