<p class="muted">日语每日一句 · 3月5日 · 季节</p><h1 lang="ja">啓蟄</h1><p class="py" lang="ja">けいちつ</p><p><b>惊蛰</b></p><p>二十四节气之一，每年3月5日前后，冬眠的虫子开始从土里出来活动，与中文的「惊蛰」相同。</p>
