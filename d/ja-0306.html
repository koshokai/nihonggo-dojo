<p class="muted">日语每日一句 · 3月6日 · 四字熟语</p><h1 lang="ja">一喜一憂</h1><p class="py" lang="ja">いっきいちゆう</p><p><b>一喜一忧；情绪随局势起伏</b></p><p>指随着情况的变化时而高兴时而担忧，常用来劝人不要过于在意眼前的结果。</p>
