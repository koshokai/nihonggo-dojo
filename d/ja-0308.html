<p class="muted">日语每日一句 · 3月8日 · 暖心话</p><h1 lang="ja">肩の力を抜いて</h1><p class="py" lang="ja">かたのちからをぬいて</p><p><b>放轻松</b></p><p>字面意思是「放松肩膀的力气」，指不要太紧张、太用力，以平常心面对。</p>
