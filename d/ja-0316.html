<p class="muted">日语每日一句 · 3月16日 · 惯用句</p><h1 lang="ja">足を洗う</h1><p class="py" lang="ja">あしをあらう</p><p><b>金盆洗手；改邪归正</b></p><p>字面是&quot;洗脚&quot;，指脱离不好的行业或圈子，与中文&quot;洗手不干&quot;相似，日语用&quot;脚&quot;。</p>
