<p class="muted">日语每日一句 · 3月17日 · 暖心话</p><h1 lang="ja">失敗してもいいんだよ</h1><p class="py" lang="ja">しっぱいしてもいいんだよ</p><p><b>失败也没关系</b></p><p>鼓励对方大胆尝试，不必害怕失败；「んだよ」带有温柔劝说的语气。</p>
