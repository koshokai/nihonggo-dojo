<p class="muted">日语每日一句 · 3月18日 · 季节</p><h1 lang="ja">お彼岸</h1><p class="py" lang="ja">おひがん</p><p><b>彼岸（扫墓时节）</b></p><p>以春分、秋分为中心的前后七天，日本人在这段时间扫墓、供奉「ぼたもち（おはぎ）」祭祖。</p>
