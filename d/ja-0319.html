<p class="muted">日语每日一句 · 3月19日 · 谚语</p><h1 lang="ja">嘘から出たまこと</h1><p class="py" lang="ja">うそからでたまこと</p><p><b>弄假成真</b></p><p>意思是原本是谎话或玩笑，结果却变成了现实。</p>
