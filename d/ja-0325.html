<p class="muted">日语每日一句 · 3月25日 · 谚语</p><h1 lang="ja">習うより慣れろ</h1><p class="py" lang="ja">ならうよりなれろ</p><p><b>熟能生巧；实践出真知</b></p><p>意思是与其听别人讲道理，不如自己反复实践、在实践中熟悉掌握。</p>
