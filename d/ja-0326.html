<p class="muted">日语每日一句 · 3月26日 · 四字熟语</p><h1 lang="ja">粉骨砕身</h1><p class="py" lang="ja">ふんこつさいしん</p><p><b>竭尽全力；鞠躬尽瘁</b></p><p>日语中多用于表决心，如就职致辞，意为&quot;拼尽全力&quot;。中文&quot;粉身碎骨&quot;多指牺牲或下场惨烈，语感不同。</p>
