<p class="muted">日语每日一句 · 3月27日 · 惯用句</p><h1 lang="ja">歯が立たない</h1><p class="py" lang="ja">はがたたない</p><p><b>敌不过；无能为力</b></p><p>字面是&quot;牙齿咬不动&quot;，指对手太强或问题太难，根本对付不了。</p>
