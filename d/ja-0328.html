<p class="muted">日语每日一句 · 3月28日 · 季节</p><h1 lang="ja">桜前線</h1><p class="py" lang="ja">さくらぜんせん</p><p><b>樱花前线</b></p><p>把各地樱花开花日相同的地点连成的线，像天气图上的锋线一样，从南向北推进。</p>
