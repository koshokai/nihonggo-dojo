<p class="muted">日语每日一句 · 4月4日 · 季节</p><h1 lang="ja">清明</h1><p class="py" lang="ja">せいめい</p><p><b>清明（二十四节气）</b></p><p>二十四节气之一，每年4月4日前后，「清浄明潔」之意，万物清新明朗；日本一般没有清明扫墓的习俗。</p>
