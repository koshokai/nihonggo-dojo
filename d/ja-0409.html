<p class="muted">日语每日一句 · 4月9日 · 惯用句</p><h1 lang="ja">耳にたこができる</h1><p class="py" lang="ja">みみにたこができる</p><p><b>耳朵听出茧子</b></p><p>「たこ」指茧子，不是章鱼。形容同样的话听了太多次，听烦了。</p>
