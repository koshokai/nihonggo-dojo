<p class="muted">日语每日一句 · 4月12日 · 谚语</p><h1 lang="ja">楽あれば苦あり</h1><p class="py" lang="ja">らくあればくあり</p><p><b>有乐必有苦；苦乐相随</b></p><p>意思是人生有快乐就有痛苦，苦与乐总是交替出现。常与「苦あれば楽あり」连用。</p>
