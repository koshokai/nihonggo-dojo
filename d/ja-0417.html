<p class="muted">日语每日一句 · 4月17日 · 谚语</p><h1 lang="ja">石の上にも三年</h1><p class="py" lang="ja">いしのうえにもさんねん</p><p><b>功到自然成；坚持就会有回报</b></p><p>字面意思是「在冰冷的石头上坐三年也会变暖」，比喻只要忍耐坚持，终会成功。</p>
