<p class="muted">日语每日一句 · 4月18日 · 四字熟语</p><h1 lang="ja">我田引水</h1><p class="py" lang="ja">がでんいんすい</p><p><b>只顾自己的利益；自说自话</b></p><p>字面是&quot;把水引到自己的田里&quot;，比喻只为自己打算或歪曲事实为己所用，是日本产的四字熟语。</p>
