<p class="muted">日语每日一句 · 4月26日 · 谚语</p><h1 lang="ja">後悔先に立たず</h1><p class="py" lang="ja">こうかいさきにたたず</p><p><b>后悔莫及</b></p><p>意思是事情过后再后悔也没用，所以要事先慎重考虑。</p>
