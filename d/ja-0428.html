<p class="muted">日语每日一句 · 4月28日 · 惯用句</p><h1 lang="ja">腕が上がる</h1><p class="py" lang="ja">うでがあがる</p><p><b>技艺提高；本事见长</b></p><p>日语用&quot;手臂&quot;表示技术、本领，「腕が上がる」就是手艺进步了。也可指酒量变大。</p>
<h2>例句</h2><div class="ex"><div lang="ja">毎日練習して、料理の腕が上がった。</div><div class="py" lang="ja">まいにちれんしゅう して、 りょうりの うでが あがった。</div><div class="tr">每天练习，厨艺进步了。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-0427.html">← 4/27 優柔不断</a><a href="../d/ja-0429.html">4/29 いただきます →</a></div>
