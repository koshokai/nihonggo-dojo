<p class="muted">日语每日一句 · 4月30日 · 谚语</p><h1 lang="ja">柳に雪折れなし</h1><p class="py" lang="ja">やなぎにゆきおれなし</p><p><b>柔能克刚</b></p><p>字面意思是「柳枝柔软，不会被积雪压断」，比喻柔软灵活的东西反而比坚硬的更能承受困难。</p>
