<p class="muted">日语每日一句 · 5月2日 · 季节</p><h1 lang="ja">八十八夜</h1><p class="py" lang="ja">はちじゅうはちや</p><p><b>八十八夜（采新茶时节）</b></p><p>从立春算起第88天，一般在5月2日前后，是采摘新茶的时节，民间认为这天的新茶能保佑健康。</p>
