<p class="muted">日语每日一句 · 5月4日 · 暖心话</p><h1 lang="ja">どういたしまして</h1><p><b>不客气</b></p><p>对方道谢时的回应；日常口语中也常用「いえいえ」「とんでもない」。</p>
