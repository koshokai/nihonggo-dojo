<p class="muted">日语每日一句 · 5月5日 · 季节</p><h1 lang="ja">こどもの日</h1><p class="py" lang="ja">こどものひ</p><p><b>儿童节</b></p><p>5月5日，原本是男孩的「端午の節句」，家里挂鲤鱼旗、摆武士人偶，吃柏饼和粽子。</p>
