<p class="muted">日语每日一句 · 5月7日 · 谚语</p><h1 lang="ja">腐っても鯛</h1><p class="py" lang="ja">くさってもたい</p><p><b>瘦死的骆驼比马大</b></p><p>字面意思是「鲷鱼就算腐坏了也还是鲷鱼」，比喻好东西即使衰败了也仍有价值。</p>
