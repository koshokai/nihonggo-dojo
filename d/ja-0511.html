<p class="muted">日语每日一句 · 5月11日 · 谚语</p><h1 lang="ja">人は見かけによらぬもの</h1><p class="py" lang="ja">ひとはみかけによらぬもの</p><p><b>人不可貌相</b></p><p>意思是人的本性和能力不能只凭外表判断。</p>
