<p class="muted">日语每日一句 · 5月15日 · 暖心话</p><h1 lang="ja">行ってらっしゃい</h1><p class="py" lang="ja">いってらっしゃい</p><p><b>路上小心，早点回来</b></p><p>送家人出门时说的话，对方出门时说「行ってきます」，是日本家庭每天都有的温暖对话。</p>
