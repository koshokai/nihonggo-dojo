<p class="muted">日语每日一句 · 5月18日 · 四字熟语</p><h1 lang="ja">一汁一菜</h1><p class="py" lang="ja">いちじゅういっさい</p><p><b>一汤一菜；简朴的饭食</b></p><p>指只有米饭、一碗汤和一道菜的简朴饮食，是日本传统的饮食观念。</p>
