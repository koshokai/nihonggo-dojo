<p class="muted">日语每日一句 · 5月20日 · 暖心话</p><h1 lang="ja">焦らなくていいよ</h1><p class="py" lang="ja">あせらなくていいよ</p><p><b>不用着急</b></p><p>安慰着急、紧张的人，告诉对方慢慢来也没关系。</p>
