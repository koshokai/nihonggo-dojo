<p class="muted">日语每日一句 · 5月22日 · 季节</p><h1 lang="ja">風薫る</h1><p class="py" lang="ja">かぜかおる</p><p><b>和风送香</b></p><p>形容初夏吹过新绿的清爽和风，好像带着香气一样；书信开头常写「風薫る季節となりました」。</p>
