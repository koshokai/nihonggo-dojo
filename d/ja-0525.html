<p class="muted">日语每日一句 · 5月25日 · 暖心话</p><h1 lang="ja">いつでも話聞くよ</h1><p class="py" lang="ja">いつでもはなしきくよ</p><p><b>随时都可以跟我说</b></p><p>告诉烦恼中的人有事可以随时来找自己倾诉，口语中省略了助词「を」。</p>
<h2>例句</h2><div class="ex"><div lang="ja">一人で抱え込まないで。いつでも話聞くよ。</div><div class="py" lang="ja">ひとりで かかえこまないで。 いつでも はなし きくよ。</div><div class="tr">别一个人憋着，随时都可以跟我说。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-0524.html">← 5/24 口が堅い</a><a href="../d/ja-0526.html">5/26 好きこそものの上手なれ →</a></div>
