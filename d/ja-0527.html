<p class="muted">日语每日一句 · 5月27日 · 季节</p><h1 lang="ja">木漏れ日</h1><p class="py" lang="ja">こもれび</p><p><b>透过树叶洒下的阳光</b></p><p>阳光从树叶缝隙间洒落下来的样子，被认为是很难直接翻译成别的语言的美丽日语词。</p>
