<p class="muted">日语每日一句 · 5月28日 · 四字熟语</p><h1 lang="ja">自業自得</h1><p class="py" lang="ja">じごうじとく</p><p><b>自作自受</b></p><p>源自佛教，指自己行为的报应由自己承受。日语中几乎只用于坏结果。</p>
