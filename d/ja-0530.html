<p class="muted">日语每日一句 · 5月30日 · 暖心话</p><h1 lang="ja">上を向いて歩こう</h1><p class="py" lang="ja">うえをむいてあるこう</p><p><b>昂首向前走</b></p><p>坂本九演唱的名曲（作词：永六辅），歌词接着是「涙がこぼれないように」，在海外以「SUKIYAKI」之名风靡。</p>
