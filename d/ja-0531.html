<p class="muted">日语每日一句 · 5月31日 · 谚语</p><h1 lang="ja">木を見て森を見ず</h1><p class="py" lang="ja">きをみてもりをみず</p><p><b>只见树木，不见森林</b></p><p>意思是只注意细节而忽视了整体，与中文说法相同。</p>
