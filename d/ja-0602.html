<p class="muted">日语每日一句 · 6月2日 · 四字熟语</p><h1 lang="ja">八方美人</h1><p class="py" lang="ja">はっぽうびじん</p><p><b>八面玲珑、谁都讨好的人（贬义）</b></p><p>字面是&quot;从哪个方向看都美的人&quot;，但日语中多带贬义，指对谁都讨好、没有原则的人，与中文&quot;美人&quot;无关。</p>
