<p class="muted">日语每日一句 · 6月4日 · 暖心话</p><h1 lang="ja">助かりました</h1><p class="py" lang="ja">たすかりました</p><p><b>真是帮大忙了</b></p><p>表示对方的帮助解决了自己的困难，比单说「ありがとう」更具体，职场上很常用。</p>
