<p class="muted">日语每日一句 · 6月5日 · 谚语</p><h1 lang="ja">雨降って地固まる</h1><p class="py" lang="ja">あめふってじかたまる</p><p><b>不打不相识；坏事之后反而更好</b></p><p>字面意思是「下过雨后地面更坚实」，比喻经历纠纷或困难后，关系或局面反而更加稳固。</p>
