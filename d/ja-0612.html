<p class="muted">日语每日一句 · 6月12日 · 季节</p><h1 lang="ja">紫陽花</h1><p class="py" lang="ja">あじさい</p><p><b>绣球花</b></p><p>梅雨季节盛开的代表性花卉，花色会随土壤酸碱度变化，镰仓等地的绣球花很有名。</p>
