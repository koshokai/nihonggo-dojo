<p class="muted">日语每日一句 · 6月15日 · 暖心话</p><h1 lang="ja">おかげさまで</h1><p><b>托您的福</b></p><p>别人问候自己近况时的谦逊回答，表示一切顺利多亏了大家的照顾，即使对方没有直接帮忙也可以用。</p>
