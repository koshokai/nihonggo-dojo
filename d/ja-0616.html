<p class="muted">日语每日一句 · 6月16日 · 季节</p><h1 lang="ja">五月雨</h1><p class="py" lang="ja">さみだれ</p><p><b>梅雨</b></p><p>旧历五月下的雨，也就是梅雨；「五月雨式に」还比喻事情断断续续、零零散散地进行。</p>
