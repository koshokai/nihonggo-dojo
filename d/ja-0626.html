<p class="muted">日语每日一句 · 6月26日 · 暖心话</p><h1 lang="ja">一歩ずつでいい</h1><p class="py" lang="ja">いっぽずつでいい</p><p><b>一步一步来就好</b></p><p>安慰着急的人不用一下子做到完美，慢慢前进就可以，相当于中文的「慢慢来」。</p>
