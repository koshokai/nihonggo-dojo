<p class="muted">日语每日一句 · 6月27日 · 谚语</p><h1 lang="ja">孝行したい時に親はなし</h1><p class="py" lang="ja">こうこうしたいときにおやはなし</p><p><b>子欲养而亲不待</b></p><p>意思是等到想孝顺父母时，父母已经不在了，劝人及时尽孝。</p>
