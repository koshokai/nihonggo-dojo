<p class="muted">日语每日一句 · 6月29日 · 惯用句</p><h1 lang="ja">鯖を読む</h1><p class="py" lang="ja">さばをよむ</p><p><b>谎报数字（多为少报年龄）</b></p><p>据说因为鲭鱼容易腐烂，过去鱼贩匆忙计数时常数不准，后指故意虚报数字。</p>
<h2>例句</h2><div class="ex"><div lang="ja">彼女は年を五歳も鯖を読んでいた。</div><div class="py" lang="ja">かのじょわ としお ごさいも さばお よんでいた。</div><div class="tr">她把年龄少报了足足五岁。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-0628.html">← 6/28 付和雷同</a><a href="../d/ja-0630.html">6/30 君ならできる →</a></div>
