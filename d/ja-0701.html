<p class="muted">日语每日一句 · 7月1日 · 季节</p><h1 lang="ja">山開き</h1><p class="py" lang="ja">やまびらき</p><p><b>开山</b></p><p>登山季正式开始、允许登山的日子，富士山传统上在7月1日开山（山梨县一侧）。</p>
