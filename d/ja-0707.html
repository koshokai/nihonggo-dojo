<p class="muted">日语每日一句 · 7月7日 · 季节</p><h1 lang="ja">七夕</h1><p class="py" lang="ja">たなばた</p><p><b>七夕</b></p><p>日本一般在公历7月7日过七夕，人们把愿望写在彩色纸条「短冊」上，挂在竹枝上祈愿。</p>
