<p class="muted">日语每日一句 · 7月13日 · 惯用句</p><h1 lang="ja">尻に敷く</h1><p class="py" lang="ja">しりにしく</p><p><b>管住丈夫（妻管严）</b></p><p>字面是&quot;压在屁股底下&quot;，指妻子在家中占上风，被管的丈夫叫「尻に敷かれる」。</p>
