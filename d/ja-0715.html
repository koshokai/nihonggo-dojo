<p class="muted">日语每日一句 · 7月15日 · 暖心话</p><h1 lang="ja">雨ニモマケズ</h1><p class="py" lang="ja">あめにもまけず</p><p><b>不畏风雨</b></p><p>宫泽贤治的诗的开头，下一句是「風ニモマケズ」，原诗用片假名写成，描写坚强、朴素、为他人着想的理想人格。</p>
