<p class="muted">日语每日一句 · 7月16日 · 谚语</p><h1 lang="ja">弘法も筆の誤り</h1><p class="py" lang="ja">こうぼうもふでのあやまり</p><p><b>人有失手，马有失蹄</b></p><p>弘法大师（空海）是著名书法家，连他也会写错字，比喻高手也会出错。</p>
<h2>例句</h2><div class="ex"><div lang="ja">プロの通訳でも聞き間違えることがある。弘法も筆の誤りだ。</div><div class="py" lang="ja">プロの つうやくでも ききまちがえる ことが ある。 こうぼうも ふでの あやまりだ。</div><div class="tr">就算是专业口译也会听错，真是人有失手，马有失蹄。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-0715.html">← 7/15 雨ニモマケズ</a><a href="../d/ja-0717.html">7/17 言語道断 →</a></div>
