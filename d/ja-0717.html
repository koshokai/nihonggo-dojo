<p class="muted">日语每日一句 · 7月17日 · 四字熟语</p><h1 lang="ja">言語道断</h1><p class="py" lang="ja">ごんごどうだん</p><p><b>岂有此理；荒唐至极</b></p><p>原为佛教用语&quot;言语道断&quot;，指深奥的真理无法用语言表达；日语中转为&quot;恶劣得无话可说&quot;的意思，与中文用法不同。</p>
