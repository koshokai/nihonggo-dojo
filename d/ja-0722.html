<p class="muted">日语每日一句 · 7月22日 · 谚语</p><h1 lang="ja">情けは人のためならず</h1><p class="py" lang="ja">なさけはひとのためならず</p><p><b>与人为善，终将善报于己</b></p><p>意思是对别人好，最终会回报到自己身上。常被误解为「同情别人反而害了他」，这是错误用法。</p>
