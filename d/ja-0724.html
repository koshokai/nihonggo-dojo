<p class="muted">日语每日一句 · 7月24日 · 四字熟语</p><h1 lang="ja">一生懸命</h1><p class="py" lang="ja">いっしょうけんめい</p><p><b>拼命；全力以赴</b></p><p>原为「一所懸命」，指武士拼死守护自己的一块领地，后来变为&quot;拼命努力&quot;的意思，是日语最常用的词之一。</p>
