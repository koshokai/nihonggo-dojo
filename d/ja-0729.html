<p class="muted">日语每日一句 · 7月29日 · 四字熟语</p><h1 lang="ja">絶体絶命</h1><p class="py" lang="ja">ぜったいぜつめい</p><p><b>走投无路；陷入绝境</b></p><p>指处于无法逃脱的危急状态。注意写作「絶体」而不是「絶対」，是日本人也常写错的词。</p>
