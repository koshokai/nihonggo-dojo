<p class="muted">日语每日一句 · 8月3日 · 季节</p><h1 lang="ja">夏バテ</h1><p class="py" lang="ja">なつばて</p><p><b>苦夏</b></p><p>因为炎热导致身体疲乏、没有食欲；日本人常在「土用の丑の日」吃鳗鱼来防苦夏。</p>
