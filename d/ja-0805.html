<p class="muted">日语每日一句 · 8月5日 · 暖心话</p><h1 lang="ja">ただいま</h1><p><b>我回来了</b></p><p>回到家时说的话，家里人会回应「おかえり」，是日本人回家时最温暖的一句。</p>
