<p class="muted">日语每日一句 · 8月7日 · 季节</p><h1 lang="ja">立秋</h1><p class="py" lang="ja">りっしゅう</p><p><b>立秋</b></p><p>二十四节气之一，每年8月7日前后，历法上秋天开始，但实际上暑热还很厉害。</p>
