<p class="muted">日语每日一句 · 8月12日 · 季节</p><h1 lang="ja">帰省</h1><p class="py" lang="ja">きせい</p><p><b>回老家</b></p><p>离家在外的人回故乡探亲，盂兰盆节和新年是日本两大回乡高峰，交通拥堵叫「帰省ラッシュ」。</p>
