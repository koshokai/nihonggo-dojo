<p class="muted">日语每日一句 · 8月13日 · 季节</p><h1 lang="ja">お盆</h1><p class="py" lang="ja">おぼん</p><p><b>盂兰盆节</b></p><p>迎接祖先灵魂回家的节日，多在8月13日到16日，许多公司放「お盆休み」，人们回乡扫墓、跳盆舞。</p>
