<p class="muted">日语每日一句 · 8月18日 · 暖心话</p><h1 lang="ja">いつでも味方だよ</h1><p class="py" lang="ja">いつでもみかただよ</p><p><b>我永远站在你这边</b></p><p>「味方」是同伴、自己人的意思，表示无论发生什么都会支持对方。</p>
