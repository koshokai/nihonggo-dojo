<p class="muted">日语每日一句 · 8月21日 · 惯用句</p><h1 lang="ja">足を引っ張る</h1><p class="py" lang="ja">あしをひっぱる</p><p><b>拖后腿</b></p><p>字面是&quot;拉别人的脚&quot;，指妨碍别人或成为团队的累赘，与中文&quot;拖后腿&quot;几乎一样。</p>
