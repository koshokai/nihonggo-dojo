<p class="muted">日语每日一句 · 8月22日 · 暖心话</p><h1 lang="ja">ゆっくり休んでね</h1><p class="py" lang="ja">ゆっくりやすんでね</p><p><b>好好休息</b></p><p>对累了、病了或忙完的人说的关心话，「ゆっくり」表示不着急、慢慢地。</p>
