<p class="muted">日语每日一句 · 8月24日 · 谚语</p><h1 lang="ja">歳月人を待たず</h1><p class="py" lang="ja">さいげつひとをまたず</p><p><b>岁月不待人</b></p><p>源自陶渊明的诗句「及时当勉励，岁月不待人」，意思是时间一去不复返，要珍惜光阴。</p>
