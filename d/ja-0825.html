<p class="muted">日语每日一句 · 8月25日 · 四字熟语</p><h1 lang="ja">有言実行</h1><p class="py" lang="ja">ゆうげんじっこう</p><p><b>说到做到</b></p><p>由「不言実行」仿造而来的日语词，指公开宣布目标并付诸实现。相当于中文&quot;言出必行&quot;。</p>
