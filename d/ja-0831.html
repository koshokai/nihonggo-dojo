<p class="muted">日语每日一句 · 8月31日 · 暖心话</p><h1 lang="ja">ごちそうさまでした</h1><p><b>我吃饱了，谢谢款待</b></p><p>吃完饭后说的感谢话，「馳走」原指为了准备饭菜四处奔走，所以带有感谢对方辛苦张罗的意思。</p>
