<p class="muted">日语每日一句 · 9月1日 · 季节</p><h1 lang="ja">防災の日</h1><p class="py" lang="ja">ぼうさいのひ</p><p><b>防灾日</b></p><p>为纪念1923年9月1日的关东大地震而设，全国各地在这天举行防灾演习，检查应急物资。</p>
