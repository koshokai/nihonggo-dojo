<p class="muted">日语每日一句 · 9月6日 · 谚语</p><h1 lang="ja">立つ鳥跡を濁さず</h1><p class="py" lang="ja">たつとりあとをにごさず</p><p><b>走时要收拾干净；善始善终</b></p><p>字面意思是「水鸟飞走时不会弄脏水面」，比喻离开时要把事情处理妥当，不留麻烦。</p>
