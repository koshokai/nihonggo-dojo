<p class="muted">日语每日一句 · 9月11日 · 暖心话</p><h1 lang="ja">待ってるね</h1><p class="py" lang="ja">まってるね</p><p><b>我等你哦</b></p><p>表示期待对方到来或归来，语气亲切。</p>
