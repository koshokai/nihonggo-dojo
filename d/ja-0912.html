<p class="muted">日语每日一句 · 9月12日 · 谚语</p><h1 lang="ja">仏の顔も三度まで</h1><p class="py" lang="ja">ほとけのかおもさんどまで</p><p><b>事不过三；忍耐是有限度的</b></p><p>字面意思是「佛的脸被摸三次也会生气」，比喻再温和的人，一再被冒犯也会发火。</p>
