<p class="muted">日语每日一句 · 9月13日 · 四字熟语</p><h1 lang="ja">四苦八苦</h1><p class="py" lang="ja">しくはっく</p><p><b>千辛万苦；苦恼不堪</b></p><p>原为佛教用语，指生老病死等人生的各种苦。日语日常中多指为某事费尽心思、吃尽苦头。</p>
