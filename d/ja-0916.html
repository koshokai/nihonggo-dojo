<p class="muted">日语每日一句 · 9月16日 · 暖心话</p><h1 lang="ja">大丈夫、なんとかなる</h1><p class="py" lang="ja">だいじょうぶ、なんとかなる</p><p><b>没事，总会有办法的</b></p><p>「なんとかなる」意为「总能想出办法、总能过得去」，常用来给自己或别人打气，带着乐观的语气。</p>
