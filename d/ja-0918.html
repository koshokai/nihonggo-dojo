<p class="muted">日语每日一句 · 9月18日 · 四字熟语</p><h1 lang="ja">唯我独尊</h1><p class="py" lang="ja">ゆいがどくそん</p><p><b>自以为是；唯我独尊</b></p><p>源自佛陀诞生时所说的&quot;天上天下唯我独尊&quot;。日常日语中多为贬义，指自高自大、目中无人。</p>
