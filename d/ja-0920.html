<p class="muted">日语每日一句 · 9月20日 · 季节</p><h1 lang="ja">彼岸花</h1><p class="py" lang="ja">ひがんばな</p><p><b>彼岸花；石蒜</b></p><p>秋分前后盛开的红色花，因开在秋季彼岸时期而得名，也叫「曼珠沙華」。</p>
