<p class="muted">日语每日一句 · 9月23日 · 季节</p><h1 lang="ja">秋分</h1><p class="py" lang="ja">しゅうぶん</p><p><b>秋分</b></p><p>二十四节气之一，每年9月23日前后，昼夜几乎等长；「秋分の日」是日本的法定假日，也是扫墓的日子。</p>
