<p class="muted">日语每日一句 · 9月25日 · 季节</p><h1 lang="ja">十五夜</h1><p class="py" lang="ja">じゅうごや</p><p><b>中秋月夜</b></p><p>旧历八月十五的月夜，日本人供上赏月团子和芒草赏月，叫做「お月見」；日期每年不同，多在9月中下旬。</p>
