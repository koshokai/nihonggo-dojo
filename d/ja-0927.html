<p class="muted">日语每日一句 · 9月27日 · 暖心话</p><h1 lang="ja">みんなちがって、みんないい</h1><p><b>大家各不相同，大家都很好</b></p><p>出自童谣诗人金子みすゞ的诗《我和小鸟和铃铛》（わたしと小鳥とすずと）的最后一句，肯定每个人的独特之处。</p>
