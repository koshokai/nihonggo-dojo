<p class="muted">日语每日一句 · 9月30日 · 惯用句</p><h1 lang="ja">お茶を濁す</h1><p class="py" lang="ja">おちゃをにごす</p><p><b>敷衍了事；搪塞过去</b></p><p>字面是&quot;把茶弄浑&quot;，据说不懂茶道的人随便搅浑茶水装样子，比喻含糊其辞、敷衍应付。</p>
