<p class="muted">日语每日一句 · 10月2日 · 暖心话</p><h1 lang="ja">ありがとうを言いたくて</h1><p class="py" lang="ja">ありがとうをいいたくて</p><p><b>只是想跟你说声谢谢</b></p><p>把「ありがとう」当名词用，表示特意来道谢，常用在留言、信件或打电话的开头，语气真诚又温暖。</p>
<h2>例句</h2><div class="ex"><div lang="ja">急に電話してごめんね。ただ、ありがとうを言いたくて。</div><div class="py" lang="ja">きゅうに でんわ して ごめんね。 ただ、 ありがとうお いいたくて。</div><div class="tr">突然打电话给你不好意思，只是想跟你说声谢谢。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-1001.html">← 10/1 鰯雲</a><a href="../d/ja-1003.html">10/3 時は金なり →</a></div>
