<p class="muted">日语每日一句 · 10月3日 · 谚语</p><h1 lang="ja">時は金なり</h1><p class="py" lang="ja">ときはかねなり</p><p><b>时间就是金钱；一寸光阴一寸金</b></p><p>源自英语谚语「Time is money」，意思是时间和金钱一样宝贵，不可浪费。</p>
