<p class="muted">日语每日一句 · 10月5日 · 季节</p><h1 lang="ja">食欲の秋</h1><p class="py" lang="ja">しょくよくのあき</p><p><b>食欲之秋</b></p><p>秋天是收获季节，新米、秋刀鱼、栗子、松茸等美食很多，所以说「食欲之秋」。</p>
