<p class="muted">日语每日一句 · 10月7日 · 暖心话</p><h1 lang="ja">さすが</h1><p><b>不愧是你</b></p><p>称赞对方果然名不虚传、和期待的一样厉害，常说「さすがですね」「さすが〇〇さん」。</p>
