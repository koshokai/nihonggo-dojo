<p class="muted">日语每日一句 · 10月9日 · 谚语</p><h1 lang="ja">石橋を叩いて渡る</h1><p class="py" lang="ja">いしばしをたたいてわたる</p><p><b>万分谨慎；稳扎稳打</b></p><p>字面意思是「敲敲石桥确认结实后再过」，形容非常小心谨慎。</p>
