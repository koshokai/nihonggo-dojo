<p class="muted">日语每日一句 · 10月10日 · 四字熟语</p><h1 lang="ja">他力本願</h1><p class="py" lang="ja">たりきほんがん</p><p><b>依赖别人；指望他人</b></p><p>原为净土宗用语，指依靠阿弥陀佛的愿力往生。现代日语转为贬义，指什么都靠别人。</p>
