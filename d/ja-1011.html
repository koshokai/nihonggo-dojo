<p class="muted">日语每日一句 · 10月11日 · 惯用句</p><h1 lang="ja">手が届く</h1><p class="py" lang="ja">てがとどく</p><p><b>够得着；力所能及；快到某个年龄</b></p><p>字面是&quot;手够得到&quot;，可指价格买得起，也可说「四十に手が届く」表示快四十岁了。</p>
