<p class="muted">日语每日一句 · 10月13日 · 暖心话</p><h1 lang="ja">泣いてもいいんだよ</h1><p class="py" lang="ja">ないてもいいんだよ</p><p><b>想哭就哭吧</b></p><p>告诉难过的人不必强忍，可以把情绪释放出来，是很温柔的安慰。</p>
