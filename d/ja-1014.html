<p class="muted">日语每日一句 · 10月14日 · 谚语</p><h1 lang="ja">かわいい子には旅をさせよ</h1><p class="py" lang="ja">かわいいこにはたびをさせよ</p><p><b>爱孩子就要让他去闯荡</b></p><p>意思是真正疼爱孩子，就应该让他出去经历风雨、吃苦锻炼。</p>
