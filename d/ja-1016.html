<p class="muted">日语每日一句 · 10月16日 · 惯用句</p><h1 lang="ja">目がない</h1><p class="py" lang="ja">めがない</p><p><b>特别喜欢；着迷</b></p><p>字面是&quot;没有眼睛&quot;，「～に目がない」指对某物喜欢得没有分辨力，也可指&quot;没眼光&quot;。</p>
