<p class="muted">日语每日一句 · 10月19日 · 谚语</p><h1 lang="ja">海老で鯛を釣る</h1><p class="py" lang="ja">えびでたいをつる</p><p><b>抛砖引玉；以小博大</b></p><p>字面意思是「用小虾钓到鲷鱼」，比喻用很小的付出得到很大的收获。</p>
