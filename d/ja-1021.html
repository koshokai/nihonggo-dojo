<p class="muted">日语每日一句 · 10月21日 · 惯用句</p><h1 lang="ja">耳が痛い</h1><p class="py" lang="ja">みみがいたい</p><p><b>话刺耳；被说到痛处</b></p><p>不是真的耳朵疼，而是指别人说中了自己的缺点，听着难受，近似&quot;忠言逆耳&quot;。</p>
