<p class="muted">日语每日一句 · 10月22日 · 暖心话</p><h1 lang="ja">生きてるだけで丸もうけ</h1><p class="py" lang="ja">いきてるだけでまるもうけ</p><p><b>活着就是赚到了</b></p><p>搞笑艺人明石家さんま的座右铭，意为能活着本身就已经赚了，其他都是额外的，他女儿的艺名IMALU也来自这句话。</p>
