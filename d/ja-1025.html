<p class="muted">日语每日一句 · 10月25日 · 四字熟语</p><h1 lang="ja">以心伝心</h1><p class="py" lang="ja">いしんでんしん</p><p><b>心领神会；不言自明</b></p><p>本是禅宗用语，指以心传法、不立文字。日语日常中多指朋友或搭档之间不用开口就能明白对方的意思。</p>
