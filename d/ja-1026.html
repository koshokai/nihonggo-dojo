<p class="muted">日语每日一句 · 10月26日 · 惯用句</p><h1 lang="ja">頭が上がらない</h1><p class="py" lang="ja">あたまがあがらない</p><p><b>抬不起头；在对方面前硬气不起来</b></p><p>指因为欠人情或理亏，在对方面前抬不起头。</p>
