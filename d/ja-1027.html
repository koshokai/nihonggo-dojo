<p class="muted">日语每日一句 · 10月27日 · 暖心话</p><h1 lang="ja">明日があるさ</h1><p class="py" lang="ja">あしたがあるさ</p><p><b>还有明天呢</b></p><p>坂本九演唱的歌曲名（作词：青岛幸男），意思是今天不顺利也没关系，明天还有机会。</p>
