<p class="muted">日语每日一句 · 11月1日 · 季节</p><h1 lang="ja">木枯らし</h1><p class="py" lang="ja">こがらし</p><p><b>寒风</b></p><p>晚秋到初冬刮起的强劲北风，能把树叶吹落；气象厅会发布当年的「木枯らし1号」。</p>
