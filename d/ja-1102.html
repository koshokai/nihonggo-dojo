<p class="muted">日语每日一句 · 11月2日 · 暖心话</p><h1 lang="ja">お互い様</h1><p class="py" lang="ja">おたがいさま</p><p><b>彼此彼此；互相帮助是应该的</b></p><p>对方向自己道谢或道歉时，表示「大家都会有需要帮忙的时候，不必客气」。</p>
