<p class="muted">日语每日一句 · 11月9日 · 谚语</p><h1 lang="ja">鬼に金棒</h1><p class="py" lang="ja">おににかなぼう</p><p><b>如虎添翼</b></p><p>字面意思是「给鬼加上铁棒」，比喻本来就强的人又得到助力，变得更强。</p>
