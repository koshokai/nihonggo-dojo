<p class="muted">日语每日一句 · 11月12日 · 季节</p><h1 lang="ja">紅葉狩り</h1><p class="py" lang="ja">もみじがり</p><p><b>赏红叶</b></p><p>秋天到山里或庭园欣赏红叶，「狩り」在这里不是打猎，而是寻访观赏的意思。</p>
<h2>例句</h2><div class="ex"><div lang="ja">週末に、京都へ紅葉狩りに出かけた。</div><div class="py" lang="ja">しゅうまつに、 きょうとえ もみじがりに でかけた。</div><div class="tr">周末去京都赏了红叶。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-1111.html">← 11/11 口を出す</a><a href="../d/ja-1113.html">11/13 早起きは三文の徳 →</a></div>
