<p class="muted">日语每日一句 · 11月13日 · 谚语</p><h1 lang="ja">早起きは三文の徳</h1><p class="py" lang="ja">はやおきはさんもんのとく</p><p><b>早起的鸟儿有虫吃</b></p><p>「三文」指很少的钱，意思是早起总会有些好处。</p>
