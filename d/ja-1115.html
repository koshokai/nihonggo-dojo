<p class="muted">日语每日一句 · 11月15日 · 季节</p><h1 lang="ja">七五三</h1><p class="py" lang="ja">しちごさん</p><p><b>七五三节</b></p><p>11月15日，为3岁、5岁的男孩和3岁、7岁的女孩祈求健康成长的节日，孩子穿和服去神社参拜，吃「千岁糖」。</p>
