<p class="muted">日语每日一句 · 11月22日 · 四字熟语</p><h1 lang="ja">一部始終</h1><p class="py" lang="ja">いちぶしじゅう</p><p><b>事情的全部经过；来龙去脉</b></p><p>「一部」原指一部书，意为从头到尾。注意中文&quot;始终&quot;多表示&quot;一直&quot;，而这里是&quot;从开始到结束的全部&quot;。</p>
