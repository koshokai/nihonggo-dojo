<p class="muted">日语每日一句 · 11月26日 · 四字熟语</p><h1 lang="ja">十人十色</h1><p class="py" lang="ja">じゅうにんといろ</p><p><b>十个人十个样；人各有异</b></p><p>指人的喜好、想法各不相同。注意「十色」读作「といろ」。相当于中文&quot;萝卜青菜，各有所爱&quot;。</p>
