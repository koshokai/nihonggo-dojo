<p class="muted">日语每日一句 · 12月1日 · 季节</p><h1 lang="ja">師走</h1><p class="py" lang="ja">しわす</p><p><b>腊月；十二月</b></p><p>旧历十二月的别称，现在也指十二月；民间说法是到了年底连老师都忙得到处奔走。</p>
