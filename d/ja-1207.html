<p class="muted">日语每日一句 · 12月7日 · 惯用句</p><h1 lang="ja">眉をひそめる</h1><p class="py" lang="ja">まゆをひそめる</p><p><b>皱眉（表示不快）</b></p><p>指对别人的言行感到不悦或担心而皱起眉头。</p>
