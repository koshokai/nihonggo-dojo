<p class="muted">日语每日一句 · 12月8日 · 谚语</p><h1 lang="ja">灯台下暗し</h1><p class="py" lang="ja">とうだいもとくらし</p><p><b>灯下黑</b></p><p>字面意思是「烛台（灯台）正下方是暗的」，比喻身边的事反而不易察觉。</p>
