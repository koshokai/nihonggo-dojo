<p class="muted">日语每日一句 · 12月13日 · 四字熟语</p><h1 lang="ja">一期一会</h1><p class="py" lang="ja">いちごいちえ</p><p><b>一生仅此一次的相遇；珍惜当下</b></p><p>源自茶道，意思是每次相会都可能是一生唯一的一次，所以要真诚对待。中文里没有这个固定说法。</p>
