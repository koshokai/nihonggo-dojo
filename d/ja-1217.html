<p class="muted">日语每日一句 · 12月17日 · 谚语</p><h1 lang="ja">鉄は熱いうちに打て</h1><p class="py" lang="ja">てつはあついうちにうて</p><p><b>趁热打铁</b></p><p>源自西方谚语，意思是要趁有利时机及时行动；也指人要趁年轻时接受锻炼。</p>
