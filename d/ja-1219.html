<p class="muted">日语每日一句 · 12月19日 · 谚语</p><h1 lang="ja">魚心あれば水心</h1><p class="py" lang="ja">うおごころあればみずごころ</p><p><b>投桃报李；你敬我一尺，我敬你一丈</b></p><p>意思是对方若有好意，自己也会以好意回报。</p>
