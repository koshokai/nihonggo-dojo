<p class="muted">日语每日一句 · 12月26日 · 谚语</p><h1 lang="ja">三つ子の魂百まで</h1><p class="py" lang="ja">みつごのたましいひゃくまで</p><p><b>三岁看老</b></p><p>意思是三岁孩子的性格到一百岁也不会变，与中文「三岁看大，七岁看老」相近。</p>
