<p class="muted">日语每日一句 · 12月28日 · 季节</p><h1 lang="ja">仕事納め</h1><p class="py" lang="ja">しごとおさめ</p><p><b>年末最后一天上班</b></p><p>一年工作的最后一天，政府机关一般是12月28日；新年第一天上班叫「仕事始め」。</p>
