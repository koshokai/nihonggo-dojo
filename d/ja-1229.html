<p class="muted">日语每日一句 · 12月29日 · 谚语</p><h1 lang="ja">備えあれば憂いなし</h1><p class="py" lang="ja">そなえあればうれいなし</p><p><b>有备无患</b></p><p>源自《尚书》「有备无患」，意思是事先做好准备，就不用担心。</p>
