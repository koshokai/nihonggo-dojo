<p class="muted">日语每日一句 · 12月30日 · 季节</p><h1 lang="ja">良いお年を</h1><p class="py" lang="ja">よいおとしを</p><p><b>祝你过个好年</b></p><p>年底分别时的问候语，是「良いお年をお迎えください」的省略，过了新年就不再用，改说「あけましておめでとう」。</p>
<h2>例句</h2><div class="ex"><div lang="ja">では、良いお年を。来年もよろしくお願いします。</div><div class="py" lang="ja">でわ、 よい おとしお。 らいねんも よろしく おねがいします。</div><div class="tr">那么，祝你过个好年！明年也请多关照。</div></div><a class="cta" href="../#home">在猫先生每天学一句 →</a><div class="pn"><a href="../d/ja-1229.html">← 12/29 備えあれば憂いなし</a><a href="../d/ja-1231.html">12/31 大晦日 →</a></div>
