<h1 lang="en">祈使句 Do … / Don&#x27;t … / Let&#x27;s …</h1><p><b>请……/ 不要……/ 我们……吧</b> · 基础</p><p>祈使句省略主语 you，直接用动词原形开头；否定在句首加 Don&#x27;t；提议一起做某事用 Let&#x27;s + 动词原形。语气可以用 please 缓和。</p><h2>例句</h2><div class="ex"><div lang="en">Please close the window.</div><div class="zh">请关上窗户。</div></div><div class="ex"><div lang="en">Don&#x27;t be late for class.</div><div class="zh">上课别迟到。</div></div><div class="ex"><div lang="en">Let&#x27;s take a break.</div><div class="zh">我们休息一下吧。</div></div><a class="cta" href="../#en/grammar">去英语道场练习 →</a>
