<h1 lang="ja">～をもって</h1><p><b>以……；于……（时间节点）</b> · JLPT N1</p><p>接续：名词＋をもって。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>本日<rt>ほんじつ</rt></ruby>をもって、<ruby>受付<rt>うけつけ</rt></ruby>を<ruby>終了<rt>しゅうりょう</rt></ruby>いたします。</div><div class="zh">今天起停止受理。</div></div><div class="ex"><div lang="ja">これをもちまして、<ruby>本日<rt>ほんじつ</rt></ruby>の<ruby>会<rt>かい</rt></ruby>を<ruby>終<rt>お</rt></ruby>わります。</div><div class="zh">今天的会议到此结束。</div></div><div class="ex"><div lang="ja"><ruby>書面<rt>しょめん</rt></ruby>をもってご<ruby>連絡<rt>れんらく</rt></ruby>いたします。</div><div class="zh">将以书面形式通知您。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>優秀<rt>ゆうしゅう</rt></ruby>な<ruby>成績<rt>せいせき</rt></ruby>をもって<ruby>卒業<rt>そつぎょう</rt></ruby>した。</div><div class="zh">他以优异的成绩毕业了。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
