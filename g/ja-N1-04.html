<h1 lang="ja">～といえども</h1><p><b>即使……也……</b> · JLPT N1</p><p>接续：名词／普通形＋といえども。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>専門<rt>せんもん</rt></ruby><ruby>家<rt>か</rt></ruby>といえども、<ruby>間違<rt>まちが</rt></ruby>えることはある。</div><div class="zh">即使是专家也会犯错。</div></div><div class="ex"><div lang="ja"><ruby>子供<rt>こども</rt></ruby>といえども、ルールは<ruby>守<rt>まも</rt></ruby>らなければならない。</div><div class="zh">即使是孩子也必须遵守规则。</div></div><div class="ex"><div lang="ja">いかに<ruby>忙<rt>いそが</rt></ruby>しいといえども、<ruby>食事<rt>しょくじ</rt></ruby>はとるべきだ。</div><div class="zh">再忙也应该吃饭。</div></div><div class="ex"><div lang="ja"><ruby>冬<rt>ふゆ</rt></ruby>といえども、この<ruby>地方<rt>ちほう</rt></ruby>は<ruby>暖<rt>あたた</rt></ruby>かい。</div><div class="zh">虽说是冬天，这个地区却很暖和。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
