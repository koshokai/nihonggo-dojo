<h1 lang="ja">～を余儀なくされる</h1><p><b>被迫……；不得不……</b> · JLPT N1</p><p>接续：名词＋を余儀なくされる。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>大雨<rt>おおあめ</rt></ruby>で、<ruby>試合<rt>しあい</rt></ruby>は<ruby>中止<rt>ちゅうし</rt></ruby>を<ruby>余儀<rt>よぎ</rt></ruby>なくされた。</div><div class="zh">因为大雨，比赛被迫中止。</div></div><div class="ex"><div lang="ja"><ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>倒産<rt>とうさん</rt></ruby>で、<ruby>転職<rt>てんしょく</rt></ruby>を<ruby>余儀<rt>よぎ</rt></ruby>なくされた。</div><div class="zh">公司倒闭，被迫换了工作。</div></div><div class="ex"><div lang="ja">けがのため、<ruby>引退<rt>いんたい</rt></ruby>を<ruby>余儀<rt>よぎ</rt></ruby>なくされた。</div><div class="zh">因为受伤被迫退役。</div></div><div class="ex"><div lang="ja"><ruby>住民<rt>じゅうみん</rt></ruby>は<ruby>避難<rt>ひなん</rt></ruby>を<ruby>余儀<rt>よぎ</rt></ruby>なくされました。</div><div class="zh">居民被迫避难。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
