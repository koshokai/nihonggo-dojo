<h1 lang="ja">～まじき</h1><p><b>不应有的……</b> · JLPT N1</p><p>接续：动词辞书形＋まじき＋名词（する→すまじき）。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>教師<rt>きょうし</rt></ruby>にあるまじき<ruby>行為<rt>こうい</rt></ruby>だ。</div><div class="zh">这是教师不该有的行为。</div></div><div class="ex"><div lang="ja">それは<ruby>政治<rt>せいじ</rt></ruby><ruby>家<rt>か</rt></ruby>として<ruby>許<rt>ゆる</rt></ruby>すまじき<ruby>発言<rt>はつげん</rt></ruby>だ。</div><div class="zh">那是作为政治家不可原谅的发言。</div></div><div class="ex"><div lang="ja"><ruby>学生<rt>がくせい</rt></ruby>にあるまじき<ruby>態度<rt>たいど</rt></ruby>です。</div><div class="zh">这是学生不该有的态度。</div></div><div class="ex"><div lang="ja"><ruby>医者<rt>いしゃ</rt></ruby>として、あるまじきミスだった。</div><div class="zh">作为医生，这是不应犯的错误。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
