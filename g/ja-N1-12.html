<h1 lang="ja">～きらいがある</h1><p><b>有……的（不好）倾向</b> · JLPT N1</p><p>接续：动词辞书形／名词の＋きらいがある。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>物事<rt>ものごと</rt></ruby>を<ruby>大<rt>おお</rt></ruby>げさに<ruby>言<rt>い</rt></ruby>うきらいがある。</div><div class="zh">他有把事情说得夸张的毛病。</div></div><div class="ex"><div lang="ja"><ruby>最近<rt>さいきん</rt></ruby>の<ruby>若者<rt>わかもの</rt></ruby>は<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>まないきらいがある。</div><div class="zh">最近的年轻人有不读书的倾向。</div></div><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>何<rt>なん</rt></ruby>でも<ruby>一人<rt>ひとり</rt></ruby>で<ruby>決<rt>き</rt></ruby>めるきらいがある。</div><div class="zh">她有什么都自己一个人决定的倾向。</div></div><div class="ex"><div lang="ja">この<ruby>会社<rt>かいしゃ</rt></ruby>は<ruby>保守<rt>ほしゅ</rt></ruby><ruby>的<rt>てき</rt></ruby>なきらいがある。</div><div class="zh">这家公司有些保守。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
