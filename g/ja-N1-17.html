<h1 lang="ja">～にもまして</h1><p><b>比……更……</b> · JLPT N1</p><p>接续：名词＋にもまして。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>今年<rt>ことし</rt></ruby>は<ruby>去年<rt>きょねん</rt></ruby>にもまして<ruby>暑<rt>あつ</rt></ruby>い。</div><div class="zh">今年比去年更热。</div></div><div class="ex"><div lang="ja"><ruby>以前<rt>いぜん</rt></ruby>にもまして、<ruby>仕事<rt>しごと</rt></ruby>が<ruby>忙<rt>いそが</rt></ruby>しくなった。</div><div class="zh">工作比以前更忙了。</div></div><div class="ex"><div lang="ja"><ruby>何<rt>なん</rt></ruby>にもまして、<ruby>健康<rt>けんこう</rt></ruby>が<ruby>大切<rt>たいせつ</rt></ruby>だ。</div><div class="zh">健康比什么都重要。</div></div><div class="ex"><div lang="ja"><ruby>前回<rt>ぜんかい</rt></ruby>にもまして、すばらしい<ruby>演奏<rt>えんそう</rt></ruby>だった。</div><div class="zh">是比上次更精彩的演奏。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
