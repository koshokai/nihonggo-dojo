<h1 lang="ja">～をおいて</h1><p><b>除了……之外（没有）</b> · JLPT N1</p><p>接续：名词＋をおいて＋否定。</p><h2>例句</h2><div class="ex"><div lang="ja">この<ruby>仕事<rt>しごと</rt></ruby>を<ruby>任<rt>まか</rt></ruby>せられるのは、<ruby>彼<rt>かれ</rt></ruby>をおいてほかにいない。</div><div class="zh">能托付这项工作的，除了他没有别人。</div></div><div class="ex"><div lang="ja"><ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>うなら、<ruby>今<rt>いま</rt></ruby>をおいてほかにない。</div><div class="zh">要谈的话，除了现在没有别的时机。</div></div><div class="ex"><div lang="ja">この<ruby>問題<rt>もんだい</rt></ruby>を<ruby>解決<rt>かいけつ</rt></ruby>できるのは、あなたをおいていません。</div><div class="zh">能解决这个问题的只有你。</div></div><div class="ex"><div lang="ja"><ruby>旅行<rt>りょこう</rt></ruby>するなら、<ruby>京都<rt>きょうと</rt></ruby>をおいてほかにない。</div><div class="zh">要旅行的话，非京都莫属。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
