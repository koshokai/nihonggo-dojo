<h1 lang="ja">～とは</h1><p><b>竟然……（惊讶）</b> · JLPT N1</p><p>接续：普通形＋とは。</p><h2>例句</h2><div class="ex"><div lang="ja">こんなところで<ruby>会<rt>あ</rt></ruby>うとは<ruby>思<rt>おも</rt></ruby>わなかった。</div><div class="zh">没想到会在这种地方遇见。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>が<ruby>優勝<rt>ゆうしょう</rt></ruby>するとは、<ruby>誰<rt>だれ</rt></ruby>も<ruby>予想<rt>よそう</rt></ruby>しなかった。</div><div class="zh">谁都没想到他会夺冠。</div></div><div class="ex"><div lang="ja"><ruby>一人<rt>ひとり</rt></ruby>で<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>食<rt>た</rt></ruby>べたとは、<ruby>驚<rt>おどろ</rt></ruby>いた。</div><div class="zh">竟然一个人全吃完了，真吃惊。</div></div><div class="ex"><div lang="ja">あの<ruby>二人<rt>ふたり</rt></ruby>が<ruby>結婚<rt>けっこん</rt></ruby>するとは。</div><div class="zh">那两个人竟然要结婚。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
