<h1 lang="ja">～んがため</h1><p><b>为了……</b> · JLPT N1</p><p>接续：动词ない形去ない＋んがため（する→せんがため）。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>勝<rt>か</rt></ruby>たんがために、<ruby>厳<rt>きび</rt></ruby>しい<ruby>練習<rt>れんしゅう</rt></ruby>に<ruby>耐<rt>た</rt></ruby>えた。</div><div class="zh">为了获胜，忍受了严格的训练。</div></div><div class="ex"><div lang="ja"><ruby>生<rt>い</rt></ruby>きんがため、<ruby>必死<rt>ひっし</rt></ruby>に<ruby>働<rt>はたら</rt></ruby>いた。</div><div class="zh">为了活下去拼命工作。</div></div><div class="ex"><div lang="ja"><ruby>合格<rt>ごうかく</rt></ruby>せんがため、<ruby>毎晩<rt>まいばん</rt></ruby><ruby>遅<rt>おそ</rt></ruby>くまで<ruby>勉強<rt>べんきょう</rt></ruby>した。</div><div class="zh">为了合格每晚学到很晚。</div></div><div class="ex"><div lang="ja"><ruby>家族<rt>かぞく</rt></ruby>を<ruby>守<rt>まも</rt></ruby>らんがために<ruby>戦<rt>たたか</rt></ruby>った。</div><div class="zh">为了保护家人而战。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
