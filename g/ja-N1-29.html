<h1 lang="ja">～に即して</h1><p><b>依照……；根据……</b> · JLPT N1</p><p>接续：名词＋に即して。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>事実<rt>じじつ</rt></ruby>に<ruby>即<rt>そく</rt></ruby>して<ruby>報告<rt>ほうこく</rt></ruby>してください。</div><div class="zh">请根据事实汇报。</div></div><div class="ex"><div lang="ja"><ruby>法律<rt>ほうりつ</rt></ruby>に<ruby>即<rt>そく</rt></ruby>して<ruby>判断<rt>はんだん</rt></ruby>する。</div><div class="zh">依法判断。</div></div><div class="ex"><div lang="ja"><ruby>現状<rt>げんじょう</rt></ruby>に<ruby>即<rt>そく</rt></ruby>した<ruby>対策<rt>たいさく</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>だ。</div><div class="zh">需要符合现状的对策。</div></div><div class="ex"><div lang="ja"><ruby>規則<rt>きそく</rt></ruby>に<ruby>即<rt>そく</rt></ruby>して<ruby>処理<rt>しょり</rt></ruby>します。</div><div class="zh">按规定处理。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
