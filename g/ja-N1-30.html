<h1 lang="ja">～かたがた</h1><p><b>顺便……；兼……</b> · JLPT N1</p><p>接续：名词＋かたがた。</p><h2>例句</h2><div class="ex"><div lang="ja">お<ruby>礼<rt>れい</rt></ruby>かたがた、ご<ruby>挨拶<rt>あいさつ</rt></ruby>に<ruby>伺<rt>うかが</rt></ruby>いました。</div><div class="zh">前来致谢，顺便问候。</div></div><div class="ex"><div lang="ja"><ruby>散歩<rt>さんぽ</rt></ruby>かたがた、<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>った。</div><div class="zh">散步顺便去买了东西。</div></div><div class="ex"><div lang="ja">ご<ruby>報告<rt>ほうこく</rt></ruby>かたがた、お<ruby>願<rt>ねが</rt></ruby>いがあります。</div><div class="zh">来汇报，顺便有一事相求。</div></div><div class="ex"><div lang="ja">お<ruby>見舞<rt>みま</rt></ruby>いかたがた、<ruby>近況<rt>きんきょう</rt></ruby>を<ruby>伺<rt>うかが</rt></ruby>いに<ruby>来<rt>き</rt></ruby>た。</div><div class="zh">来探望，顺便问问近况。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
