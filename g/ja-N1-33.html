<h1 lang="ja">～をものともせずに</h1><p><b>不把……当回事；不顾……</b> · JLPT N1</p><p>接续：名词＋をものともせずに。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>はけがをものともせずに、<ruby>試合<rt>しあい</rt></ruby>に<ruby>出<rt>で</rt></ruby>た。</div><div class="zh">他不顾受伤参加了比赛。</div></div><div class="ex"><div lang="ja"><ruby>強<rt>つよ</rt></ruby>い<ruby>風<rt>かぜ</rt></ruby>をものともせずに、<ruby>船<rt>ふね</rt></ruby>は<ruby>進<rt>すす</rt></ruby>んだ。</div><div class="zh">船顶着强风前进。</div></div><div class="ex"><div lang="ja"><ruby>周囲<rt>しゅうい</rt></ruby>の<ruby>批判<rt>ひはん</rt></ruby>をものともせずに、<ruby>計画<rt>けいかく</rt></ruby>を<ruby>進<rt>すす</rt></ruby>めた。</div><div class="zh">不顾周围的批评推进了计划。</div></div><div class="ex"><div lang="ja"><ruby>困難<rt>こんなん</rt></ruby>をものともせずに、<ruby>夢<rt>ゆめ</rt></ruby>を<ruby>実現<rt>じつげん</rt></ruby>した。</div><div class="zh">不畏困难实现了梦想。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
