<h1 lang="ja">～をきっかけに</h1><p><b>以……为契机</b> · JLPT N2</p><p>接续：名词＋をきっかけに。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>留学<rt>りゅうがく</rt></ruby>をきっかけに、<ruby>料理<rt>りょうり</rt></ruby>を<ruby>始<rt>はじ</rt></ruby>めました。</div><div class="zh">以留学为契机开始做饭。</div></div><div class="ex"><div lang="ja"><ruby>病気<rt>びょうき</rt></ruby>をきっかけに、たばこをやめた。</div><div class="zh">以生病为契机戒了烟。</div></div><div class="ex"><div lang="ja">この<ruby>映画<rt>えいが</rt></ruby>をきっかけに、<ruby>日本<rt>にほん</rt></ruby>に<ruby>興味<rt>きょうみ</rt></ruby>を<ruby>持<rt>も</rt></ruby>ちました。</div><div class="zh">因为这部电影对日本产生了兴趣。</div></div><div class="ex"><div lang="ja"><ruby>結婚<rt>けっこん</rt></ruby>をきっかけに、<ruby>仕事<rt>しごと</rt></ruby>を<ruby>変<rt>か</rt></ruby>えました。</div><div class="zh">以结婚为契机换了工作。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
