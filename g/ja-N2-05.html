<h1 lang="ja">～に応じて</h1><p><b>根据……；按照……</b> · JLPT N2</p><p>接续：名词＋に応じて。</p><h2>例句</h2><div class="ex"><div lang="ja">レベルに<ruby>応<rt>おう</rt></ruby>じて、クラスを<ruby>分<rt>わ</rt></ruby>けます。</div><div class="zh">根据水平分班。</div></div><div class="ex"><div lang="ja"><ruby>季節<rt>きせつ</rt></ruby>に<ruby>応<rt>おう</rt></ruby>じて、メニューが<ruby>変<rt>か</rt></ruby>わります。</div><div class="zh">菜单随季节变化。</div></div><div class="ex"><div lang="ja"><ruby>収入<rt>しゅうにゅう</rt></ruby>に<ruby>応<rt>おう</rt></ruby>じて、<ruby>税金<rt>ぜいきん</rt></ruby>を<ruby>払<rt>はら</rt></ruby>います。</div><div class="zh">按收入纳税。</div></div><div class="ex"><div lang="ja">お<ruby>客<rt>きゃく</rt></ruby><ruby>様<rt>さま</rt></ruby>の<ruby>希望<rt>きぼう</rt></ruby>に<ruby>応<rt>おう</rt></ruby>じて、プランを<ruby>作<rt>つく</rt></ruby>ります。</div><div class="zh">根据客人的要求制定方案。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
