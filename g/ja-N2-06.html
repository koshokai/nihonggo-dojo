<h1 lang="ja">～にかかわらず</h1><p><b>无论……都……</b> · JLPT N2</p><p>接续：名词＋にかかわらず。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>年齢<rt>ねんれい</rt></ruby>にかかわらず、<ruby>誰<rt>だれ</rt></ruby>でも<ruby>参加<rt>さんか</rt></ruby>できます。</div><div class="zh">无论年龄，谁都可以参加。</div></div><div class="ex"><div lang="ja"><ruby>天気<rt>てんき</rt></ruby>にかかわらず、<ruby>試合<rt>しあい</rt></ruby>は<ruby>行<rt>おこな</rt></ruby>われます。</div><div class="zh">无论天气如何，比赛照常进行。</div></div><div class="ex"><div lang="ja"><ruby>経験<rt>けいけん</rt></ruby>の<ruby>有無<rt>うむ</rt></ruby>にかかわらず、<ruby>歓迎<rt>かんげい</rt></ruby>します。</div><div class="zh">不论有无经验都欢迎。</div></div><div class="ex"><div lang="ja"><ruby>結果<rt>けっか</rt></ruby>にかかわらず、<ruby>最後<rt>さいご</rt></ruby>まで<ruby>頑張<rt>がんば</rt></ruby>りたい。</div><div class="zh">不管结果如何，都想坚持到最后。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
