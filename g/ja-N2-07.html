<h1 lang="ja">～を問わず</h1><p><b>不论……</b> · JLPT N2</p><p>接续：名词＋を問わず。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>経験<rt>けいけん</rt></ruby>の<ruby>有無<rt>うむ</rt></ruby>を<ruby>問<rt>と</rt></ruby>わず、<ruby>応募<rt>おうぼ</rt></ruby>できます。</div><div class="zh">不论有无经验都可以报名。</div></div><div class="ex"><div lang="ja">この<ruby>店<rt>みせ</rt></ruby>は<ruby>昼夜<rt>ちゅうや</rt></ruby>を<ruby>問<rt>と</rt></ruby>わず<ruby>込<rt>こ</rt></ruby>んでいる。</div><div class="zh">这家店不论白天晚上都很拥挤。</div></div><div class="ex"><div lang="ja"><ruby>男女<rt>だんじょ</rt></ruby>を<ruby>問<rt>と</rt></ruby>わず<ruby>人気<rt>にんき</rt></ruby>があります。</div><div class="zh">不论男女都很受欢迎。</div></div><div class="ex"><div lang="ja"><ruby>国籍<rt>こくせき</rt></ruby>を<ruby>問<rt>と</rt></ruby>わず、<ruby>留学<rt>りゅうがく</rt></ruby><ruby>生<rt>せい</rt></ruby>を<ruby>受<rt>う</rt></ruby>け<ruby>入<rt>い</rt></ruby>れている。</div><div class="zh">不论国籍都接收留学生。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
