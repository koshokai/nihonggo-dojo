<h1 lang="ja">～かねる</h1><p><b>难以……；不能……</b> · JLPT N2</p><p>接续：动词ます形去ます＋かねる（礼貌的拒绝）。</p><h2>例句</h2><div class="ex"><div lang="ja">その<ruby>件<rt>けん</rt></ruby>にはお<ruby>答<rt>こた</rt></ruby>えしかねます。</div><div class="zh">那件事恕难奉告。</div></div><div class="ex"><div lang="ja">ご<ruby>希望<rt>きぼう</rt></ruby>には<ruby>応<rt>おう</rt></ruby>じかねます。</div><div class="zh">恕难满足您的要求。</div></div><div class="ex"><div lang="ja"><ruby>見<rt>み</rt></ruby>るに<ruby>見<rt>み</rt></ruby>かねて、<ruby>手伝<rt>てつだ</rt></ruby>った。</div><div class="zh">看不下去，就帮了忙。</div></div><div class="ex"><div lang="ja"><ruby>私<rt>わたし</rt></ruby><ruby>一人<rt>ひとり</rt></ruby>では<ruby>決<rt>き</rt></ruby>めかねます。</div><div class="zh">我一个人难以决定。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
