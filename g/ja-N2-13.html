<h1 lang="ja">～どころか</h1><p><b>别说……反而……</b> · JLPT N2</p><p>接续：普通形＋どころか。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>貯金<rt>ちょきん</rt></ruby>するどころか、<ruby>借金<rt>しゃっきん</rt></ruby>が<ruby>増<rt>ふ</rt></ruby>えた。</div><div class="zh">别说存钱了，欠债反而增加了。</div></div><div class="ex"><div lang="ja"><ruby>休<rt>やす</rt></ruby>むどころか、<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べる<ruby>時間<rt>じかん</rt></ruby>もない。</div><div class="zh">别说休息了，连吃午饭的时间都没有。</div></div><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>はやむどころか、ますます<ruby>強<rt>つよ</rt></ruby>くなった。</div><div class="zh">雨非但没停，反而越下越大。</div></div><div class="ex"><div lang="ja"><ruby>英語<rt>えいご</rt></ruby>どころか、<ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>も<ruby>話<rt>はな</rt></ruby>せない。</div><div class="zh">别说英语了，连日语都不会说。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
