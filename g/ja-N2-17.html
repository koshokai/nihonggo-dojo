<h1 lang="ja">～をもとに</h1><p><b>以……为基础</b> · JLPT N2</p><p>接续：名词＋をもとに（して）。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>実話<rt>じつわ</rt></ruby>をもとにした<ruby>映画<rt>えいが</rt></ruby>です。</div><div class="zh">是根据真实故事改编的电影。</div></div><div class="ex"><div lang="ja">アンケートの<ruby>結果<rt>けっか</rt></ruby>をもとに、<ruby>商品<rt>しょうひん</rt></ruby>を<ruby>改善<rt>かいぜん</rt></ruby>した。</div><div class="zh">根据问卷结果改进了商品。</div></div><div class="ex"><div lang="ja">この<ruby>資料<rt>しりょう</rt></ruby>をもとに、レポートを<ruby>書<rt>か</rt></ruby>いてください。</div><div class="zh">请根据这份资料写报告。</div></div><div class="ex"><div lang="ja"><ruby>経験<rt>けいけん</rt></ruby>をもとに、アドバイスします。</div><div class="zh">根据经验给出建议。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
