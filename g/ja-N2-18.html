<h1 lang="ja">～を中心に</h1><p><b>以……为中心</b> · JLPT N2</p><p>接续：名词＋を中心に（して）。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>東京<rt>とうきょう</rt></ruby>を<ruby>中心<rt>ちゅうしん</rt></ruby>に、<ruby>大雨<rt>おおあめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>りました。</div><div class="zh">以东京为中心下了大雨。</div></div><div class="ex"><div lang="ja"><ruby>若者<rt>わかもの</rt></ruby>を<ruby>中心<rt>ちゅうしん</rt></ruby>に<ruby>人気<rt>にんき</rt></ruby>がある。</div><div class="zh">以年轻人为主很受欢迎。</div></div><div class="ex"><div lang="ja"><ruby>駅<rt>えき</rt></ruby>を<ruby>中心<rt>ちゅうしん</rt></ruby>に、<ruby>町<rt>まち</rt></ruby>が<ruby>発展<rt>はってん</rt></ruby>した。</div><div class="zh">城市以车站为中心发展起来。</div></div><div class="ex"><div lang="ja">この<ruby>会社<rt>かいしゃ</rt></ruby>は<ruby>輸出<rt>ゆしゅつ</rt></ruby>を<ruby>中心<rt>ちゅうしん</rt></ruby>に<ruby>成長<rt>せいちょう</rt></ruby>してきた。</div><div class="zh">这家公司以出口为主发展起来。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
