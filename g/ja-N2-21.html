<h1 lang="ja">～上で</h1><p><b>在……之后；在……方面</b> · JLPT N2</p><p>接续：动词た形／名词の＋上で；动词辞书形＋上で：在……方面。</p><h2>例句</h2><div class="ex"><div lang="ja">よく<ruby>考<rt>かんが</rt></ruby>えた<ruby>上<rt>うえ</rt></ruby>で、<ruby>決<rt>き</rt></ruby>めてください。</div><div class="zh">请好好考虑之后再决定。</div></div><div class="ex"><div lang="ja"><ruby>相談<rt>そうだん</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>で、お<ruby>返事<rt>へんじ</rt></ruby>します。</div><div class="zh">商量之后再回复您。</div></div><div class="ex"><div lang="ja"><ruby>外国<rt>がいこく</rt></ruby><ruby>語<rt>ご</rt></ruby>を<ruby>学<rt>まな</rt></ruby>ぶ<ruby>上<rt>うえ</rt></ruby>で、<ruby>大切<rt>たいせつ</rt></ruby>なのは<ruby>続<rt>つづ</rt></ruby>けることだ。</div><div class="zh">学外语时，重要的是坚持。</div></div><div class="ex"><div lang="ja"><ruby>説明<rt>せつめい</rt></ruby><ruby>書<rt>しょ</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだ<ruby>上<rt>うえ</rt></ruby>で<ruby>使<rt>つか</rt></ruby>ってください。</div><div class="zh">请读了说明书之后再使用。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
