<h1 lang="ja">～からこそ</h1><p><b>正因为……</b> · JLPT N2</p><p>接续：普通形＋からこそ。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>好<rt>す</rt></ruby>きだからこそ、<ruby>厳<rt>きび</rt></ruby>しく<ruby>言<rt>い</rt></ruby>うのです。</div><div class="zh">正因为喜欢才说得严厉。</div></div><div class="ex"><div lang="ja"><ruby>努力<rt>どりょく</rt></ruby>したからこそ、<ruby>成功<rt>せいこう</rt></ruby>できた。</div><div class="zh">正因为努力了才能成功。</div></div><div class="ex"><div lang="ja"><ruby>難<rt>むずか</rt></ruby>しいからこそ、やりがいがある。</div><div class="zh">正因为难才有干劲。</div></div><div class="ex"><div lang="ja"><ruby>家族<rt>かぞく</rt></ruby>がいるからこそ、<ruby>頑張<rt>がんば</rt></ruby>れる。</div><div class="zh">正因为有家人，才能坚持下去。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
