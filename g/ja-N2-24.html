<h1 lang="ja">～以上は</h1><p><b>既然……就……</b> · JLPT N2</p><p>接续：普通形＋以上（は）。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>学生<rt>がくせい</rt></ruby>である<ruby>以上<rt>いじょう</rt></ruby>は、<ruby>勉強<rt>べんきょう</rt></ruby>するべきだ。</div><div class="zh">既然是学生，就应该学习。</div></div><div class="ex"><div lang="ja"><ruby>引<rt>ひ</rt></ruby>き<ruby>受<rt>う</rt></ruby>けた<ruby>以上<rt>いじょう</rt></ruby>は、<ruby>責任<rt>せきにん</rt></ruby>を<ruby>持<rt>も</rt></ruby>ってやります。</div><div class="zh">既然接下了，就负责到底。</div></div><div class="ex"><div lang="ja"><ruby>決<rt>き</rt></ruby>めた<ruby>以上<rt>いじょう</rt></ruby>は、<ruby>変<rt>か</rt></ruby>えるつもりはない。</div><div class="zh">既然决定了，就不打算改变。</div></div><div class="ex"><div lang="ja"><ruby>契約<rt>けいやく</rt></ruby>した<ruby>以上<rt>いじょう</rt></ruby>は、<ruby>従<rt>したが</rt></ruby>わなければならない。</div><div class="zh">既然签了合同就必须遵守。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
