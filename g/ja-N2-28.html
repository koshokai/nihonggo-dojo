<h1 lang="ja">～ようがない</h1><p><b>没办法……</b> · JLPT N2</p><p>接续：动词ます形去ます＋ようがない。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>連絡<rt>れんらく</rt></ruby><ruby>先<rt>さき</rt></ruby>がわからないので、<ruby>連絡<rt>れんらく</rt></ruby>しようがない。</div><div class="zh">不知道联系方式，没法联系。</div></div><div class="ex"><div lang="ja">こんなに<ruby>壊<rt>こわ</rt></ruby>れていては、<ruby>直<rt>なお</rt></ruby>しようがない。</div><div class="zh">坏成这样，没法修了。</div></div><div class="ex"><div lang="ja"><ruby>言<rt>い</rt></ruby>いようがないほど<ruby>美<rt>うつく</rt></ruby>しい<ruby>景色<rt>けしき</rt></ruby>だ。</div><div class="zh">美得无法形容的景色。</div></div><div class="ex"><div lang="ja"><ruby>材料<rt>ざいりょう</rt></ruby>がないので、<ruby>作<rt>つく</rt></ruby>りようがありません。</div><div class="zh">没有材料，没法做。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
