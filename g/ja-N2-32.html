<h1 lang="ja">～に反して</h1><p><b>与……相反</b> · JLPT N2</p><p>接续：名词＋に反して。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>予想<rt>よそう</rt></ruby>に<ruby>反<rt>はん</rt></ruby>して、<ruby>試験<rt>しけん</rt></ruby>は<ruby>簡単<rt>かんたん</rt></ruby>だった。</div><div class="zh">与预想相反，考试很简单。</div></div><div class="ex"><div lang="ja"><ruby>親<rt>おや</rt></ruby>の<ruby>期待<rt>きたい</rt></ruby>に<ruby>反<rt>はん</rt></ruby>して、<ruby>彼<rt>かれ</rt></ruby>は<ruby>大学<rt>だいがく</rt></ruby>に<ruby>行<rt>い</rt></ruby>かなかった。</div><div class="zh">与父母的期望相反，他没上大学。</div></div><div class="ex"><div lang="ja"><ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>に<ruby>反<rt>はん</rt></ruby>して、<ruby>晴<rt>は</rt></ruby>れました。</div><div class="zh">和天气预报相反，天晴了。</div></div><div class="ex"><div lang="ja"><ruby>規則<rt>きそく</rt></ruby>に<ruby>反<rt>はん</rt></ruby>する<ruby>行為<rt>こうい</rt></ruby>は<ruby>許<rt>ゆる</rt></ruby>されない。</div><div class="zh">违反规定的行为不被允许。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
