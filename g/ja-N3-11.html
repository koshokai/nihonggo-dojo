<h1 lang="ja">～ために（原因）</h1><p><b>因为……</b> · JLPT N3</p><p>接续：普通形／名词の＋ために，多用于书面。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>大雪<rt>おおゆき</rt></ruby>のために、<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>止<rt>と</rt></ruby>まりました。</div><div class="zh">因为大雪，电车停运了。</div></div><div class="ex"><div lang="ja"><ruby>事故<rt>じこ</rt></ruby>があったために、<ruby>道<rt>みち</rt></ruby>が<ruby>込<rt>こ</rt></ruby>んでいます。</div><div class="zh">因为发生了事故，路上很堵。</div></div><div class="ex"><div lang="ja"><ruby>病気<rt>びょうき</rt></ruby>のために、<ruby>学校<rt>がっこう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>みました。</div><div class="zh">因为生病没去上学。</div></div><div class="ex"><div lang="ja"><ruby>台風<rt>たいふう</rt></ruby>のために、<ruby>試合<rt>しあい</rt></ruby>は<ruby>中止<rt>ちゅうし</rt></ruby>になりました。</div><div class="zh">因为台风，比赛取消了。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
