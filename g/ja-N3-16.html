<h1 lang="ja">～たびに</h1><p><b>每当……</b> · JLPT N3</p><p>接续：动词辞书形／名词の＋たびに。</p><h2>例句</h2><div class="ex"><div lang="ja">この<ruby>歌<rt>うた</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くたびに、<ruby>故郷<rt>こきょう</rt></ruby>を<ruby>思<rt>おも</rt></ruby>い<ruby>出<rt>だ</rt></ruby>します。</div><div class="zh">每次听这首歌都会想起故乡。</div></div><div class="ex"><div lang="ja"><ruby>旅行<rt>りょこう</rt></ruby>のたびに、お<ruby>土産<rt>みやげ</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。</div><div class="zh">每次旅行都买特产。</div></div><div class="ex"><div lang="ja"><ruby>会<rt>あ</rt></ruby>うたびに、<ruby>彼女<rt>かのじょ</rt></ruby>はきれいになります。</div><div class="zh">每次见面她都变得更漂亮。</div></div><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るたびに、この<ruby>道<rt>みち</rt></ruby>は<ruby>込<rt>こ</rt></ruby>みます。</div><div class="zh">每次下雨这条路都会堵。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
