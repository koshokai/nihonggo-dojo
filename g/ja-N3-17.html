<h1 lang="ja">～おかげで</h1><p><b>多亏……</b> · JLPT N3</p><p>接续：普通形／名词の＋おかげで（好结果）。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>先生<rt>せんせい</rt></ruby>のおかげで、<ruby>合格<rt>ごうかく</rt></ruby>できました。</div><div class="zh">多亏了老师，我才考上了。</div></div><div class="ex"><div lang="ja"><ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>したおかげで、<ruby>上手<rt>じょうず</rt></ruby>になりました。</div><div class="zh">多亏每天练习，变好了。</div></div><div class="ex"><div lang="ja"><ruby>天気<rt>てんき</rt></ruby>がよかったおかげで、<ruby>楽<rt>たの</rt></ruby>しい<ruby>旅行<rt>りょこう</rt></ruby>になりました。</div><div class="zh">多亏天气好，旅行很愉快。</div></div><div class="ex"><div lang="ja"><ruby>皆<rt>みな</rt></ruby>さんのおかげで、<ruby>成功<rt>せいこう</rt></ruby>しました。</div><div class="zh">多亏大家，成功了。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
