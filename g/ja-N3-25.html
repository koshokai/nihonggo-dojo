<h1 lang="ja">～ても</h1><p><b>即使……也……</b> · JLPT N3</p><p>接续：动词て形＋も；い形容词去い＋くても。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っても、<ruby>出<rt>で</rt></ruby>かけます。</div><div class="zh">即使下雨也要出门。</div></div><div class="ex"><div lang="ja">いくら<ruby>食<rt>た</rt></ruby>べても、<ruby>太<rt>ふと</rt></ruby>りません。</div><div class="zh">怎么吃都不胖。</div></div><div class="ex"><div lang="ja"><ruby>高<rt>たか</rt></ruby>くても、<ruby>買<rt>か</rt></ruby>いたいです。</div><div class="zh">即使贵也想买。</div></div><div class="ex"><div lang="ja">わからなくても、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。</div><div class="zh">不明白也没关系。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
