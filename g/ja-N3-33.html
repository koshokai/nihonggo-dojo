<h1 lang="ja">～最中に</h1><p><b>正在……的时候</b> · JLPT N3</p><p>接续：动词ている形／名词の＋最中に。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>会議<rt>かいぎ</rt></ruby>の<ruby>最中<rt>さいちゅう</rt></ruby>に、<ruby>電話<rt>でんわ</rt></ruby>が<ruby>鳴<rt>な</rt></ruby>りました。</div><div class="zh">正在开会的时候电话响了。</div></div><div class="ex"><div lang="ja"><ruby>食事<rt>しょくじ</rt></ruby>をしている<ruby>最中<rt>さいちゅう</rt></ruby>に、<ruby>地震<rt>じしん</rt></ruby>が<ruby>起<rt>お</rt></ruby>きました。</div><div class="zh">正在吃饭的时候发生了地震。</div></div><div class="ex"><div lang="ja"><ruby>試合<rt>しあい</rt></ruby>の<ruby>最中<rt>さいちゅう</rt></ruby>に、<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>り<ruby>出<rt>だ</rt></ruby>しました。</div><div class="zh">比赛进行中下起了雨。</div></div><div class="ex"><div lang="ja"><ruby>話<rt>はな</rt></ruby>している<ruby>最中<rt>さいちゅう</rt></ruby>に、<ruby>寝<rt>ね</rt></ruby>てしまった。</div><div class="zh">正说着话就睡着了。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
