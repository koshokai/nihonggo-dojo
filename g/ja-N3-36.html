<h1 lang="ja">～かわりに</h1><p><b>代替……；作为交换</b> · JLPT N3</p><p>接续：动词辞书形／名词の＋かわりに。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>父<rt>ちち</rt></ruby>のかわりに、<ruby>私<rt>わたし</rt></ruby>が<ruby>会議<rt>かいぎ</rt></ruby>に<ruby>出<rt>で</rt></ruby>ました。</div><div class="zh">我代替父亲出席了会议。</div></div><div class="ex"><div lang="ja"><ruby>英語<rt>えいご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えるかわりに、<ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてもらいます。</div><div class="zh">我教英语，作为交换请对方教我日语。</div></div><div class="ex"><div lang="ja">ペンのかわりに<ruby>鉛筆<rt>えんぴつ</rt></ruby>を<ruby>使<rt>つか</rt></ruby>ってください。</div><div class="zh">请用铅笔代替钢笔。</div></div><div class="ex"><div lang="ja"><ruby>今日<rt>きょう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>むかわりに、<ruby>明日<rt>あした</rt></ruby>たくさん<ruby>働<rt>はたら</rt></ruby>きます。</div><div class="zh">今天休息，明天多干点。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
