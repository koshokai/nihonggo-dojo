<h1 lang="ja">～てたまらない</h1><p><b>……得受不了</b> · JLPT N3</p><p>接续：动词て形／い形容词去い＋くてたまらない。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>暑<rt>あつ</rt></ruby>くてたまりません。</div><div class="zh">热得受不了。</div></div><div class="ex"><div lang="ja"><ruby>家族<rt>かぞく</rt></ruby>に<ruby>会<rt>あ</rt></ruby>いたくてたまらない。</div><div class="zh">想家人想得不得了。</div></div><div class="ex"><div lang="ja"><ruby>合格<rt>ごうかく</rt></ruby>して、うれしくてたまりません。</div><div class="zh">考上了，高兴得不得了。</div></div><div class="ex"><div lang="ja"><ruby>歯<rt>は</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>くてたまらない。</div><div class="zh">牙疼得受不了。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
