<h1 lang="ja">～つもりだ</h1><p><b>打算……</b> · JLPT N4</p><p>接续：动词辞书形／ない形＋つもりだ。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>来年<rt>らいねん</rt></ruby>、<ruby>日本<rt>にほん</rt></ruby>に<ruby>留学<rt>りゅうがく</rt></ruby>するつもりです。</div><div class="zh">明年打算去日本留学。</div></div><div class="ex"><div lang="ja"><ruby>今日<rt>きょう</rt></ruby>はどこへも<ruby>行<rt>い</rt></ruby>かないつもりです。</div><div class="zh">今天打算哪儿也不去。</div></div><div class="ex"><div lang="ja"><ruby>夏休<rt>なつやす</rt></ruby>みに<ruby>車<rt>くるま</rt></ruby>の<ruby>免許<rt>めんきょ</rt></ruby>を<ruby>取<rt>と</rt></ruby>るつもりです。</div><div class="zh">暑假打算考驾照。</div></div><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>と<ruby>結婚<rt>けっこん</rt></ruby>するつもりです。</div><div class="zh">打算和她结婚。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-01.html">← ～たことがある</a><a href="../g/ja-N4-03.html">～ようと思う →</a></div>
