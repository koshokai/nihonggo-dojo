<h1 lang="ja">～ようと思う</h1><p><b>想要……（意志）</b> · JLPT N4</p><p>接续：动词意志形＋と思う。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>家<rt>いえ</rt></ruby>でゆっくりしようと<ruby>思<rt>おも</rt></ruby>います。</div><div class="zh">周末想在家好好休息。</div></div><div class="ex"><div lang="ja"><ruby>来年<rt>らいねん</rt></ruby>から<ruby>料理<rt>りょうり</rt></ruby>を<ruby>習<rt>なら</rt></ruby>おうと<ruby>思<rt>おも</rt></ruby>います。</div><div class="zh">想从明年开始学做饭。</div></div><div class="ex"><div lang="ja"><ruby>今晩<rt>こんばん</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>ようと<ruby>思<rt>おも</rt></ruby>います。</div><div class="zh">今晚想早点睡。</div></div><div class="ex"><div lang="ja"><ruby>新<rt>あたら</rt></ruby>しいパソコンを<ruby>買<rt>か</rt></ruby>おうと<ruby>思<rt>おも</rt></ruby>っています。</div><div class="zh">正想着买台新电脑。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-02.html">← ～つもりだ</a><a href="../g/ja-N4-04.html">～なければならない →</a></div>
