<h1 lang="ja">～なければならない</h1><p><b>必须……</b> · JLPT N4</p><p>接续：动词ない形去ない＋なければならない。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>までにレポートを<ruby>出<rt>だ</rt></ruby>さなければなりません。</div><div class="zh">明天之前必须交报告。</div></div><div class="ex"><div lang="ja"><ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>まなければなりません。</div><div class="zh">必须吃药。</div></div><div class="ex"><div lang="ja"><ruby>毎日<rt>まいにち</rt></ruby><ruby>漢字<rt>かんじ</rt></ruby>を<ruby>練習<rt>れんしゅう</rt></ruby>しなければなりません。</div><div class="zh">每天必须练汉字。</div></div><div class="ex"><div lang="ja">もう<ruby>帰<rt>かえ</rt></ruby>らなければなりません。</div><div class="zh">我必须回去了。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-03.html">← ～ようと思う</a><a href="../g/ja-N4-05.html">～なくてもいい →</a></div>
