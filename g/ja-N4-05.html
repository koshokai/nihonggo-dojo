<h1 lang="ja">～なくてもいい</h1><p><b>不……也可以</b> · JLPT N4</p><p>接续：动词ない形去い＋くてもいい。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>は<ruby>来<rt>こ</rt></ruby>なくてもいいです。</div><div class="zh">明天不来也可以。</div></div><div class="ex"><div lang="ja"><ruby>全部<rt>ぜんぶ</rt></ruby><ruby>食<rt>た</rt></ruby>べなくてもいいですよ。</div><div class="zh">不用全吃完哦。</div></div><div class="ex"><div lang="ja"><ruby>急<rt>いそ</rt></ruby>がなくてもいいです。</div><div class="zh">不用着急。</div></div><div class="ex"><div lang="ja"><ruby>靴<rt>くつ</rt></ruby>を<ruby>脱<rt>ぬ</rt></ruby>がなくてもいいです。</div><div class="zh">不用脱鞋。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
