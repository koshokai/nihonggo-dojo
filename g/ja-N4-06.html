<h1 lang="ja">～ながら</h1><p><b>一边……一边……</b> · JLPT N4</p><p>接续：动词ます形去ます＋ながら。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きながら<ruby>勉強<rt>べんきょう</rt></ruby>します。</div><div class="zh">一边听音乐一边学习。</div></div><div class="ex"><div lang="ja">テレビを<ruby>見<rt>み</rt></ruby>ながらご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。</div><div class="zh">边看电视边吃饭。</div></div><div class="ex"><div lang="ja"><ruby>歩<rt>ある</rt></ruby>きながら<ruby>電話<rt>でんわ</rt></ruby>しないでください。</div><div class="zh">请不要边走路边打电话。</div></div><div class="ex"><div lang="ja"><ruby>働<rt>はたら</rt></ruby>きながら<ruby>大学<rt>だいがく</rt></ruby>に<ruby>通<rt>かよ</rt></ruby>っています。</div><div class="zh">一边工作一边上大学。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-05.html">← ～なくてもいい</a><a href="../g/ja-N4-07.html">～たら →</a></div>
