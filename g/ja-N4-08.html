<h1 lang="ja">～ば</h1><p><b>如果……就……</b> · JLPT N4</p><p>接续：动词假定形（え段）＋ば；い形容词去い＋ければ。</p><h2>例句</h2><div class="ex"><div lang="ja">この<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>めば、すぐ<ruby>治<rt>なお</rt></ruby>りますよ。</div><div class="zh">吃了这个药马上就会好。</div></div><div class="ex"><div lang="ja"><ruby>安<rt>やす</rt></ruby>ければ、<ruby>買<rt>か</rt></ruby>います。</div><div class="zh">便宜的话就买。</div></div><div class="ex"><div lang="ja"><ruby>急<rt>いそ</rt></ruby>げば、<ruby>間<rt>ま</rt></ruby>に<ruby>合<rt>あ</rt></ruby>います。</div><div class="zh">抓紧的话来得及。</div></div><div class="ex"><div lang="ja"><ruby>練習<rt>れんしゅう</rt></ruby>すれば、<ruby>上手<rt>じょうず</rt></ruby>になります。</div><div class="zh">多练习就会变好。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-07.html">← ～たら</a><a href="../g/ja-N4-09.html">～と（条件） →</a></div>
