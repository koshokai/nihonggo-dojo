<h1 lang="ja">～と（条件）</h1><p><b>一……就……</b> · JLPT N4</p><p>接续：动词辞书形＋と，表示必然结果。</p><h2>例句</h2><div class="ex"><div lang="ja">このボタンを<ruby>押<rt>お</rt></ruby>すと、ドアが<ruby>開<rt>あ</rt></ruby>きます。</div><div class="zh">一按这个按钮，门就开了。</div></div><div class="ex"><div lang="ja"><ruby>春<rt>はる</rt></ruby>になると、<ruby>桜<rt>さくら</rt></ruby>が<ruby>咲<rt>さ</rt></ruby>きます。</div><div class="zh">一到春天樱花就开了。</div></div><div class="ex"><div lang="ja">まっすぐ<ruby>行<rt>い</rt></ruby>くと、<ruby>駅<rt>えき</rt></ruby>があります。</div><div class="zh">一直走就有车站。</div></div><div class="ex"><div lang="ja">お<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>むと、<ruby>顔<rt>かお</rt></ruby>が<ruby>赤<rt>あか</rt></ruby>くなります。</div><div class="zh">一喝酒脸就红。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-08.html">← ～ば</a><a href="../g/ja-N4-10.html">～ので →</a></div>
