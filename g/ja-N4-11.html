<h1 lang="ja">～のに</h1><p><b>明明……却……</b> · JLPT N4</p><p>接续：普通形＋のに，表示不满或意外。</p><h2>例句</h2><div class="ex"><div lang="ja">たくさん<ruby>勉強<rt>べんきょう</rt></ruby>したのに、<ruby>試験<rt>しけん</rt></ruby>に<ruby>落<rt>お</rt></ruby>ちました。</div><div class="zh">明明努力学习了，考试却没过。</div></div><div class="ex"><div lang="ja"><ruby>約束<rt>やくそく</rt></ruby>したのに、<ruby>彼<rt>かれ</rt></ruby>は<ruby>来<rt>き</rt></ruby>ませんでした。</div><div class="zh">明明约好了，他却没来。</div></div><div class="ex"><div lang="ja"><ruby>日曜<rt>にちよう</rt></ruby><ruby>日<rt>び</rt></ruby>なのに、<ruby>仕事<rt>しごと</rt></ruby>があります。</div><div class="zh">明明是星期天，却要工作。</div></div><div class="ex"><div lang="ja"><ruby>高<rt>たか</rt></ruby>いのに、おいしくないです。</div><div class="zh">这么贵，却不好吃。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-10.html">← ～ので</a><a href="../g/ja-N4-12.html">～そうだ（样态） →</a></div>
