<h1 lang="ja">～そうだ（传闻）</h1><p><b>听说……</b> · JLPT N4</p><p>接续：普通形＋そうだ。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>だそうです。</div><div class="zh">据天气预报说明天下雨。</div></div><div class="ex"><div lang="ja"><ruby>田中<rt>たなか</rt></ruby>さんは<ruby>来月<rt>らいげつ</rt></ruby><ruby>結婚<rt>けっこん</rt></ruby>するそうです。</div><div class="zh">听说田中下个月结婚。</div></div><div class="ex"><div lang="ja">あの<ruby>店<rt>みせ</rt></ruby>のラーメンはおいしいそうです。</div><div class="zh">听说那家店的拉面很好吃。</div></div><div class="ex"><div lang="ja"><ruby>山田<rt>やまだ</rt></ruby>さんは<ruby>病気<rt>びょうき</rt></ruby>だそうです。</div><div class="zh">听说山田病了。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-12.html">← ～そうだ（样态）</a><a href="../g/ja-N4-14.html">～てしまう →</a></div>
