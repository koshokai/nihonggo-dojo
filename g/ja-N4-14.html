<h1 lang="ja">～てしまう</h1><p><b>……完了；不小心……了</b> · JLPT N4</p><p>接续：动词て形＋しまう。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>財布<rt>さいふ</rt></ruby>をなくしてしまいました。</div><div class="zh">不小心把钱包弄丢了。</div></div><div class="ex"><div lang="ja"><ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>全部<rt>ぜんぶ</rt></ruby>やってしまいました。</div><div class="zh">作业全部做完了。</div></div><div class="ex"><div lang="ja"><ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>傘<rt>かさ</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れてしまいました。</div><div class="zh">把伞忘在电车上了。</div></div><div class="ex"><div lang="ja">ケーキを<ruby>一人<rt>ひとり</rt></ruby>で<ruby>食<rt>た</rt></ruby>べてしまいました。</div><div class="zh">一个人把蛋糕吃光了。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-13.html">← ～そうだ（传闻）</a><a href="../g/ja-N4-15.html">～ておく →</a></div>
