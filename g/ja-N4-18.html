<h1 lang="ja">～やすい</h1><p><b>容易……</b> · JLPT N4</p><p>接续：动词ます形去ます＋やすい。</p><h2>例句</h2><div class="ex"><div lang="ja">このペンは<ruby>書<rt>か</rt></ruby>きやすいです。</div><div class="zh">这支笔很好写。</div></div><div class="ex"><div lang="ja">この<ruby>本<rt>ほん</rt></ruby>は<ruby>字<rt>じ</rt></ruby>が<ruby>大<rt>おお</rt></ruby>きくて<ruby>読<rt>よ</rt></ruby>みやすいです。</div><div class="zh">这本书字大好读。</div></div><div class="ex"><div lang="ja"><ruby>冬<rt>ふゆ</rt></ruby>は<ruby>風邪<rt>かぜ</rt></ruby>をひきやすいです。</div><div class="zh">冬天容易感冒。</div></div><div class="ex"><div lang="ja"><ruby>先生<rt>せんせい</rt></ruby>の<ruby>説明<rt>せつめい</rt></ruby>はわかりやすいです。</div><div class="zh">老师的讲解很好懂。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-17.html">← ～てあげる／～てくれる／～てもらう</a><a href="../g/ja-N4-19.html">～にくい →</a></div>
