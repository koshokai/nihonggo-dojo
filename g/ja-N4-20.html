<h1 lang="ja">～させる（使役）</h1><p><b>让……做</b> · JLPT N4</p><p>接续：动词使役形。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>母<rt>はは</rt></ruby>は<ruby>弟<rt>おとうと</rt></ruby>に<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べさせました。</div><div class="zh">妈妈让弟弟吃了蔬菜。</div></div><div class="ex"><div lang="ja"><ruby>先生<rt>せんせい</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>に<ruby>作文<rt>さくぶん</rt></ruby>を<ruby>書<rt>か</rt></ruby>かせました。</div><div class="zh">老师让学生写了作文。</div></div><div class="ex"><div lang="ja"><ruby>子供<rt>こども</rt></ruby>を<ruby>公園<rt>こうえん</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>ばせます。</div><div class="zh">让孩子在公园玩。</div></div><div class="ex"><div lang="ja"><ruby>部長<rt>ぶちょう</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>を<ruby>出張<rt>しゅっちょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>かせました。</div><div class="zh">部长让我去出差了。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-19.html">← ～にくい</a><a href="../g/ja-N4-21.html">～られる（被动） →</a></div>
