<h1 lang="ja">～ように言う</h1><p><b>叫（别人）……</b> · JLPT N4</p><p>接续：动词辞书形／ない形＋ように言う。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>先生<rt>せんせい</rt></ruby>に<ruby>早<rt>はや</rt></ruby>く<ruby>来<rt>く</rt></ruby>るように<ruby>言<rt>い</rt></ruby>われました。</div><div class="zh">老师叫我早点来。</div></div><div class="ex"><div lang="ja"><ruby>弟<rt>おとうと</rt></ruby>に<ruby>部屋<rt>へや</rt></ruby>を<ruby>片付<rt>かたづ</rt></ruby>けるように<ruby>言<rt>い</rt></ruby>いました。</div><div class="zh">叫弟弟收拾房间。</div></div><div class="ex"><div lang="ja"><ruby>医者<rt>いしゃ</rt></ruby>にお<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>まないように<ruby>言<rt>い</rt></ruby>われました。</div><div class="zh">医生叫我不要喝酒。</div></div><div class="ex"><div lang="ja"><ruby>母<rt>はは</rt></ruby>に<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べるように<ruby>言<rt>い</rt></ruby>われます。</div><div class="zh">妈妈叫我吃蔬菜。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-23.html">← ～ほうがいい</a><a href="../g/ja-N4-25.html">～ようになる →</a></div>
