<h1 lang="ja">～かもしれない</h1><p><b>也许……</b> · JLPT N4</p><p>接续：普通形（な形容词・名词不加だ）＋かもしれない。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>かもしれません。</div><div class="zh">明天也许会下雨。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>はもう<ruby>帰<rt>かえ</rt></ruby>ったかもしれません。</div><div class="zh">他也许已经回去了。</div></div><div class="ex"><div lang="ja">その<ruby>話<rt>はなし</rt></ruby>は<ruby>本当<rt>ほんとう</rt></ruby>かもしれません。</div><div class="zh">那件事也许是真的。</div></div><div class="ex"><div lang="ja"><ruby>少<rt>すこ</rt></ruby>し<ruby>遅<rt>おく</rt></ruby>れるかもしれません。</div><div class="zh">可能会晚一点。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-25.html">← ～ようになる</a><a href="../g/ja-N4-27.html">～はずだ →</a></div>
