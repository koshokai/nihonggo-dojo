<h1 lang="ja">～し</h1><p><b>又……又……</b> · JLPT N4</p><p>接续：普通形＋し，列举理由。</p><h2>例句</h2><div class="ex"><div lang="ja">この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いし、おいしいです。</div><div class="zh">这家店又便宜又好吃。</div></div><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>も<ruby>降<rt>ふ</rt></ruby>っているし、<ruby>今日<rt>きょう</rt></ruby>は<ruby>家<rt>いえ</rt></ruby>にいます。</div><div class="zh">也在下雨，今天就待在家吧。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>親切<rt>しんせつ</rt></ruby>だし、おもしろいです。</div><div class="zh">他又热心又有趣。</div></div><div class="ex"><div lang="ja"><ruby>時間<rt>じかん</rt></ruby>もないし、お<ruby>金<rt>かね</rt></ruby>もありません。</div><div class="zh">既没时间也没钱。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-27.html">← ～はずだ</a><a href="../g/ja-N4-29.html">～しか～ない →</a></div>
