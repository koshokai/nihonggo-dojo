<h1 lang="ja">～間に</h1><p><b>在……期间（某时）</b> · JLPT N4</p><p>接续：动词辞书形／ている形／名词の＋間に。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>子供<rt>こども</rt></ruby>が<ruby>寝<rt>ね</rt></ruby>ている<ruby>間<rt>あいだ</rt></ruby>に、<ruby>掃除<rt>そうじ</rt></ruby>をします。</div><div class="zh">趁孩子睡觉的时候打扫。</div></div><div class="ex"><div lang="ja"><ruby>留守<rt>るす</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>に、<ruby>友達<rt>ともだち</rt></ruby>が<ruby>来<rt>き</rt></ruby>ました。</div><div class="zh">不在家的时候朋友来了。</div></div><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby>にいる<ruby>間<rt>あいだ</rt></ruby>に、<ruby>富士山<rt>ふじさん</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>りたいです。</div><div class="zh">想在日本期间去爬富士山。</div></div><div class="ex"><div lang="ja"><ruby>夏休<rt>なつやす</rt></ruby>みの<ruby>間<rt>あいだ</rt></ruby>に、<ruby>運転<rt>うんてん</rt></ruby><ruby>免許<rt>めんきょ</rt></ruby>を<ruby>取<rt>と</rt></ruby>りました。</div><div class="zh">暑假期间考了驾照。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
