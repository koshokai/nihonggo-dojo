<h1 lang="ja">～すぎる</h1><p><b>太……；过于……</b> · JLPT N4</p><p>接续：动词ます形去ます／形容词词干＋すぎる。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>食<rt>た</rt></ruby>べすぎて、おなかが<ruby>痛<rt>いた</rt></ruby>いです。</div><div class="zh">吃太多了，肚子疼。</div></div><div class="ex"><div lang="ja">この<ruby>問題<rt>もんだい</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しすぎます。</div><div class="zh">这个问题太难了。</div></div><div class="ex"><div lang="ja"><ruby>昨日<rt>きのう</rt></ruby>はお<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みすぎました。</div><div class="zh">昨天喝太多酒了。</div></div><div class="ex"><div lang="ja">この<ruby>部屋<rt>へや</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かすぎます。</div><div class="zh">这个房间太安静了。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
