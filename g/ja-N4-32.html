<h1 lang="ja">～ために（目的）</h1><p><b>为了……</b> · JLPT N4</p><p>接续：动词辞书形／名词の＋ために。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby>へ<ruby>留学<rt>りゅうがく</rt></ruby>するために、<ruby>貯金<rt>ちょきん</rt></ruby>しています。</div><div class="zh">为了去日本留学在存钱。</div></div><div class="ex"><div lang="ja"><ruby>健康<rt>けんこう</rt></ruby>のために、<ruby>毎日<rt>まいにち</rt></ruby><ruby>歩<rt>ある</rt></ruby>きます。</div><div class="zh">为了健康每天走路。</div></div><div class="ex"><div lang="ja"><ruby>家族<rt>かぞく</rt></ruby>のために<ruby>働<rt>はたら</rt></ruby>いています。</div><div class="zh">为了家人而工作。</div></div><div class="ex"><div lang="ja"><ruby>試験<rt>しけん</rt></ruby>に<ruby>合格<rt>ごうかく</rt></ruby>するために、<ruby>頑張<rt>がんば</rt></ruby>ります。</div><div class="zh">为了考试合格而努力。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-31.html">← ～すぎる</a><a href="../g/ja-N4-33.html">～かどうか →</a></div>
