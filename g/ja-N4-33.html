<h1 lang="ja">～かどうか</h1><p><b>是否……</b> · JLPT N4</p><p>接续：普通形（な形容词・名词不加だ）＋かどうか。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby><ruby>晴<rt>は</rt></ruby>れるかどうかわかりません。</div><div class="zh">不知道明天会不会晴。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>が<ruby>来<rt>く</rt></ruby>るかどうか<ruby>聞<rt>き</rt></ruby>いてください。</div><div class="zh">请问问他来不来。</div></div><div class="ex"><div lang="ja">この<ruby>答<rt>こた</rt></ruby>えが<ruby>正<rt>ただ</rt></ruby>しいかどうか<ruby>調<rt>しら</rt></ruby>べます。</div><div class="zh">查一下这个答案对不对。</div></div><div class="ex"><div lang="ja">おいしいかどうか、<ruby>食<rt>た</rt></ruby>べてみます。</div><div class="zh">尝尝看好不好吃。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-32.html">← ～ために（目的）</a><a href="../g/ja-N4-34.html">～てある →</a></div>
