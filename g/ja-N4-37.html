<h1 lang="ja">～なさい</h1><p><b>要……、给我……（命令）</b> · JLPT N4</p><p>接续：动词ます形去ます＋なさい。父母对孩子、老师对学生等上对下的柔和命令，也常用于试题指示（「答えなさい」）。不能对长辈、上司使用。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>なさい。</div><div class="zh">快去睡觉！</div></div><div class="ex"><div lang="ja">ご<ruby>飯<rt>はん</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>いなさい。</div><div class="zh">吃饭前要洗手。</div></div><div class="ex"><div lang="ja"><ruby>次<rt>つぎ</rt></ruby>の<ruby>質問<rt>しつもん</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えなさい。</div><div class="zh">请回答下列问题。</div></div><div class="ex"><div lang="ja">ちゃんと<ruby>野菜<rt>やさい</rt></ruby>も<ruby>食<rt>た</rt></ruby>べなさい。</div><div class="zh">蔬菜也要好好吃。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-36.html">← ～がする</a><a href="../g/ja-N4-38.html">～方 →</a></div>
