<h1 lang="ja">お～する</h1><p><b>（谦让语）我为您……</b> · JLPT N4</p><p>接续：お＋动词ます形去ます＋する（汉语词用「ご～する」，如ご案内する）。降低自己一方的动作来表示对对方的尊敬，只用于与对方有关的动作：×お食べする。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>荷物<rt>にもつ</rt></ruby>をお<ruby>持<rt>も</rt></ruby>ちします。</div><div class="zh">我来帮您拿行李。</div></div><div class="ex"><div lang="ja"><ruby>駅<rt>えき</rt></ruby>までお<ruby>送<rt>おく</rt></ruby>りしましょうか。</div><div class="zh">我送您到车站吧。</div></div><div class="ex"><div lang="ja"><ruby>後<rt>あと</rt></ruby>でお<ruby>電話<rt>でんわ</rt></ruby>します。</div><div class="zh">稍后给您打电话。</div></div><div class="ex"><div lang="ja"><ruby>先生<rt>せんせい</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をお<ruby>借<rt>か</rt></ruby>りしました。</div><div class="zh">向老师借了书。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-53.html">← お～になる</a><a href="../g/ja-N4-55.html">～という →</a></div>
