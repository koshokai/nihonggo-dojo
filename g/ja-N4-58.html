<h1 lang="ja">～にする</h1><p><b>决定要……（选择）</b> · JLPT N4</p><p>接续：名词＋にする。在多个选项中做出选择，常用于点菜、购物、定时间。决定做某个动作则用「动词＋ことにする」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>私<rt>わたし</rt></ruby>はコーヒーにします。</div><div class="zh">我要咖啡。</div></div><div class="ex"><div lang="ja"><ruby>誕生日<rt>たんじょうび</rt></ruby>のプレゼントは<ruby>時計<rt>とけい</rt></ruby>にしました。</div><div class="zh">生日礼物决定送手表了。</div></div><div class="ex"><div lang="ja"><ruby>会議<rt>かいぎ</rt></ruby>は<ruby>月曜<rt>げつよう</rt></ruby><ruby>日<rt>び</rt></ruby>にしましょう。</div><div class="zh">会议定在周一吧。</div></div><div class="ex"><div lang="ja">どれにしますか。</div><div class="zh">你要哪个？</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N4-57.html">← ～ことがある（有时）</a><a href="../g/ja-N4-59.html">～のが／～のを（名词化） →</a></div>
