<h1 lang="ja">～は</h1><p><b>提示主题</b> · JLPT N5</p><p>接续：名词＋は，提示句子谈论的对象。读作「わ」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>私<rt>わたし</rt></ruby>は<ruby>中国人<rt>ちゅうごくじん</rt></ruby>です。</div><div class="zh">我是中国人。</div></div><div class="ex"><div lang="ja">これは<ruby>私<rt>わたし</rt></ruby>の<ruby>傘<rt>かさ</rt></ruby>です。</div><div class="zh">这是我的伞。</div></div><div class="ex"><div lang="ja"><ruby>今日<rt>きょう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>です。</div><div class="zh">今天下雨。</div></div><div class="ex"><div lang="ja"><ruby>田中<rt>たなか</rt></ruby>さんは<ruby>先生<rt>せんせい</rt></ruby>です。</div><div class="zh">田中是老师。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><span></span><a href="../g/ja-N5-02.html">～を →</a></div>
