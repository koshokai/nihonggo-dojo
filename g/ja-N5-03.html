<h1 lang="ja">～に（时间）</h1><p><b>在……（时间点）</b> · JLPT N5</p><p>接续：具体时间＋に。「今日、毎日」等不加に。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>七時<rt>しちじ</rt></ruby>に<ruby>起<rt>お</rt></ruby>きます。</div><div class="zh">七点起床。</div></div><div class="ex"><div lang="ja"><ruby>日曜<rt>にちよう</rt></ruby><ruby>日<rt>び</rt></ruby>に<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ます。</div><div class="zh">星期天看电影。</div></div><div class="ex"><div lang="ja"><ruby>三<rt>さん</rt></ruby><ruby>月<rt>がつ</rt></ruby>に<ruby>日本<rt>にほん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">三月去日本。</div></div><div class="ex"><div lang="ja"><ruby>十<rt>じゅう</rt></ruby><ruby>時<rt>じ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ます。</div><div class="zh">十点睡觉。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-02.html">← ～を</a><a href="../g/ja-N5-04.html">～に（地点・对象） →</a></div>
