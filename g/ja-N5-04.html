<h1 lang="ja">～に（地点・对象）</h1><p><b>在……；给……；到……</b> · JLPT N5</p><p>接续：存在的地点、动作的对象或到达点＋に。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>があります。</div><div class="zh">桌子上有书。</div></div><div class="ex"><div lang="ja"><ruby>友達<rt>ともだち</rt></ruby>に<ruby>手紙<rt>てがみ</rt></ruby>を<ruby>書<rt>か</rt></ruby>きます。</div><div class="zh">给朋友写信。</div></div><div class="ex"><div lang="ja"><ruby>母<rt>はは</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>しました。</div><div class="zh">给妈妈打了电话。</div></div><div class="ex"><div lang="ja"><ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>ります。</div><div class="zh">坐电车。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-03.html">← ～に（时间）</a><a href="../g/ja-N5-05.html">～で（场所） →</a></div>
