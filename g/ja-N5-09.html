<h1 lang="ja">～も</h1><p><b>也……；都……</b> · JLPT N5</p><p>接续：名词＋も，表示同类追加。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>私<rt>わたし</rt></ruby>も<ruby>学生<rt>がくせい</rt></ruby>です。</div><div class="zh">我也是学生。</div></div><div class="ex"><div lang="ja"><ruby>妹<rt>いもうと</rt></ruby>も<ruby>来<rt>き</rt></ruby>ます。</div><div class="zh">妹妹也来。</div></div><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>も<ruby>雨<rt>あめ</rt></ruby>でしょう。</div><div class="zh">明天大概也会下雨。</div></div><div class="ex"><div lang="ja"><ruby>肉<rt>にく</rt></ruby>も<ruby>魚<rt>さかな</rt></ruby>も<ruby>好<rt>す</rt></ruby>きです。</div><div class="zh">肉和鱼都喜欢。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-08.html">← ～が</a><a href="../g/ja-N5-10.html">～と →</a></div>
