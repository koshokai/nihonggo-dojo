<h1 lang="ja">～から～まで</h1><p><b>从……到……</b> · JLPT N5</p><p>接续：时间/地点＋から＋…＋まで。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>九時<rt>くじ</rt></ruby>から<ruby>五<rt>ご</rt></ruby><ruby>時<rt>じ</rt></ruby>まで<ruby>働<rt>はたら</rt></ruby>きます。</div><div class="zh">从九点工作到五点。</div></div><div class="ex"><div lang="ja"><ruby>東京<rt>とうきょう</rt></ruby>から<ruby>大阪<rt>おおさか</rt></ruby>まで<ruby>新<rt>しん</rt></ruby><ruby>幹線<rt>かんせん</rt></ruby>で<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">从东京坐新干线到大阪。</div></div><div class="ex"><div lang="ja"><ruby>月曜<rt>げつよう</rt></ruby><ruby>日<rt>び</rt></ruby>から<ruby>金曜<rt>きんよう</rt></ruby><ruby>日<rt>び</rt></ruby>まで<ruby>学校<rt>がっこう</rt></ruby>があります。</div><div class="zh">星期一到星期五要上学。</div></div><div class="ex"><div lang="ja"><ruby>駅<rt>えき</rt></ruby>から<ruby>家<rt>いえ</rt></ruby>まで<ruby>歩<rt>ある</rt></ruby>きます。</div><div class="zh">从车站走回家。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
