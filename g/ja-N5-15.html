<h1 lang="ja">～ませんか</h1><p><b>要不要……（邀请）</b> · JLPT N5</p><p>接续：动词ます形去ます＋ませんか。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べませんか。</div><div class="zh">要不要一起吃午饭？</div></div><div class="ex"><div lang="ja"><ruby>週末<rt>しゅうまつ</rt></ruby>、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ませんか。</div><div class="zh">周末要不要看电影？</div></div><div class="ex"><div lang="ja"><ruby>少<rt>すこ</rt></ruby>し<ruby>休<rt>やす</rt></ruby>みませんか。</div><div class="zh">要不要休息一下？</div></div><div class="ex"><div lang="ja">コーヒーを<ruby>飲<rt>の</rt></ruby>みませんか。</div><div class="zh">要不要喝咖啡？</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-14.html">← ～ね／～よ</a><a href="../g/ja-N5-16.html">～ましょう →</a></div>
