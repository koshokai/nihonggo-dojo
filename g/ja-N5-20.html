<h1 lang="ja">～てはいけません</h1><p><b>不可以……</b> · JLPT N5</p><p>接续：动词て形＋はいけません。</p><h2>例句</h2><div class="ex"><div lang="ja">ここでたばこを<ruby>吸<rt>す</rt></ruby>ってはいけません。</div><div class="zh">这里不可以吸烟。</div></div><div class="ex"><div lang="ja"><ruby>図書<rt>としょ</rt></ruby><ruby>館<rt>かん</rt></ruby>で<ruby>話<rt>はな</rt></ruby>してはいけません。</div><div class="zh">在图书馆不可以说话。</div></div><div class="ex"><div lang="ja">この<ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んではいけません。</div><div class="zh">不可以喝这个水。</div></div><div class="ex"><div lang="ja"><ruby>夜<rt>よる</rt></ruby><ruby>遅<rt>おそ</rt></ruby>く<ruby>電話<rt>でんわ</rt></ruby>してはいけません。</div><div class="zh">不可以深夜打电话。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-19.html">← ～てもいいです</a><a href="../g/ja-N5-21.html">～ている →</a></div>
