<h1 lang="ja">～より～のほうが</h1><p><b>比起……更……</b> · JLPT N5</p><p>接续：AよりBのほうが＋形容词。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>犬<rt>いぬ</rt></ruby>より<ruby>猫<rt>ねこ</rt></ruby>のほうが<ruby>好<rt>す</rt></ruby>きです。</div><div class="zh">比起狗更喜欢猫。</div></div><div class="ex"><div lang="ja">バスより<ruby>電車<rt>でんしゃ</rt></ruby>のほうが<ruby>速<rt>はや</rt></ruby>いです。</div><div class="zh">电车比公交车快。</div></div><div class="ex"><div lang="ja"><ruby>夏<rt>なつ</rt></ruby>より<ruby>冬<rt>ふゆ</rt></ruby>のほうが<ruby>好<rt>す</rt></ruby>きです。</div><div class="zh">比起夏天更喜欢冬天。</div></div><div class="ex"><div lang="ja">この<ruby>本<rt>ほん</rt></ruby>より、あの<ruby>本<rt>ほん</rt></ruby>のほうがおもしろいです。</div><div class="zh">那本书比这本有意思。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-21.html">← ～ている</a><a href="../g/ja-N5-23.html">～から（原因） →</a></div>
