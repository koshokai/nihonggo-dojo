<h1 lang="ja">～から（原因）</h1><p><b>因为……</b> · JLPT N5</p><p>接续：句子＋から，表示主观原因。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>暑<rt>あつ</rt></ruby>いから、<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けます。</div><div class="zh">因为热，所以开窗。</div></div><div class="ex"><div lang="ja"><ruby>時間<rt>じかん</rt></ruby>がないから、タクシーで<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">因为没时间，坐出租车去。</div></div><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>ですから、<ruby>家<rt>いえ</rt></ruby>にいます。</div><div class="zh">因为下雨，待在家里。</div></div><div class="ex"><div lang="ja">おいしいから、たくさん<ruby>食<rt>た</rt></ruby>べました。</div><div class="zh">因为好吃，吃了很多。</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
