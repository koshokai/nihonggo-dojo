<h1 lang="ja">～が（逆接）</h1><p><b>但是……</b> · JLPT N5</p><p>接续：句子＋が＋句子，表示转折。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しいですが、おもしろいです。</div><div class="zh">日语虽然难，但是很有意思。</div></div><div class="ex"><div lang="ja">この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いですが、おいしくないです。</div><div class="zh">这家店便宜，但不好吃。</div></div><div class="ex"><div lang="ja"><ruby>行<rt>い</rt></ruby>きたいですが、<ruby>時間<rt>じかん</rt></ruby>がありません。</div><div class="zh">想去，但是没有时间。</div></div><div class="ex"><div lang="ja">すみませんが、<ruby>駅<rt>えき</rt></ruby>はどこですか。</div><div class="zh">不好意思，请问车站在哪里？</div></div><a class="cta" href="../#grammar">在日语道场做这个语法的练习 →</a>
