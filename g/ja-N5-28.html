<h1 lang="ja">～てから</h1><p><b>……之后再……</b> · JLPT N5</p><p>接续：动词て形＋から。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>宿題<rt>しゅくだい</rt></ruby>をしてから、<ruby>遊<rt>あそ</rt></ruby>びます。</div><div class="zh">做完作业再玩。</div></div><div class="ex"><div lang="ja"><ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>ってから、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。</div><div class="zh">洗了手再吃饭。</div></div><div class="ex"><div lang="ja"><ruby>仕事<rt>しごと</rt></ruby>が<ruby>終<rt>お</rt></ruby>わってから、<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">工作结束后去购物。</div></div><div class="ex"><div lang="ja">シャワーを<ruby>浴<rt>あ</rt></ruby>びてから<ruby>寝<rt>ね</rt></ruby>ます。</div><div class="zh">洗完澡再睡觉。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-27.html">← ～前に</a><a href="../g/ja-N5-29.html">～あとで →</a></div>
