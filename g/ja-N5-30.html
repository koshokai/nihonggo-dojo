<h1 lang="ja">～でしょう</h1><p><b>……吧（推测）</b> · JLPT N5</p><p>接续：普通形（な形容词・名词不加だ）＋でしょう。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>でしょう。</div><div class="zh">明天大概会下雨吧。</div></div><div class="ex"><div lang="ja">あの<ruby>人<rt>ひと</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>でしょう。</div><div class="zh">那个人是学生吧。</div></div><div class="ex"><div lang="ja"><ruby>試験<rt>しけん</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しいでしょう。</div><div class="zh">考试大概很难吧。</div></div><div class="ex"><div lang="ja">もうすぐ<ruby>着<rt>つ</rt></ruby>くでしょう。</div><div class="zh">马上就会到吧。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-29.html">← ～あとで</a><a href="../g/ja-N5-31.html">～がほしい →</a></div>
