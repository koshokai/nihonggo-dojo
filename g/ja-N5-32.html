<h1 lang="ja">～に行く（目的）</h1><p><b>去做……</b> · JLPT N5</p><p>接续：动词ます形去ます／动作名词＋に行く。</p><h2>例句</h2><div class="ex"><div lang="ja">デパートへ<ruby>服<rt>ふく</rt></ruby>を<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">去百货商店买衣服。</div></div><div class="ex"><div lang="ja"><ruby>友達<rt>ともだち</rt></ruby>と<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">和朋友去看电影。</div></div><div class="ex"><div lang="ja"><ruby>京都<rt>きょうと</rt></ruby>へ<ruby>旅行<rt>りょこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。</div><div class="zh">去京都旅行了。</div></div><div class="ex"><div lang="ja"><ruby>駅<rt>えき</rt></ruby>まで<ruby>友達<rt>ともだち</rt></ruby>を<ruby>迎<rt>むか</rt></ruby>えに<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">去车站接朋友。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-31.html">← ～がほしい</a><a href="../g/ja-N5-33.html">～くなる／～になる →</a></div>
