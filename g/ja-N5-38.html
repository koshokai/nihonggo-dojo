<h1 lang="ja">～ませんでした</h1><p><b>没（有）……（礼貌体过去否定）</b> · JLPT N5</p><p>接续：动词ます形去ます＋ませんでした。表示过去没做的事，不能用现在否定「～ません」代替。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>昨日<rt>きのう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きませんでした。</div><div class="zh">昨天没去学校。</div></div><div class="ex"><div lang="ja"><ruby>今朝<rt>けさ</rt></ruby>は<ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べませんでした。</div><div class="zh">今天早上没吃早饭。</div></div><div class="ex"><div lang="ja"><ruby>先週<rt>せんしゅう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>りませんでした。</div><div class="zh">上周没下雨。</div></div><div class="ex"><div lang="ja">その<ruby>本<rt>ほん</rt></ruby>は<ruby>読<rt>よ</rt></ruby>みませんでした。</div><div class="zh">那本书没读。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-37.html">← ～ではありません</a><a href="../g/ja-N5-39.html">～かったです →</a></div>
