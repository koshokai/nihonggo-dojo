<h1 lang="ja">～かったです</h1><p><b>……（い形容词的过去式）</b> · JLPT N5</p><p>接续：い形容词去い＋かったです。常见错误是说成「おいしいでした」；「いい」要变成「よかったです」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>昨日<rt>きのう</rt></ruby>はとても<ruby>寒<rt>さむ</rt></ruby>かったです。</div><div class="zh">昨天非常冷。</div></div><div class="ex"><div lang="ja"><ruby>旅行<rt>りょこう</rt></ruby>は<ruby>楽<rt>たの</rt></ruby>しかったです。</div><div class="zh">旅行很开心。</div></div><div class="ex"><div lang="ja">そのケーキはおいしかったです。</div><div class="zh">那个蛋糕很好吃。</div></div><div class="ex"><div lang="ja"><ruby>試験<rt>しけん</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しかったです。</div><div class="zh">考试很难。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-38.html">← ～ませんでした</a><a href="../g/ja-N5-40.html">～があります／～がいます →</a></div>
