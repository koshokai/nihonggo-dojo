<h1 lang="ja">～があります／～がいます</h1><p><b>有……；在……</b> · JLPT N5</p><p>接续：地点＋に＋名词＋が＋あります（无生命的东西、植物）／います（人、动物）。中文都说&quot;有&quot;，日语必须区分有无生命。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>があります。</div><div class="zh">桌子上有书。</div></div><div class="ex"><div lang="ja"><ruby>公園<rt>こうえん</rt></ruby>に<ruby>子<rt>こ</rt></ruby>どもたちがいます。</div><div class="zh">公园里有孩子们。</div></div><div class="ex"><div lang="ja"><ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>銀行<rt>ぎんこう</rt></ruby>があります。</div><div class="zh">车站前面有银行。</div></div><div class="ex"><div lang="ja"><ruby>庭<rt>にわ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>がいます。</div><div class="zh">院子里有猫。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-39.html">← ～かったです</a><a href="../g/ja-N5-41.html">～や～など →</a></div>
