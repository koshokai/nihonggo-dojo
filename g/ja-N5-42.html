<h1 lang="ja">～か～（选择）</h1><p><b>……或者……</b> · JLPT N5</p><p>接续：名词＋か＋名词，表示从中选一个。注意不要和句末表示疑问的「か」混淆。</p><h2>例句</h2><div class="ex"><div lang="ja">コーヒーか<ruby>紅茶<rt>こうちゃ</rt></ruby>をお<ruby>願<rt>ねが</rt></ruby>いします。</div><div class="zh">请给我咖啡或者红茶。</div></div><div class="ex"><div lang="ja"><ruby>月曜<rt>げつよう</rt></ruby><ruby>日<rt>び</rt></ruby>か<ruby>火曜<rt>かよう</rt></ruby><ruby>日<rt>び</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">星期一或者星期二去。</div></div><div class="ex"><div lang="ja"><ruby>電車<rt>でんしゃ</rt></ruby>かバスで<ruby>来<rt>き</rt></ruby>てください。</div><div class="zh">请坐电车或者公交车来。</div></div><div class="ex"><div lang="ja">ペンか<ruby>鉛筆<rt>えんぴつ</rt></ruby>で<ruby>書<rt>か</rt></ruby>いてください。</div><div class="zh">请用钢笔或者铅笔写。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-41.html">← ～や～など</a><a href="../g/ja-N5-43.html">～をください →</a></div>
