<h1 lang="ja">～をください</h1><p><b>请给我……</b> · JLPT N5</p><p>接续：名词＋をください；数量词放在「を」之后、「ください」之前，如「りんごを三つください」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>水<rt>みず</rt></ruby>をください。</div><div class="zh">请给我水。</div></div><div class="ex"><div lang="ja">このシャツをください。</div><div class="zh">请给我这件衬衫。</div></div><div class="ex"><div lang="ja">コーヒーをください。</div><div class="zh">请给我咖啡。</div></div><div class="ex"><div lang="ja"><ruby>赤<rt>あか</rt></ruby>いかばんをください。</div><div class="zh">请给我那个红色的包。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-42.html">← ～か～（选择）</a><a href="../g/ja-N5-44.html">～ましょうか →</a></div>
