<h1 lang="ja">～て、～（动作顺序）</h1><p><b>……然后……</b> · JLPT N5</p><p>接续：动词て形连接几个动作，按发生顺序排列；整句的时态由最后一个动词决定。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>朝<rt>あさ</rt></ruby><ruby>起<rt>お</rt></ruby>きて、<ruby>顔<rt>かお</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>います。</div><div class="zh">早上起床后洗脸。</div></div><div class="ex"><div lang="ja">デパートへ<ruby>行<rt>い</rt></ruby>って、<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>をしました。</div><div class="zh">去了百货商店，买了东西。</div></div><div class="ex"><div lang="ja"><ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>って、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。</div><div class="zh">回家然后吃饭。</div></div><div class="ex"><div lang="ja">シャワーを<ruby>浴<rt>あ</rt></ruby>びて、<ruby>寝<rt>ね</rt></ruby>ました。</div><div class="zh">洗了澡然后睡了。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-45.html">← ～くて／～で（形容词连接）</a><a href="../g/ja-N5-47.html">～とき →</a></div>
