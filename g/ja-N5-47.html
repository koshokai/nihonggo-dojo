<h1 lang="ja">～とき</h1><p><b>……的时候</b> · JLPT N5</p><p>接续：动词普通形／い形容词／な形容词＋な／名词＋の＋とき。名词后要加「の」，な形容词后要加「な」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>暇<rt>ひま</rt></ruby>なとき、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。</div><div class="zh">有空的时候看书。</div></div><div class="ex"><div lang="ja"><ruby>子<rt>こ</rt></ruby>どものとき、よく<ruby>川<rt>かわ</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>びました。</div><div class="zh">小时候常在河边玩。</div></div><div class="ex"><div lang="ja"><ruby>寝<rt>ね</rt></ruby>るとき、<ruby>電気<rt>でんき</rt></ruby>を<ruby>消<rt>け</rt></ruby>します。</div><div class="zh">睡觉的时候关灯。</div></div><div class="ex"><div lang="ja"><ruby>寂<rt>さび</rt></ruby>しいとき、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>します。</div><div class="zh">寂寞的时候给朋友打电话。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-46.html">← ～て、～（动作顺序）</a><a href="../g/ja-N5-48.html">～ぐらい／～くらい →</a></div>
