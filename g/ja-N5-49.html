<h1 lang="ja">～ごろ</h1><p><b>……左右（时间点）</b> · JLPT N5</p><p>接续：时间点＋ごろ（に），表示大概的时间点；表示时长用「ぐらい」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>毎朝<rt>まいあさ</rt></ruby><ruby>七時<rt>しちじ</rt></ruby>ごろ<ruby>起<rt>お</rt></ruby>きます。</div><div class="zh">每天早上七点左右起床。</div></div><div class="ex"><div lang="ja"><ruby>夜<rt>よる</rt></ruby><ruby>十<rt>じゅう</rt></ruby><ruby>一<rt>いち</rt></ruby><ruby>時<rt>じ</rt></ruby>ごろ<ruby>寝<rt>ね</rt></ruby>ます。</div><div class="zh">晚上十一点左右睡觉。</div></div><div class="ex"><div lang="ja"><ruby>三<rt>さん</rt></ruby><ruby>時<rt>じ</rt></ruby>ごろ<ruby>友達<rt>ともだち</rt></ruby>が<ruby>来<rt>き</rt></ruby>ます。</div><div class="zh">三点左右朋友会来。</div></div><div class="ex"><div lang="ja"><ruby>来月<rt>らいげつ</rt></ruby>の<ruby>十<rt>とお</rt></ruby><ruby>日<rt>か</rt></ruby>ごろ<ruby>国<rt>こく</rt></ruby>へ<ruby>帰<rt>かえ</rt></ruby>ります。</div><div class="zh">下个月十号左右回国。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-48.html">← ～ぐらい／～くらい</a><a href="../g/ja-N5-50.html">～の中で～がいちばん →</a></div>
