<h1 lang="ja">あまり～ない</h1><p><b>不太……</b> · JLPT N5</p><p>接续：あまり＋否定形（ない／ません）。必须与否定搭配，不能说「あまり好きです」。</p><h2>例句</h2><div class="ex"><div lang="ja">この<ruby>映画<rt>えいが</rt></ruby>はあまり<ruby>面白<rt>おもしろ</rt></ruby>くないです。</div><div class="zh">这部电影不太有意思。</div></div><div class="ex"><div lang="ja"><ruby>私<rt>わたし</rt></ruby>はあまりテレビを<ruby>見<rt>み</rt></ruby>ません。</div><div class="zh">我不太看电视。</div></div><div class="ex"><div lang="ja"><ruby>今日<rt>きょう</rt></ruby>はあまり<ruby>寒<rt>さむ</rt></ruby>くないです。</div><div class="zh">今天不太冷。</div></div><div class="ex"><div lang="ja"><ruby>肉<rt>にく</rt></ruby>はあまり<ruby>食<rt>た</rt></ruby>べません。</div><div class="zh">我不太吃肉。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-50.html">← ～の中で～がいちばん</a><a href="../g/ja-N5-52.html">ぜんぜん～ない →</a></div>
