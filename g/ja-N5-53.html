<h1 lang="ja">～はどうですか</h1><p><b>……怎么样？</b> · JLPT N5</p><p>接续：名词＋はどうですか，用来询问感想或提出建议；更礼貌的说法是「～はいかがですか」。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby>の<ruby>生活<rt>せいかつ</rt></ruby>はどうですか。</div><div class="zh">在日本的生活怎么样？</div></div><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>はどうですか。</div><div class="zh">明天怎么样？</div></div><div class="ex"><div lang="ja">このシャツはどうですか。</div><div class="zh">这件衬衫怎么样？</div></div><div class="ex"><div lang="ja">お<ruby>茶<rt>ちゃ</rt></ruby>はどうですか。</div><div class="zh">喝点茶怎么样？</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-52.html">← ぜんぜん～ない</a><a href="../g/ja-N5-54.html">～く／～に（修饰动词） →</a></div>
