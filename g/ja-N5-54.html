<h1 lang="ja">～く／～に（修饰动词）</h1><p><b>……地（形容词作副词）</b> · JLPT N5</p><p>接续：い形容词去い＋く；な形容词＋に，用来修饰动词。不能直接用形容词原形修饰动词。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>起<rt>お</rt></ruby>きてください。</div><div class="zh">明天请早点起床。</div></div><div class="ex"><div lang="ja"><ruby>図書<rt>としょ</rt></ruby><ruby>館<rt>かん</rt></ruby>では<ruby>静<rt>しず</rt></ruby>かにしてください。</div><div class="zh">在图书馆请保持安静。</div></div><div class="ex"><div lang="ja"><ruby>字<rt>じ</rt></ruby>を<ruby>大<rt>おお</rt></ruby>きく<ruby>書<rt>か</rt></ruby>きます。</div><div class="zh">把字写大一点。</div></div><div class="ex"><div lang="ja"><ruby>部屋<rt>へや</rt></ruby>をきれいに<ruby>掃除<rt>そうじ</rt></ruby>しました。</div><div class="zh">把房间打扫得干干净净。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-53.html">← ～はどうですか</a><a href="../g/ja-N5-55.html">～に～回（频率） →</a></div>
