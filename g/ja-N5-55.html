<h1 lang="ja">～に～回（频率）</h1><p><b>每……几次</b> · JLPT N5</p><p>接续：期间（一日、一週間等）＋に＋次数（～回），表示频率。</p><h2>例句</h2><div class="ex"><div lang="ja"><ruby>一<rt>いち</rt></ruby><ruby>週間<rt>しゅうかん</rt></ruby>に<ruby>三<rt>さん</rt></ruby><ruby>回<rt>かい</rt></ruby>プールへ<ruby>行<rt>い</rt></ruby>きます。</div><div class="zh">每周去三次游泳池。</div></div><div class="ex"><div lang="ja"><ruby>一<rt>いち</rt></ruby><ruby>日<rt>にち</rt></ruby>に<ruby>二<rt>に</rt></ruby><ruby>回<rt>かい</rt></ruby><ruby>歯<rt>は</rt></ruby>を<ruby>磨<rt>みが</rt></ruby>きます。</div><div class="zh">每天刷两次牙。</div></div><div class="ex"><div lang="ja"><ruby>一<rt>いち</rt></ruby>か<ruby>月<rt>げつ</rt></ruby>に<ruby>一<rt>いち</rt></ruby><ruby>回<rt>かい</rt></ruby><ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ます。</div><div class="zh">每个月看一次电影。</div></div><div class="ex"><div lang="ja"><ruby>一<rt>いち</rt></ruby><ruby>年<rt>ねん</rt></ruby>に<ruby>二<rt>に</rt></ruby><ruby>回<rt>かい</rt></ruby><ruby>国<rt>こく</rt></ruby>へ<ruby>帰<rt>かえ</rt></ruby>ります。</div><div class="zh">每年回国两次。</div></div><a class="cta" href="../#grammar">在猫先生做这个语法的练习 →</a><div class="pn"><a href="../g/ja-N5-54.html">← ～く／～に（修饰动词）</a><a href="../g/ja-N4-01.html">～たことがある →</a></div>
