<h1 lang="ko">안 / -지 않다</h1><p><b>不……（否定）</b> · 初级</p><p>안 放在动词、形容词前，-지 않다 接在词干后，意思相同，后者稍正式；“名词+하다”动词要说 공부 안 해요。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 고기를 안 먹어요.</div><div class="zh">我不吃肉。</div></div><div class="ex"><div lang="ko">오늘은 춥지 않아요.</div><div class="zh">今天不冷。</div></div><div class="ex"><div lang="ko">주말에는 일 안 해요.</div><div class="zh">周末不工作。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
