<h1 lang="ko">못 / -지 못하다</h1><p><b>不能、没能……</b> · 初级</p><p>表示因能力不足或外部原因而做不到；못 放在动词前，-지 못하다 接在词干后，后者较书面。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 수영을 못 해요.</div><div class="zh">我不会游泳。</div></div><div class="ex"><div lang="ko">바빠서 점심을 못 먹었어요.</div><div class="zh">太忙了，没吃上午饭。</div></div><div class="ex"><div lang="ko">어젯밤에 잠을 잘 자지 못했어요.</div><div class="zh">昨晚没睡好。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
