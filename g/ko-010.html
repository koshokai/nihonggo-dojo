<h1 lang="ko">-고 싶다</h1><p><b>想……</b> · 初级</p><p>接在动词词干后表示说话人的愿望；主语为第三人称时用 -고 싶어하다。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 한국에 가고 싶어요.</div><div class="zh">我想去韩国。</div></div><div class="ex"><div lang="ko">뭐 먹고 싶어요?</div><div class="zh">你想吃什么？</div></div><div class="ex"><div lang="ko">동생은 새 휴대폰을 사고 싶어해요.</div><div class="zh">弟弟想买新手机。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
