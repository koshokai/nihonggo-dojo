<h1 lang="ko">-(으)세요</h1><p><b>请……；（尊敬）</b> · 初级</p><p>接在动词词干后礼貌地请求或指示对方；词干有收音时用 -으세요。也可作为尊敬形式描述长辈的动作。</p><h2>例句</h2><div class="ex"><div lang="ko">잠깐만 기다리세요.</div><div class="zh">请稍等。</div></div><div class="ex"><div lang="ko">여기에 앉으세요.</div><div class="zh">请坐这里。</div></div><div class="ex"><div lang="ko">이 약은 하루에 세 번 드세요.</div><div class="zh">这个药请一天吃三次。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
