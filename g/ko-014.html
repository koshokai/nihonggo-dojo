<h1 lang="ko">-(으)ㄹ 거예요</h1><p><b>将要……；打算……；（推测）会……</b> · 初级</p><p>接在动词后表示未来的计划；接在动词、形容词后也可表示推测。</p><h2>例句</h2><div class="ex"><div lang="ko">내일 부산에 갈 거예요.</div><div class="zh">明天要去釜山。</div></div><div class="ex"><div lang="ko">주말에는 집에서 쉴 거예요.</div><div class="zh">周末打算在家休息。</div></div><div class="ex"><div lang="ko">아마 오후에 비가 올 거예요.</div><div class="zh">下午大概会下雨。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
