<h1 lang="ko">-아서 / -어서（原因）</h1><p><b>因为……所以……</b> · 初级</p><p>接在动词、形容词后表示原因；后句不能是命令句或共动句，前面也不能加 -았/었-。</p><h2>例句</h2><div class="ex"><div lang="ko">배가 고파서 라면을 먹었어요.</div><div class="zh">肚子饿了，所以吃了拉面。</div></div><div class="ex"><div lang="ko">늦어서 죄송합니다.</div><div class="zh">对不起，我来晚了。</div></div><div class="ex"><div lang="ko">비가 와서 집에 있었어요.</div><div class="zh">因为下雨，一直待在家里。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
