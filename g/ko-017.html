<h1 lang="ko">-(으)ㄹ 수 있다 / 없다</h1><p><b>能 / 不能……</b> · 初级</p><p>接在动词词干后表示能力或可能性；不能时用 -(으)ㄹ 수 없다。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 한국 노래를 부를 수 있어요.</div><div class="zh">我会唱韩国歌。</div></div><div class="ex"><div lang="ko">여기에서는 사진을 찍을 수 없어요.</div><div class="zh">这里不能拍照。</div></div><div class="ex"><div lang="ko">내일 만날 수 있어요?</div><div class="zh">明天能见面吗？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
