<h1 lang="ko">-지 마세요</h1><p><b>请不要……</b> · 初级</p><p>接在动词词干后礼貌地禁止或劝阻对方；非敬语形式为 -지 마。</p><h2>例句</h2><div class="ex"><div lang="ko">여기에서 담배를 피우지 마세요.</div><div class="zh">请不要在这里吸烟。</div></div><div class="ex"><div lang="ko">걱정하지 마세요.</div><div class="zh">别担心。</div></div><div class="ex"><div lang="ko">내일은 늦게 오지 마세요.</div><div class="zh">明天请别来晚了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
