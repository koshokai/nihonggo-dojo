<h1 lang="ko">-고 있다</h1><p><b>正在……；（穿戴状态）……着</b> · 初级</p><p>接在动词词干后表示动作正在进行；与 입다、쓰다、신다 等穿戴动词连用时表示状态持续。</p><h2>例句</h2><div class="ex"><div lang="ko">지금 밥을 먹고 있어요.</div><div class="zh">现在正在吃饭。</div></div><div class="ex"><div lang="ko">동생은 서울에서 살고 있어요.</div><div class="zh">弟弟住在首尔。</div></div><div class="ex"><div lang="ko">그 사람은 안경을 쓰고 있어요.</div><div class="zh">那个人戴着眼镜。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
