<h1 lang="ko">-(으)면</h1><p><b>如果……（就）</b> · 初级</p><p>接在动词、形容词词干后表示假设或条件；词干有收音时用 -으면。</p><h2>例句</h2><div class="ex"><div lang="ko">시간이 있으면 같이 가요.</div><div class="zh">有时间的话一起去吧。</div></div><div class="ex"><div lang="ko">봄이 되면 꽃이 피어요.</div><div class="zh">一到春天花就开了。</div></div><div class="ex"><div lang="ko">모르면 물어보세요.</div><div class="zh">不懂的话就问吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
