<h1 lang="ko">-아 / -어 주다</h1><p><b>（为别人）做……</b> · 初级</p><p>接在动词后表示为他人做某事；请求时用 -아/어 주세요，对长辈用 -아/어 드리다。</p><h2>例句</h2><div class="ex"><div lang="ko">사진 좀 찍어 주세요.</div><div class="zh">请帮我拍张照片。</div></div><div class="ex"><div lang="ko">친구가 길을 가르쳐 줬어요.</div><div class="zh">朋友给我指了路。</div></div><div class="ex"><div lang="ko">제가 도와 드릴게요.</div><div class="zh">我来帮您。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
