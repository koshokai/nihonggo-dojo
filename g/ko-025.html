<h1 lang="ko">-기 전에</h1><p><b>在……之前</b> · 初级</p><p>接在动词词干后表示某动作发生之前；名词后用 전에（如 식사 전에）。</p><h2>例句</h2><div class="ex"><div lang="ko">자기 전에 이를 닦아요.</div><div class="zh">睡觉前刷牙。</div></div><div class="ex"><div lang="ko">밥을 먹기 전에 손을 씻으세요.</div><div class="zh">吃饭前请洗手。</div></div><div class="ex"><div lang="ko">한국에 오기 전에 한국어를 조금 배웠어요.</div><div class="zh">来韩国之前学了一点韩语。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
