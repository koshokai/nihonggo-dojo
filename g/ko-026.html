<h1 lang="ko">-(으)ㄴ 후에</h1><p><b>在……之后</b> · 初级</p><p>接在动词词干后表示某动作结束之后；也可说 -(으)ㄴ 다음에，名词后用 후에（如 수업 후에）。</p><h2>例句</h2><div class="ex"><div lang="ko">수업이 끝난 후에 만나요.</div><div class="zh">下课后见。</div></div><div class="ex"><div lang="ko">밥을 먹은 후에 산책을 해요.</div><div class="zh">饭后散步。</div></div><div class="ex"><div lang="ko">졸업한 후에 뭐 할 거예요?</div><div class="zh">毕业后打算做什么？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
