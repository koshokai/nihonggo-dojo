<h1 lang="ko">-는 / -(으)ㄴ / -(으)ㄹ（定语）</h1><p><b>……的（修饰名词）</b> · 初级</p><p>动词现在时用 -는，过去用 -(으)ㄴ，将来或未实现用 -(으)ㄹ；形容词现在时用 -(으)ㄴ。</p><h2>例句</h2><div class="ex"><div lang="ko">지금 듣는 노래가 뭐예요?</div><div class="zh">你现在听的歌是什么？</div></div><div class="ex"><div lang="ko">어제 본 영화는 재미있었어요.</div><div class="zh">昨天看的电影很有意思。</div></div><div class="ex"><div lang="ko">내일 입을 옷을 샀어요.</div><div class="zh">买了明天要穿的衣服。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
