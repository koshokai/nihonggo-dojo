<h1 lang="ko">-는데 / -(으)ㄴ데</h1><p><b>……，（背景、转折）</b> · 中级</p><p>动词接 -는데，形容词接 -(으)ㄴ데，名词接 -인데；为后句提供背景信息，或表示对比、委婉的语气。</p><h2>例句</h2><div class="ex"><div lang="ko">비가 오는데 우산 있어요?</div><div class="zh">下雨了，你有伞吗？</div></div><div class="ex"><div lang="ko">이 식당은 맛있는데 좀 비싸요.</div><div class="zh">这家店好吃，就是有点贵。</div></div><div class="ex"><div lang="ko">내일 시간이 있는데 같이 갈까요?</div><div class="zh">我明天有空，一起去好吗？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
