<h1 lang="ko">-기 때문에 / 名词+때문에</h1><p><b>因为……</b> · 中级</p><p>接在动词、形容词后强调原因，语气较正式；名词后直接接 때문에；后句不能用命令句、共动句。</p><h2>例句</h2><div class="ex"><div lang="ko">내일 시험이 있기 때문에 일찍 자야 해요.</div><div class="zh">因为明天有考试，得早点睡。</div></div><div class="ex"><div lang="ko">감기 때문에 학교에 못 갔어요.</div><div class="zh">因为感冒没能去学校。</div></div><div class="ex"><div lang="ko">길이 막혔기 때문에 늦었습니다.</div><div class="zh">因为堵车，所以迟到了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
