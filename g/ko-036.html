<h1 lang="ko">-게 되다</h1><p><b>变得……；结果（得以）……</b> · 中级</p><p>接在动词、形容词后表示由于外部原因或情况变化而导致某种结果，并非出于主语本意。</p><h2>例句</h2><div class="ex"><div lang="ko">회사 때문에 서울에 살게 됐어요.</div><div class="zh">因为工作的关系，搬到首尔住了。</div></div><div class="ex"><div lang="ko">한국 드라마를 보고 한국어를 좋아하게 됐어요.</div><div class="zh">看了韩剧后喜欢上了韩语。</div></div><div class="ex"><div lang="ko">다음 주부터 같이 일하게 되었습니다.</div><div class="zh">下周开始我们要一起工作了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
