<h1 lang="ko">-(으)면서</h1><p><b>一边……一边……</b> · 中级</p><p>接在动词词干后表示两个动作同时进行，前后主语必须相同；也可表示对立（-(으)면서도）。</p><h2>例句</h2><div class="ex"><div lang="ko">음악을 들으면서 운동해요.</div><div class="zh">一边听音乐一边运动。</div></div><div class="ex"><div lang="ko">밥을 먹으면서 텔레비전을 봤어요.</div><div class="zh">边吃饭边看了电视。</div></div><div class="ex"><div lang="ko">회사에 다니면서 대학원에서 공부해요.</div><div class="zh">一边上班一边读研究生。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
