<h1 lang="ko">-(으)ㄹ 줄 알다 / 모르다</h1><p><b>会 / 不会……（方法、技能）</b> · 中级</p><p>接在动词词干后表示是否掌握某种方法或技能；与 -(으)ㄹ 수 있다 相比更强调“懂得怎么做”。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 운전할 줄 알아요.</div><div class="zh">我会开车。</div></div><div class="ex"><div lang="ko">김밥을 만들 줄 몰라요.</div><div class="zh">我不会做紫菜包饭。</div></div><div class="ex"><div lang="ko">한자를 읽을 줄 아세요?</div><div class="zh">您会读汉字吗？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
