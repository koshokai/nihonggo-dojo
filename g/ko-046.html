<h1 lang="ko">-도록</h1><p><b>以便……；直到……</b> · 中级</p><p>接在动词词干后表示目的或使后句达到某种程度；也可表示时间上的界限（如 밤늦도록）。</p><h2>例句</h2><div class="ex"><div lang="ko">감기에 걸리지 않도록 옷을 따뜻하게 입으세요.</div><div class="zh">为了不感冒，请穿暖和点。</div></div><div class="ex"><div lang="ko">뒤에 있는 사람도 들을 수 있도록 크게 말해 주세요.</div><div class="zh">请大声点说，让后面的人也能听到。</div></div><div class="ex"><div lang="ko">밤늦도록 이야기를 나눴어요.</div><div class="zh">一直聊到深夜。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
