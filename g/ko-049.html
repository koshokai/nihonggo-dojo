<h1 lang="ko">-더라고요</h1><p><b>（我发现）……呢</b> · 中级</p><p>接在动词、形容词后，向对方转述自己过去亲身看到、感受到的事情，带有回忆的语气。</p><h2>例句</h2><div class="ex"><div lang="ko">그 영화 정말 재미있더라고요.</div><div class="zh">那部电影真的很好看呢。</div></div><div class="ex"><div lang="ko">제주도에 가 보니까 바람이 많이 불더라고요.</div><div class="zh">去了济州岛发现风真大。</div></div><div class="ex"><div lang="ko">민수 씨가 노래를 정말 잘하더라고요.</div><div class="zh">敏秀唱歌真的很好听呢。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
