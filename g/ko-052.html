<h1 lang="ko">-(으)ㄴ/는 대신(에)</h1><p><b>代替……；（作为补偿）但是……</b> · 中级</p><p>名词后用 대신(에) 表示替代；接在动词、形容词后表示以前者换取后者，或前后两面相抵。</p><h2>例句</h2><div class="ex"><div lang="ko">오늘은 밥 대신 빵을 먹었어요.</div><div class="zh">今天没吃饭，吃了面包。</div></div><div class="ex"><div lang="ko">제가 요리하는 대신에 설거지는 당신이 해 주세요.</div><div class="zh">我来做饭，碗就你来洗吧。</div></div><div class="ex"><div lang="ko">이 집은 좁은 대신에 역에서 가까워요.</div><div class="zh">这房子虽然小，但离车站近。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
