<h1 lang="ko">-(으)ㄴ/는 데다가</h1><p><b>不仅……而且……</b> · 中级</p><p>接在动词、形容词后表示在前面的情况上再加上另一个同方向的情况。</p><h2>例句</h2><div class="ex"><div lang="ko">비가 오는 데다가 바람까지 불어요.</div><div class="zh">下着雨，还刮着风。</div></div><div class="ex"><div lang="ko">그 가게는 싼 데다가 직원도 친절해요.</div><div class="zh">那家店不但便宜，店员也很亲切。</div></div><div class="ex"><div lang="ko">오늘은 피곤한 데다가 배도 고파요.</div><div class="zh">今天又累又饿。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
