<h1 lang="ko">-ㄴ/는다고 하다（间接引语·陈述）</h1><p><b>（听说、某人说）……</b> · 中级</p><p>转述陈述句：动词现在时 -ㄴ/는다고，形容词 -다고，名词 -(이)라고，过去 -았/었다고；口语常缩略为 -대요。</p><h2>例句</h2><div class="ex"><div lang="ko">민지 씨가 오늘 못 온다고 했어요.</div><div class="zh">敏智说她今天来不了。</div></div><div class="ex"><div lang="ko">일기예보에서 내일 춥다고 해요.</div><div class="zh">天气预报说明天冷。</div></div><div class="ex"><div lang="ko">그분은 의사라고 들었어요.</div><div class="zh">听说那位是医生。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
