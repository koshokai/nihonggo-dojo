<h1 lang="ko">-아/어 놓다（두다）</h1><p><b>（预先）……好</b> · 中级</p><p>接在动词后表示动作完成后其结果状态得以保持，常带有“事先准备”的意思；-아/어 두다 意思相近。</p><h2>例句</h2><div class="ex"><div lang="ko">손님이 오기 전에 음식을 만들어 놓았어요.</div><div class="zh">客人来之前把菜做好了。</div></div><div class="ex"><div lang="ko">창문을 열어 놓고 나갔어요.</div><div class="zh">开着窗户就出去了。</div></div><div class="ex"><div lang="ko">중요한 내용은 메모해 두세요.</div><div class="zh">重要内容请记下来。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
