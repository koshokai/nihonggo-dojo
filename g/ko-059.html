<h1 lang="ko">-(으)ㄴ/는 김에</h1><p><b>顺便……；趁着……</b> · 中级</p><p>接在动词后表示借着做前一件事的机会顺便做后一件事。</p><h2>例句</h2><div class="ex"><div lang="ko">시장에 간 김에 과일도 샀어요.</div><div class="zh">去市场时顺便买了水果。</div></div><div class="ex"><div lang="ko">말이 나온 김에 하나 물어볼게요.</div><div class="zh">既然说到这儿了，我顺便问一件事。</div></div><div class="ex"><div lang="ko">일어난 김에 물 좀 갖다줄래요?</div><div class="zh">你都起来了，顺便帮我拿点水好吗？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
