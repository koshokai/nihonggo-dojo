<h1 lang="ko">-(으)ㄹ 뿐만 아니라</h1><p><b>不仅……而且……</b> · 高级</p><p>接在动词、形容词后表示在前者之外还有后者，名词后用 뿐만 아니라；后句常与 도、까지 呼应。</p><h2>例句</h2><div class="ex"><div lang="ko">이 제품은 디자인이 예쁠 뿐만 아니라 가격도 저렴합니다.</div><div class="zh">这款产品不仅设计好看，价格也实惠。</div></div><div class="ex"><div lang="ko">그는 노래를 잘할 뿐만 아니라 춤도 잘 춰요.</div><div class="zh">他不但歌唱得好，舞也跳得好。</div></div><div class="ex"><div lang="ko">운동은 건강뿐만 아니라 스트레스 해소에도 도움이 됩니다.</div><div class="zh">运动不仅有益健康，对缓解压力也有帮助。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
