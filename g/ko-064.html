<h1 lang="ko">-(으)ㄴ/는 탓에</h1><p><b>都怪……；由于……（负面原因）</b> · 高级</p><p>接在动词、形容词后，名词后用 탓에，表示导致不良结果的原因，带有归咎的语气；正面原因用 덕분에。</p><h2>例句</h2><div class="ex"><div lang="ko">밤새 게임을 한 탓에 하루 종일 졸렸어요.</div><div class="zh">因为熬夜打游戏，一整天都犯困。</div></div><div class="ex"><div lang="ko">날씨가 추운 탓에 손님이 적었어요.</div><div class="zh">由于天冷，客人很少。</div></div><div class="ex"><div lang="ko">제 실수 탓에 일이 늦어졌습니다.</div><div class="zh">都怪我的失误，工作延误了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
