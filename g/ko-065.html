<h1 lang="ko">-고 말다</h1><p><b>终于（还是）……了</b> · 高级</p><p>接在动词后表示违背意愿最终发生了不好的结果，带有遗憾语气；用 -고 말겠다 时表示坚定的决心。</p><h2>例句</h2><div class="ex"><div lang="ko">참다가 결국 울고 말았어요.</div><div class="zh">忍了又忍，最后还是哭了。</div></div><div class="ex"><div lang="ko">조심했는데도 컵을 깨고 말았어요.</div><div class="zh">虽然很小心，还是把杯子打碎了。</div></div><div class="ex"><div lang="ko">이번에는 꼭 합격하고 말겠어요.</div><div class="zh">这次我一定要考上。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
