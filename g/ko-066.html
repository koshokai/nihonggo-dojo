<h1 lang="ko">-느라고</h1><p><b>因为忙于……（所以没能……）</b> · 高级</p><p>接在动词词干后表示因做前面的事而无法顾及后面的事，前后主语相同，后句多为消极结果；前面不能加 -았/었-。</p><h2>例句</h2><div class="ex"><div lang="ko">숙제를 하느라고 잠을 못 잤어요.</div><div class="zh">因为写作业没睡觉。</div></div><div class="ex"><div lang="ko">이사 준비를 하느라 정신이 없었어요.</div><div class="zh">忙着准备搬家，晕头转向。</div></div><div class="ex"><div lang="ko">친구랑 이야기하느라고 전화 온 줄 몰랐어요.</div><div class="zh">光顾着和朋友聊天，没发现有电话。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
