<h1 lang="ko">-기는커녕</h1><p><b>别说……了，反而（连）……</b> · 高级</p><p>接在动词、形容词后，名词后用 은/는커녕，表示不仅前面的事没有实现，连更基本的也没做到，或出现相反的结果。</p><h2>例句</h2><div class="ex"><div lang="ko">칭찬을 받기는커녕 혼만 났어요.</div><div class="zh">别说表扬了，反倒挨了一顿骂。</div></div><div class="ex"><div lang="ko">돈을 모으기는커녕 빚만 늘었어요.</div><div class="zh">别说存钱了，倒是欠债越来越多。</div></div><div class="ex"><div lang="ko">너무 바빠서 밥은커녕 물 한 잔도 못 마셨어요.</div><div class="zh">太忙了，别说吃饭，连一口水都没喝上。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
