<h1 lang="ko">-(으)ㄹ 지경이다</h1><p><b>简直到了……的地步</b> · 高级</p><p>接在动词、形容词后，用夸张的说法表示程度极深，几乎达到某种状态。</p><h2>例句</h2><div class="ex"><div lang="ko">너무 배가 고파서 쓰러질 지경이에요.</div><div class="zh">饿得简直要晕倒了。</div></div><div class="ex"><div lang="ko">일이 너무 많아서 미칠 지경이에요.</div><div class="zh">活儿多得快把我逼疯了。</div></div><div class="ex"><div lang="ko">너무 웃겨서 배가 아플 지경이었어요.</div><div class="zh">太好笑了，笑得肚子都疼了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
