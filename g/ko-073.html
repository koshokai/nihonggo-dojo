<h1 lang="ko">-(으)ㄴ/는 이상</h1><p><b>既然……（就）</b> · 高级</p><p>接在动词、形容词后表示既然前面的事已成事实，后面就理所当然应该如此，后句多为义务、决心或推断。</p><h2>例句</h2><div class="ex"><div lang="ko">약속을 한 이상 지켜야 합니다.</div><div class="zh">既然答应了，就必须遵守。</div></div><div class="ex"><div lang="ko">시작한 이상 끝까지 해 보겠습니다.</div><div class="zh">既然开始了，就要坚持到底。</div></div><div class="ex"><div lang="ko">증거가 없는 이상 그를 의심할 수 없어요.</div><div class="zh">既然没有证据，就不能怀疑他。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
