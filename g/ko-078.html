<h1 lang="ko">-(으)ㄹ 겸</h1><p><b>兼……；顺便……</b> · 高级</p><p>接在动词词干后表示同时出于两个以上的目的做某事，常用 A도 -(으)ㄹ 겸 B도 -(으)ㄹ 겸 的形式。</p><h2>例句</h2><div class="ex"><div lang="ko">바람도 쐴 겸 산책하러 나왔어요.</div><div class="zh">出来散散步，顺便透透气。</div></div><div class="ex"><div lang="ko">운동도 할 겸 자전거로 출근해요.</div><div class="zh">骑自行车上班，顺便锻炼身体。</div></div><div class="ex"><div lang="ko">친구도 만날 겸 쇼핑도 할 겸 시내에 나갔어요.</div><div class="zh">去市区既见朋友又逛街。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
