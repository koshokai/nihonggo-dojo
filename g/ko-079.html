<h1 lang="ko">-든지 -든지</h1><p><b>不管……还是……；随便……</b> · 高级</p><p>接在动词、形容词后表示从几项中任选其一都无所谓；名词后用 (이)든지。注意不要与表示回忆的 -던지 混淆。</p><h2>例句</h2><div class="ex"><div lang="ko">가든지 말든지 네 마음대로 해.</div><div class="zh">去不去随你便。</div></div><div class="ex"><div lang="ko">비가 오든지 눈이 오든지 행사는 예정대로 진행됩니다.</div><div class="zh">不管下雨还是下雪，活动都照常举行。</div></div><div class="ex"><div lang="ko">커피든지 차든지 아무거나 좋아요.</div><div class="zh">咖啡或者茶，什么都行。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
