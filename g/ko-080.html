<h1 lang="ko">-더니</h1><p><b>（观察到）……之后；以前……现在却……</b> · 高级</p><p>接在动词、形容词后，叙述说话人过去观察到的他人或事物的情况，后句为随之而来的结果或与之对比的变化；主语一般不是第一人称。</p><h2>例句</h2><div class="ex"><div lang="ko">아침에는 맑더니 오후에 비가 오네요.</div><div class="zh">早上还晴着，下午就下起雨来了。</div></div><div class="ex"><div lang="ko">민수가 열심히 공부하더니 결국 장학금을 받았어요.</div><div class="zh">敏秀一直努力学习，最后拿到了奖学金。</div></div><div class="ex"><div lang="ko">동생이 아까부터 배가 아프다고 하더니 병원에 갔어요.</div><div class="zh">弟弟刚才一直说肚子疼，后来去医院了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
