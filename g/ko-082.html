<h1 lang="ko">-(으)ㄹ 따름이다</h1><p><b>只是……而已；唯有……</b> · 高级</p><p>接在动词、形容词后表示除此之外别无其他，语气正式、谦逊，多用于致辞或书面语。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 제 일을 했을 따름입니다.</div><div class="zh">我只是做了我该做的事。</div></div><div class="ex"><div lang="ko">도와주셔서 그저 감사할 따름입니다.</div><div class="zh">承蒙您帮助，唯有感激。</div></div><div class="ex"><div lang="ko">모두 무사하다니 다행일 따름이에요.</div><div class="zh">听说大家都平安，真是万幸。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
