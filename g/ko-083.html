<h1 lang="ko">-(으)ㄴ/는 마당에</h1><p><b>在……这种情况下（都到这个地步了）</b> · 高级</p><p>接在动词、形容词后表示在已经形成的某种局面下，后句多为反问或说话人的决定。</p><h2>例句</h2><div class="ex"><div lang="ko">회사를 그만두는 마당에 무슨 걱정이 있겠어요?</div><div class="zh">都要辞职了，还有什么可担心的？</div></div><div class="ex"><div lang="ko">일이 이렇게 된 마당에 솔직하게 말할게요.</div><div class="zh">事已至此，我就实话实说吧。</div></div><div class="ex"><div lang="ko">다들 힘든 마당에 나만 쉴 수는 없지요.</div><div class="zh">大家都这么辛苦，我怎么能一个人休息。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
