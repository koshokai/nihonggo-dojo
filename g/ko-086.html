<h1 lang="ko">-(으)ㄹ망정</h1><p><b>即使……也（宁可）……</b> · 高级</p><p>接在动词、形容词后表示即使承认或接受前面不好的情况，也要坚持后面的事，多用于书面语或强调决心。</p><h2>例句</h2><div class="ex"><div lang="ko">굶어 죽을망정 남의 것은 훔치지 않겠다.</div><div class="zh">宁可饿死，也不偷别人的东西。</div></div><div class="ex"><div lang="ko">시간이 좀 걸릴망정 제대로 하는 게 낫다.</div><div class="zh">即使多花点时间，也最好做得像样。</div></div><div class="ex"><div lang="ko">비록 작은 회사일망정 내가 세운 회사라서 자랑스럽다.</div><div class="zh">虽说是个小公司，但是我亲手创立的，所以很自豪。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
