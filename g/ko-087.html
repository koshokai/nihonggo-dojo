<h1 lang="ko">-거니와</h1><p><b>不但……而且……（书面）</b> · 高级</p><p>接在动词、形容词后表示承认前面的事实，同时追加后面同类的内容，多用于书面语和正式场合。</p><h2>例句</h2><div class="ex"><div lang="ko">그는 실력도 있거니와 성격도 좋다.</div><div class="zh">他不但有实力，性格也好。</div></div><div class="ex"><div lang="ko">이 방법은 시간도 절약되거니와 비용도 적게 든다.</div><div class="zh">这个方法既节省时间，费用也低。</div></div><div class="ex"><div lang="ko">날씨도 좋거니와 바람도 시원해서 산책하기에 딱 좋다.</div><div class="zh">天气好，风也凉爽，正适合散步。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
