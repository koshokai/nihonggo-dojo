<h1 lang="ko">-(으)ㄹ세라</h1><p><b>生怕……；唯恐……</b> · 高级</p><p>接在动词、形容词后表示担心发生某事而采取后面的行动，书面色彩较浓。</p><h2>例句</h2><div class="ex"><div lang="ko">아이가 깰세라 조용히 문을 닫았다.</div><div class="zh">生怕吵醒孩子，轻轻地关上了门。</div></div><div class="ex"><div lang="ko">늦을세라 서둘러 집을 나섰다.</div><div class="zh">唯恐迟到，匆匆出了门。</div></div><div class="ex"><div lang="ko">누가 볼세라 편지를 얼른 감췄다.</div><div class="zh">生怕被人看见，赶紧把信藏了起来。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
