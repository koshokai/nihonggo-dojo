<h1 lang="ko">-고자 하다</h1><p><b>想要……；为了……（书面）</b> · 高级</p><p>接在动词词干后表示意图或目的，语气正式，多用于演讲、报告、公文和书信。</p><h2>例句</h2><div class="ex"><div lang="ko">이번 발표에서는 환경 문제를 다루고자 합니다.</div><div class="zh">本次发表想探讨环境问题。</div></div><div class="ex"><div lang="ko">귀사에 지원하고자 이 메일을 드립니다.</div><div class="zh">为应聘贵公司，特发此邮件。</div></div><div class="ex"><div lang="ko">여러분께 감사의 말씀을 전하고자 합니다.</div><div class="zh">我想向各位表达谢意。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
