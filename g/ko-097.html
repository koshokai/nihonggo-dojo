<h1 lang="ko">에서 ~까지 / 부터 ~까지</h1><p><b>从……到……</b> · 初级</p><p>에서~까지 表示地点的起点和终点，부터~까지 表示时间的开始和结束。</p><h2>例句</h2><div class="ex"><div lang="ko">집에서 회사까지 한 시간 걸려요.</div><div class="zh">从家到公司要一个小时。</div></div><div class="ex"><div lang="ko">수업은 아홉 시부터 열두 시까지예요.</div><div class="zh">课从九点上到十二点。</div></div><div class="ex"><div lang="ko">서울에서 부산까지 기차로 갔어요.</div><div class="zh">从首尔坐火车去了釜山。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
