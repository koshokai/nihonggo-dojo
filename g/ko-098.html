<h1 lang="ko">(으)로（方向 · 手段）</h1><p><b>向、往；用、乘</b> · 初级</p><p>接在名词后表示方向、手段、工具或材料；无收音或以ㄹ结尾的名词后用 로，其他收音后用 으로。</p><h2>例句</h2><div class="ex"><div lang="ko">오른쪽으로 가세요.</div><div class="zh">请往右边走。</div></div><div class="ex"><div lang="ko">지하철로 출근해요.</div><div class="zh">坐地铁上班。</div></div><div class="ex"><div lang="ko">이 빵은 쌀로 만들었어요.</div><div class="zh">这个面包是用米做的。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
