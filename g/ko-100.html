<h1 lang="ko">처럼 / 같이</h1><p><b>像……一样</b> · 初级</p><p>接在名词后表示比喻或样子相同；같이 单独使用时还有「一起」的意思。</p><h2>例句</h2><div class="ex"><div lang="ko">그 사람은 가수처럼 노래를 잘해요.</div><div class="zh">他像歌手一样唱得好。</div></div><div class="ex"><div lang="ko">아이가 천사같이 웃어요.</div><div class="zh">孩子笑得像天使一样。</div></div><div class="ex"><div lang="ko">오늘은 여름처럼 더워요.</div><div class="zh">今天像夏天一样热。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
