<h1 lang="ko">마다</h1><p><b>每……</b> · 初级</p><p>接在名词后表示「每一」，如 날마다、주말마다、사람마다。</p><h2>例句</h2><div class="ex"><div lang="ko">저는 아침마다 공원에서 달려요.</div><div class="zh">我每天早上在公园跑步。</div></div><div class="ex"><div lang="ko">사람마다 생각이 달라요.</div><div class="zh">每个人的想法都不一样。</div></div><div class="ex"><div lang="ko">이 버스는 십 분마다 와요.</div><div class="zh">这趟公交车每十分钟来一趟。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
