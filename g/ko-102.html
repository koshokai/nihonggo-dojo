<h1 lang="ko">밖에 + 否定</h1><p><b>只（有）……</b> · 初级</p><p>接在名词后，必须与否定形式（없다、안、못、모르다）搭配，强调数量少或别无选择。</p><h2>例句</h2><div class="ex"><div lang="ko">지갑에 천 원밖에 없어요.</div><div class="zh">钱包里只有一千韩元。</div></div><div class="ex"><div lang="ko">어제 세 시간밖에 못 잤어요.</div><div class="zh">昨天只睡了三个小时。</div></div><div class="ex"><div lang="ko">저는 한국어밖에 몰라요.</div><div class="zh">我只会韩语。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
