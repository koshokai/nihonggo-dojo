<h1 lang="ko">-(으)시-（主体敬语）</h1><p><b>（对主语表示尊敬）</b> · 初级</p><p>接在动词、形容词词干后，对句子主语表示尊敬；有收音加 -으시-，无收音加 -시-，해요体现在时为 -(으)세요。</p><h2>例句</h2><div class="ex"><div lang="ko">할아버지께서 신문을 읽으십니다.</div><div class="zh">爷爷在看报纸。</div></div><div class="ex"><div lang="ko">선생님은 지금 교실에 계세요.</div><div class="zh">老师现在在教室里。</div></div><div class="ex"><div lang="ko">사장님이 어제 출장을 가셨어요.</div><div class="zh">社长昨天去出差了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
