<h1 lang="ko">께서 / 께서는 · 敬语词汇</h1><p><b>（主语敬语助词）</b> · 初级</p><p>께서 是 이/가 的敬语，께서는 是 은/는 的敬语；常与 드시다（吃）、주무시다（睡）、계시다（在）、말씀하시다（说）等敬语词汇一起使用。</p><h2>例句</h2><div class="ex"><div lang="ko">할머니께서 진지를 드십니다.</div><div class="zh">奶奶在用饭。</div></div><div class="ex"><div lang="ko">아버지께서는 지금 주무세요.</div><div class="zh">爸爸现在在睡觉。</div></div><div class="ex"><div lang="ko">교수님께서 말씀하셨어요.</div><div class="zh">教授说了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
