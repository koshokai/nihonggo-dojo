<h1 lang="ko">-(으)ㅂ시다</h1><p><b>（我们）……吧</b> · 初级</p><p>接在动词词干后表示共同提议，用于正式场合；有收音用 -읍시다，无收音用 -ㅂ시다；一般不直接对长辈使用。</p><h2>例句</h2><div class="ex"><div lang="ko">같이 점심을 먹읍시다.</div><div class="zh">一起吃午饭吧。</div></div><div class="ex"><div lang="ko">여기에서 잠깐 쉽시다.</div><div class="zh">在这里稍微休息一下吧。</div></div><div class="ex"><div lang="ko">그럼 회의를 시작합시다.</div><div class="zh">那么开始开会吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
