<h1 lang="ko">-고 나서</h1><p><b>……之后（再）</b> · 初级</p><p>接在动词词干后，强调前一动作完成后再进行后一动作；前面不加时态 -았/었-。</p><h2>例句</h2><div class="ex"><div lang="ko">밥을 먹고 나서 약을 드세요.</div><div class="zh">吃完饭后请吃药。</div></div><div class="ex"><div lang="ko">숙제를 하고 나서 게임을 했어요.</div><div class="zh">做完作业后玩了游戏。</div></div><div class="ex"><div lang="ko">영화를 보고 나서 커피를 마셨어요.</div><div class="zh">看完电影后喝了咖啡。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
