<h1 lang="ko">-네요</h1><p><b>……啊、……呢（感叹）</b> · 初级</p><p>接在词干后，表示说话人当场发现或感受到某事并发出感叹。</p><h2>例句</h2><div class="ex"><div lang="ko">와, 경치가 정말 아름답네요.</div><div class="zh">哇，景色真美啊。</div></div><div class="ex"><div lang="ko">한국어를 정말 잘하시네요.</div><div class="zh">您韩语说得真好啊。</div></div><div class="ex"><div lang="ko">벌써 열 시네요.</div><div class="zh">已经十点了呢。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
