<h1 lang="ko">-겠-（意志 · 推测）</h1><p><b>要……；会……吧</b> · 初级</p><p>接在词干后，用于第一人称时表示说话人的意志，用于他人或情况时表示推测；也用于 알겠습니다、잘 먹겠습니다 等惯用说法。</p><h2>例句</h2><div class="ex"><div lang="ko">제가 내일 다시 전화하겠습니다.</div><div class="zh">我明天再给您打电话。</div></div><div class="ex"><div lang="ko">하늘이 어두워요. 곧 비가 오겠어요.</div><div class="zh">天黑下来了，马上要下雨了。</div></div><div class="ex"><div lang="ko">하루 종일 일해서 피곤하겠어요.</div><div class="zh">工作了一整天，一定很累吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
