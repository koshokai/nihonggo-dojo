<h1 lang="ko">-아서 / -어서（先后顺序）</h1><p><b>……然后（接着）……</b> · 初级</p><p>连接两个紧密相关的动作，前一动作的结果延续到后一动作（如 가서、만나서、만들어서）；前后主语相同，前面不加时态。</p><h2>例句</h2><div class="ex"><div lang="ko">시장에 가서 과일을 샀어요.</div><div class="zh">去市场买了水果。</div></div><div class="ex"><div lang="ko">친구를 만나서 같이 저녁을 먹었어요.</div><div class="zh">见了朋友，一起吃了晚饭。</div></div><div class="ex"><div lang="ko">케이크를 만들어서 동생에게 줬어요.</div><div class="zh">做了蛋糕送给了弟弟。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
