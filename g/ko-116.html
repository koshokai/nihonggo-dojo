<h1 lang="ko">-는 중이다 / 名词+중이다</h1><p><b>正在……</b> · 初级</p><p>接在动词词干或动作性名词后，强调某动作正在进行中，常用于说明当前状态（如 회의 중、공사 중）。</p><h2>例句</h2><div class="ex"><div lang="ko">지금 밥을 먹는 중이에요.</div><div class="zh">我正在吃饭。</div></div><div class="ex"><div lang="ko">사장님은 지금 회의 중이세요.</div><div class="zh">社长现在正在开会。</div></div><div class="ex"><div lang="ko">집을 찾는 중인데 좋은 곳이 없어요.</div><div class="zh">正在找房子，可是没有合适的。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
