<h1 lang="ko">-(으)ㄴ 지 ~이/가 되다</h1><p><b>……已经（多长时间）了</b> · 初级</p><p>接在动词词干后，表示某动作发生后经过的时间，后面也可用 지나다、넘다；有收音用 -은 지，无收音用 -ㄴ 지。</p><h2>例句</h2><div class="ex"><div lang="ko">한국에 온 지 일 년이 됐어요.</div><div class="zh">来韩国已经一年了。</div></div><div class="ex"><div lang="ko">밥을 먹은 지 두 시간밖에 안 됐어요.</div><div class="zh">吃完饭才过了两个小时。</div></div><div class="ex"><div lang="ko">이 회사에서 일한 지 오 년이 넘었어요.</div><div class="zh">在这家公司工作已经超过五年了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
