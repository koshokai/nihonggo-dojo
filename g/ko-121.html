<h1 lang="ko">-아/어 보이다</h1><p><b>看起来……</b> · 中级</p><p>接在形容词词干后，表示根据外表做出的判断；修饰名词时用 -아/어 보이는。</p><h2>例句</h2><div class="ex"><div lang="ko">오늘 기분이 좋아 보여요.</div><div class="zh">你今天看起来心情不错。</div></div><div class="ex"><div lang="ko">이 케이크 정말 맛있어 보이네요.</div><div class="zh">这个蛋糕看起来真好吃。</div></div><div class="ex"><div lang="ko">피곤해 보이는데 좀 쉬세요.</div><div class="zh">你看起来很累，休息一下吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
