<h1 lang="ko">-아/어하다</h1><p><b>（觉得）……</b> · 中级</p><p>接在表示心理、感觉的形容词后使其变为动词，用于描述他人（第三人称）的感受，如 좋아하다、싫어하다、부끄러워하다。</p><h2>例句</h2><div class="ex"><div lang="ko">동생이 강아지를 무서워해요.</div><div class="zh">弟弟怕狗。</div></div><div class="ex"><div lang="ko">아이들이 선물을 받고 기뻐했어요.</div><div class="zh">孩子们收到礼物很高兴。</div></div><div class="ex"><div lang="ko">친구가 요즘 시험 때문에 힘들어해요.</div><div class="zh">朋友最近因为考试很辛苦。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
