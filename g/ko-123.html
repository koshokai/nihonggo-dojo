<h1 lang="ko">-기 위해(서) / 名词+을/를 위해(서)</h1><p><b>为了……</b> · 中级</p><p>表示目的，前后主语一致，比 -(으)려고 更正式，后句可用命令、共动形；修饰名词时用 -기 위한 / -을/를 위한。</p><h2>例句</h2><div class="ex"><div lang="ko">건강을 위해서 매일 운동해요.</div><div class="zh">为了健康，每天运动。</div></div><div class="ex"><div lang="ko">장학금을 받기 위해 열심히 공부했어요.</div><div class="zh">为了拿奖学金而努力学习了。</div></div><div class="ex"><div lang="ko">환경을 지키기 위한 방법을 생각해 봅시다.</div><div class="zh">一起想想保护环境的方法吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
