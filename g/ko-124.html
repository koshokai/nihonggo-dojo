<h1 lang="ko">-(으)ㄴ/는 대로</h1><p><b>按照……；一……就……</b> · 中级</p><p>接在动词后表示「照前面的样子」；-는 대로 也可表示「一……就……」；名词后直接用 대로（如 계획대로）。</p><h2>例句</h2><div class="ex"><div lang="ko">들은 대로 말해 주세요.</div><div class="zh">请照你听到的说。</div></div><div class="ex"><div lang="ko">집에 도착하는 대로 연락할게요.</div><div class="zh">一到家就联系你。</div></div><div class="ex"><div lang="ko">모든 일이 계획대로 됐어요.</div><div class="zh">一切都按计划进行了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
