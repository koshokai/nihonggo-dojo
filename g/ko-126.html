<h1 lang="ko">-(으)ㄴ/는지（间接疑问）</h1><p><b>是否……、……什么／哪里</b> · 中级</p><p>将疑问内容嵌入句中，常与 알다、모르다、궁금하다、물어보다 连用；动词现在用 -는지，形容词用 -(으)ㄴ지，推测用 -(으)ㄹ지。</p><h2>例句</h2><div class="ex"><div lang="ko">이 식당이 몇 시에 문을 여는지 알아요?</div><div class="zh">你知道这家餐厅几点开门吗？</div></div><div class="ex"><div lang="ko">그 사람이 누구인지 모르겠어요.</div><div class="zh">不知道那个人是谁。</div></div><div class="ex"><div lang="ko">내일 비가 올지 궁금해요.</div><div class="zh">不知道明天会不会下雨。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
