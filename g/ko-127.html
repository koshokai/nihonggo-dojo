<h1 lang="ko">-냐고 하다 / 묻다（间接引语 · 疑问）</h1><p><b>问……</b> · 中级</p><p>转述疑问句；口语中动词、形容词都常用 -냐고（标准书面语动词用 -느냐고，形容词用 -(으)냐고），名词后用 -(이)냐고。</p><h2>例句</h2><div class="ex"><div lang="ko">친구가 저한테 언제 고향에 가냐고 물었어요.</div><div class="zh">朋友问我什么时候回老家。</div></div><div class="ex"><div lang="ko">선생님이 숙제를 했냐고 하셨어요.</div><div class="zh">老师问作业做了没有。</div></div><div class="ex"><div lang="ko">엄마가 이게 뭐냐고 물어보셨어요.</div><div class="zh">妈妈问这是什么。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
