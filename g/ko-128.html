<h1 lang="ko">-대요 / -래요（间接引语缩略）</h1><p><b>听说……、（某人）说……</b> · 中级</p><p>-ㄴ/는다고 해요 缩略为 -ㄴ/는대요，-(이)라고 해요 缩略为 -(이)래요，-(으)라고 해요 缩略为 -(으)래요；口语中常用于转述听到的消息。</p><h2>例句</h2><div class="ex"><div lang="ko">내일 눈이 온대요.</div><div class="zh">听说明天下雪。</div></div><div class="ex"><div lang="ko">저분이 새로 온 선생님이래요.</div><div class="zh">听说那位是新来的老师。</div></div><div class="ex"><div lang="ko">엄마가 일찍 들어오래요.</div><div class="zh">妈妈说让早点回家。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
