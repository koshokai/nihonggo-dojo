<h1 lang="ko">-(으)ㄹ 텐데</h1><p><b>（想必）会……吧，所以／可是……</b> · 中级</p><p>接在词干后表示说话人的推测，并引出与之相关的担心、建议或遗憾；-았/었을 텐데 表示「本来会……」。</p><h2>例句</h2><div class="ex"><div lang="ko">지금 길이 많이 막힐 텐데 지하철을 타세요.</div><div class="zh">现在路上应该很堵，坐地铁吧。</div></div><div class="ex"><div lang="ko">배고플 텐데 먼저 드세요.</div><div class="zh">你应该饿了，先吃吧。</div></div><div class="ex"><div lang="ko">미리 알았으면 좋았을 텐데요.</div><div class="zh">要是早知道就好了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
