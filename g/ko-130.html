<h1 lang="ko">-나 보다 / -(으)ㄴ가 보다</h1><p><b>好像……、看来……</b> · 中级</p><p>根据观察到的情况进行推测；动词用 -나 보다，形容词用 -(으)ㄴ가 보다（口语中形容词也常用 -나 보다）；一般不用于说话人自己。</p><h2>例句</h2><div class="ex"><div lang="ko">다들 우산을 쓰고 있네요. 밖에 비가 오나 봐요.</div><div class="zh">大家都打着伞，外面好像在下雨。</div></div><div class="ex"><div lang="ko">민수 씨가 계속 웃어요. 기분이 좋은가 봐요.</div><div class="zh">敏洙一直在笑，看来心情不错。</div></div><div class="ex"><div lang="ko">불이 꺼져 있어요. 다들 퇴근했나 봐요.</div><div class="zh">灯都关了，大家好像都下班了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
