<h1 lang="ko">-(으)ㄴ/는/(으)ㄹ 모양이다</h1><p><b>看样子……</b> · 中级</p><p>根据客观情况进行推测，比 -나 보다 稍正式；过去用 -(으)ㄴ 모양이다，现在用 -는 모양이다，将来用 -(으)ㄹ 모양이다。</p><h2>例句</h2><div class="ex"><div lang="ko">길이 젖었네요. 밤에 비가 온 모양이에요.</div><div class="zh">路湿了，看样子夜里下过雨。</div></div><div class="ex"><div lang="ko">옆집이 시끄러워요. 파티를 하는 모양이에요.</div><div class="zh">邻居家很吵，看样子在开派对。</div></div><div class="ex"><div lang="ko">하늘을 보니 곧 눈이 올 모양이에요.</div><div class="zh">看天色，好像马上要下雪了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
