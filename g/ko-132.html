<h1 lang="ko">-(으)ㄹ지도 모르다</h1><p><b>说不定……、也许……</b> · 中级</p><p>表示对不确定的可能性的推测；对过去的推测用 -았/었을지도 모르다。</p><h2>例句</h2><div class="ex"><div lang="ko">내일은 비가 올지도 몰라요.</div><div class="zh">明天说不定会下雨。</div></div><div class="ex"><div lang="ko">그 사람은 벌써 떠났을지도 몰라요.</div><div class="zh">他也许已经走了。</div></div><div class="ex"><div lang="ko">길이 막힐지도 모르니까 일찍 출발합시다.</div><div class="zh">可能会堵车，早点出发吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
