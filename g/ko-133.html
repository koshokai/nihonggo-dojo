<h1 lang="ko">-아/어야겠다</h1><p><b>得……、必须……（决心）</b> · 中级</p><p>表示说话人根据当前情况下决心要做某事，语气比 -아/어야 하다 更主观。</p><h2>例句</h2><div class="ex"><div lang="ko">요즘 살이 쪄서 운동을 해야겠어요.</div><div class="zh">最近胖了，得运动了。</div></div><div class="ex"><div lang="ko">너무 늦었네요. 이제 가 봐야겠어요.</div><div class="zh">太晚了，我得走了。</div></div><div class="ex"><div lang="ko">다음에는 꼭 미리 예약해야겠어요.</div><div class="zh">下次一定得提前预约。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
