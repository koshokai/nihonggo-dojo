<h1 lang="ko">-던 / -았/었던（回想定语）</h1><p><b>（以前）常……的、……过的</b> · 中级</p><p>接在词干后修饰名词，-던 表示回忆过去反复的动作或中断未完成的动作，-았/었던 表示已经完成的过去经历。</p><h2>例句</h2><div class="ex"><div lang="ko">이건 제가 어릴 때 자주 듣던 노래예요.</div><div class="zh">这是我小时候常听的歌。</div></div><div class="ex"><div lang="ko">아까 마시던 커피 어디 있어요?</div><div class="zh">刚才喝了一半的咖啡在哪儿？</div></div><div class="ex"><div lang="ko">작년에 갔던 식당에 다시 가 봤어요.</div><div class="zh">又去了一次去年去过的餐厅。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
