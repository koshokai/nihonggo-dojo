<h1 lang="ko">-아/어 버리다</h1><p><b>……掉、……完</b> · 中级</p><p>表示动作彻底完成，常带有遗憾、可惜或如释重负的语气。</p><h2>例句</h2><div class="ex"><div lang="ko">동생이 제 케이크를 다 먹어 버렸어요.</div><div class="zh">弟弟把我的蛋糕全吃光了。</div></div><div class="ex"><div lang="ko">버스가 벌써 떠나 버렸어요.</div><div class="zh">公交车已经开走了。</div></div><div class="ex"><div lang="ko">고민하지 말고 그냥 말해 버리세요.</div><div class="zh">别犹豫了，干脆说出来吧。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
