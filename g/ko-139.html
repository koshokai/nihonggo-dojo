<h1 lang="ko">-(으)ㄴ/는 만큼</h1><p><b>像……那样（程度）；既然……就</b> · 中级</p><p>表示程度相当或成比例（如 노력한 만큼）；也表示原因、根据（「既然」）；名词后直接用 만큼。</p><h2>例句</h2><div class="ex"><div lang="ko">노력한 만큼 좋은 결과가 나올 거예요.</div><div class="zh">付出多少努力，就会有多好的结果。</div></div><div class="ex"><div lang="ko">먹을 만큼만 덜어 가세요.</div><div class="zh">只拿能吃完的量吧。</div></div><div class="ex"><div lang="ko">중요한 회의인 만큼 미리 준비해야 해요.</div><div class="zh">既然是重要的会议，就要提前准备。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
