<h1 lang="ko">-(으)ㄴ/는데도</h1><p><b>尽管……还是……</b> · 中级</p><p>表示前面已成事实的情况与预期的结果相反，比 -아/어도 更强调既成事实。</p><h2>例句</h2><div class="ex"><div lang="ko">약을 먹었는데도 열이 안 내려요.</div><div class="zh">吃了药，烧还是没退。</div></div><div class="ex"><div lang="ko">비가 오는데도 사람이 많아요.</div><div class="zh">尽管在下雨，人还是很多。</div></div><div class="ex"><div lang="ko">여러 번 설명했는데도 이해를 못 해요.</div><div class="zh">解释了好几遍，还是不明白。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
