<h1 lang="ko">-(으)ㄹ 걸 그랬다</h1><p><b>早知道就……了（后悔）</b> · 中级</p><p>表示对过去没做的事感到后悔；-지 말 걸 그랬다 表示后悔做了某事；口语可只说 -(으)ㄹ걸。</p><h2>例句</h2><div class="ex"><div lang="ko">우산을 가져올 걸 그랬어요.</div><div class="zh">早知道就带伞来了。</div></div><div class="ex"><div lang="ko">그 말은 하지 말 걸 그랬어요.</div><div class="zh">真不该说那句话。</div></div><div class="ex"><div lang="ko">좀 더 일찍 출발할걸.</div><div class="zh">要是早点出发就好了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
