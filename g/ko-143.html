<h1 lang="ko">-거든요</h1><p><b>因为……嘛（说明理由）</b> · 中级</p><p>用于口语，向对方说明对方不知道的理由或背景；也可用来引出后面要说的话题。</p><h2>例句</h2><div class="ex"><div lang="ko">오늘은 일찍 가야 해요. 약속이 있거든요.</div><div class="zh">今天得早点走，因为有约。</div></div><div class="ex"><div lang="ko">어제 못 왔어요. 몸이 좀 아팠거든요.</div><div class="zh">昨天没来，身体有点不舒服。</div></div><div class="ex"><div lang="ko">제가 요즘 요리를 배우거든요. 생각보다 재미있어요.</div><div class="zh">我最近在学做菜，比想象的有意思。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
