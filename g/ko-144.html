<h1 lang="ko">-(으)ㄴ/는 줄 알았다 / 몰랐다</h1><p><b>（原来）以为……／没想到……</b> · 中级</p><p>-(으)ㄴ/는 줄 알았다 表示原以为如此、实际并非如此；-(으)ㄴ/는 줄 몰랐다 表示没想到、不知道某事（区别于表示能力的 -(으)ㄹ 줄 알다）。</p><h2>例句</h2><div class="ex"><div lang="ko">오늘이 토요일인 줄 알았어요.</div><div class="zh">我还以为今天是星期六。</div></div><div class="ex"><div lang="ko">그 사람이 학생인 줄 몰랐어요.</div><div class="zh">没想到他是学生。</div></div><div class="ex"><div lang="ko">벌써 다 끝난 줄 알았는데 아직이네요.</div><div class="zh">还以为已经全结束了，原来还没有。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
