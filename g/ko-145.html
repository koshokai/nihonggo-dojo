<h1 lang="ko">-곤 하다</h1><p><b>常常……、时常……</b> · 中级</p><p>接在动词词干后，表示过去或现在反复发生的习惯性动作，常与 가끔、자주 连用。</p><h2>例句</h2><div class="ex"><div lang="ko">어렸을 때 할머니 댁에 자주 가곤 했어요.</div><div class="zh">小时候常去奶奶家。</div></div><div class="ex"><div lang="ko">스트레스를 받으면 노래방에 가곤 해요.</div><div class="zh">有压力的时候常去KTV。</div></div><div class="ex"><div lang="ko">저녁을 먹고 나서 강가를 걷곤 했어요.</div><div class="zh">以前常在晚饭后去江边散步。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
