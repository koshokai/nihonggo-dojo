<h1 lang="ko">-(으)ㄴ/는 바</h1><p><b>……的事（内容）；如……所</b> · 高级</p><p>书面语，指代前面所述的内容、方法或事实，常见 -(으)ㄴ 바와 같이（如……所述）、-(으)ㄴ 바 있다（曾经……）。</p><h2>例句</h2><div class="ex"><div lang="ko">앞에서 설명한 바와 같이 이 제도는 내년부터 시행됩니다.</div><div class="zh">如前所述，该制度将从明年开始实施。</div></div><div class="ex"><div lang="ko">회의에서 논의한 바를 정리해 보고드리겠습니다.</div><div class="zh">我会把会上讨论的内容整理后向您汇报。</div></div><div class="ex"><div lang="ko">그는 이 문제에 대해 여러 차례 언급한 바 있다.</div><div class="zh">他曾多次提及这个问题。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
