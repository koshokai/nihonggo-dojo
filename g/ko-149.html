<h1 lang="ko">-(으)므로</h1><p><b>因为……、由于……（书面）</b> · 高级</p><p>书面语或正式场合中表示原因、根据，多用于公文、说明、演讲；名词后用 -(이)므로。</p><h2>例句</h2><div class="ex"><div lang="ko">이 지역은 비가 많이 오므로 홍수에 대비해야 한다.</div><div class="zh">该地区降雨多，因此须防范洪水。</div></div><div class="ex"><div lang="ko">위 학생은 성적이 우수하므로 이 상장을 수여합니다.</div><div class="zh">该生成绩优异，特发此奖状。</div></div><div class="ex"><div lang="ko">내용이 사실과 다르므로 수정이 필요합니다.</div><div class="zh">内容与事实不符，需要修改。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
