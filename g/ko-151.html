<h1 lang="ko">-(으)ㄴ/는 가운데</h1><p><b>在……之中、在……的情况下</b> · 高级</p><p>书面语、新闻常用，表示在某种状况持续的背景下发生了后面的事。</p><h2>例句</h2><div class="ex"><div lang="ko">많은 관객이 지켜보는 가운데 경기가 시작되었다.</div><div class="zh">在众多观众的注视下，比赛开始了。</div></div><div class="ex"><div lang="ko">바쁘신 가운데 이렇게 와 주셔서 감사합니다.</div><div class="zh">感谢您在百忙之中前来。</div></div><div class="ex"><div lang="ko">전국에 비가 내리는 가운데 일부 지역에는 강풍이 불겠습니다.</div><div class="zh">全国有雨，部分地区还将出现大风。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
