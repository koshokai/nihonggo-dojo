<h1 lang="ko">-기 나름이다</h1><p><b>取决于……、全看……</b> · 高级</p><p>接在动词词干后，表示结果完全取决于怎么去做或怎么看待；名词后用 나름이다。</p><h2>例句</h2><div class="ex"><div lang="ko">행복은 생각하기 나름이다.</div><div class="zh">幸福取决于你怎么想。</div></div><div class="ex"><div lang="ko">성공하느냐 못 하느냐는 노력하기 나름이에요.</div><div class="zh">能否成功全看努力。</div></div><div class="ex"><div lang="ko">같은 재료라도 요리하기 나름이에요.</div><div class="zh">同样的材料，就看怎么做了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
