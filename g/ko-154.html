<h1 lang="ko">-(으)ㄹ 게 뻔하다</h1><p><b>显然会……、肯定会……</b> · 高级</p><p>表示根据情况可以明显预见某种（多为负面的）结果；对过去的推断用 -았/었을 게 뻔하다。</p><h2>例句</h2><div class="ex"><div lang="ko">지금 출발하면 늦을 게 뻔해요.</div><div class="zh">现在出发肯定会迟到。</div></div><div class="ex"><div lang="ko">그 사람한테 말하면 또 화낼 게 뻔해요.</div><div class="zh">跟他说的话，他肯定又会发火。</div></div><div class="ex"><div lang="ko">준비를 안 했으니 실수했을 게 뻔하지.</div><div class="zh">没做准备，肯定出错了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
