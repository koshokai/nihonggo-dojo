<h1 lang="ko">-(으)ㄴ/는/(으)ㄹ 듯하다</h1><p><b>似乎……、好像……</b> · 高级</p><p>较书面的推测表达，相当于 -(으)ㄴ/는 것 같다；-(으)ㄹ 듯하다 表示对将来的推测。</p><h2>例句</h2><div class="ex"><div lang="ko">그는 무언가를 숨기고 있는 듯했다.</div><div class="zh">他似乎在隐瞒什么。</div></div><div class="ex"><div lang="ko">오늘 밤에는 눈이 올 듯하다.</div><div class="zh">今晚似乎要下雪。</div></div><div class="ex"><div lang="ko">문제가 생각보다 심각한 듯합니다.</div><div class="zh">问题似乎比想象的严重。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
