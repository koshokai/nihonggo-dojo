<h1 lang="ko">-(으)ㄹ 우려가 있다</h1><p><b>有……的危险／可能</b> · 高级</p><p>书面语、新闻常用，表示担心可能发生不好的事情；也说 -(으)ㄹ 우려가 크다。</p><h2>例句</h2><div class="ex"><div lang="ko">폭우로 산사태가 발생할 우려가 있습니다.</div><div class="zh">暴雨有引发山体滑坡的危险。</div></div><div class="ex"><div lang="ko">이 정책은 부작용을 낳을 우려가 있다.</div><div class="zh">这项政策可能会带来副作用。</div></div><div class="ex"><div lang="ko">개인 정보가 유출될 우려가 있으니 주의하십시오.</div><div class="zh">有泄露个人信息的风险，请注意。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
