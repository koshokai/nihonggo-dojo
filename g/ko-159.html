<h1 lang="ko">-(으)ㄴ들</h1><p><b>即使……又能怎样</b> · 高级</p><p>书面或文学语气，表示即使前面的假设成立，后面的结果也不会改变，后句多为反问。</p><h2>例句</h2><div class="ex"><div lang="ko">지금 후회한들 무슨 소용이 있겠어요?</div><div class="zh">现在后悔又有什么用呢？</div></div><div class="ex"><div lang="ko">아무리 돈이 많은들 건강을 살 수는 없다.</div><div class="zh">钱再多也买不来健康。</div></div><div class="ex"><div lang="ko">내가 말한들 그가 듣겠니?</div><div class="zh">就算我说了，他会听吗？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
