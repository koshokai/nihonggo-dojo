<h1 lang="ko">-(으)나 마나</h1><p><b>做不做都一样；不用……也知道</b> · 高级</p><p>表示做了也没用，或结果不言自明；常见 보나 마나、물어보나 마나。</p><h2>例句</h2><div class="ex"><div lang="ko">보나 마나 또 늦잠을 잤을 거예요.</div><div class="zh">不用看也知道，肯定又睡懒觉了。</div></div><div class="ex"><div lang="ko">그 사람한테는 물어보나 마나예요.</div><div class="zh">问他也是白问。</div></div><div class="ex"><div lang="ko">약을 먹으나 마나 증상이 똑같아요.</div><div class="zh">吃不吃药，症状都一样。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
