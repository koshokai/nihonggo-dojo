<h1 lang="ko">-되</h1><p><b>……，但（条件）……</b> · 高级</p><p>书面、规章语体，在肯定前面内容的同时补充条件或相反内容；也用于引出说话内容（如 말하되）。</p><h2>例句</h2><div class="ex"><div lang="ko">자유롭게 의견을 말하되 다른 사람을 비난해서는 안 된다.</div><div class="zh">可以自由发表意见，但不得指责他人。</div></div><div class="ex"><div lang="ko">술을 마시되 적당히 마셔라.</div><div class="zh">酒可以喝，但要适量。</div></div><div class="ex"><div lang="ko">시간은 충분하되 비용이 부족하다.</div><div class="zh">时间充足，但经费不够。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
