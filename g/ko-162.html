<h1 lang="ko">-기에（原因）</h1><p><b>因为……（所以）</b> · 高级</p><p>书面或较正式的口语，表示判断或行动的理由，后句一般不用命令、共动形（区别于 -기에 망정이지）。</p><h2>例句</h2><div class="ex"><div lang="ko">날씨가 좋기에 산책을 나갔다.</div><div class="zh">因为天气好，就出去散步了。</div></div><div class="ex"><div lang="ko">친구가 추천하기에 이 책을 샀어요.</div><div class="zh">因为朋友推荐，就买了这本书。</div></div><div class="ex"><div lang="ko">무슨 일이 있기에 그렇게 급하게 가요?</div><div class="zh">有什么事那么急着走？</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
