<h1 lang="ko">-에 불과하다</h1><p><b>只不过是……、仅仅……</b> · 高级</p><p>接在名词后，强调数量少，或程度、意义不大。</p><h2>例句</h2><div class="ex"><div lang="ko">그것은 소문에 불과하다.</div><div class="zh">那只不过是传闻而已。</div></div><div class="ex"><div lang="ko">참석자는 열 명에 불과했다.</div><div class="zh">参加者仅有十人。</div></div><div class="ex"><div lang="ko">이번 실패는 하나의 과정에 불과하니 낙심하지 마세요.</div><div class="zh">这次失败不过是一个过程，别灰心。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
