<h1 lang="ko">-(으)ㄹ 나위(가) 없다</h1><p><b>无须……、无可……</b> · 高级</p><p>表示程度已达到极点，无须再做某事，常见 더할 나위 없다（再好不过）、말할 나위도 없다（不用说）。</p><h2>例句</h2><div class="ex"><div lang="ko">날씨도 좋고 음식도 맛있어서 더할 나위 없는 여행이었다.</div><div class="zh">天气好，饭菜也好吃，真是再好不过的旅行。</div></div><div class="ex"><div lang="ko">건강이 중요하다는 것은 말할 나위도 없다.</div><div class="zh">健康很重要，这自不必说。</div></div><div class="ex"><div lang="ko">그의 실력은 의심할 나위가 없다.</div><div class="zh">他的实力毋庸置疑。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
