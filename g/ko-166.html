<h1 lang="ko">-다 못해</h1><p><b>……到了极点（以至于）</b> · 高级</p><p>接在动词、形容词后，表示某种状态到了无法再忍受或无以复加的程度，于是出现后面的情况。</p><h2>例句</h2><div class="ex"><div lang="ko">기다리다 못해 먼저 집에 갔어요.</div><div class="zh">等得不耐烦，就先回家了。</div></div><div class="ex"><div lang="ko">하늘이 파랗다 못해 눈이 부시다.</div><div class="zh">天空蓝得耀眼。</div></div><div class="ex"><div lang="ko">보다 못한 이웃이 경찰에 신고했다.</div><div class="zh">看不下去的邻居报了警。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
