<h1 lang="ko">-(으)ㄹ 바에야</h1><p><b>与其……不如……</b> · 高级</p><p>表示对前面的做法不满意，宁可选择后面的做法，后句常接 차라리、-는 게 낫다。</p><h2>例句</h2><div class="ex"><div lang="ko">억지로 할 바에야 차라리 안 하는 게 낫다.</div><div class="zh">与其勉强去做，不如干脆不做。</div></div><div class="ex"><div lang="ko">비싼 돈을 주고 고칠 바에야 새로 사겠어요.</div><div class="zh">与其花大钱修，不如买个新的。</div></div><div class="ex"><div lang="ko">이렇게 후회할 바에야 처음부터 하지 말 걸 그랬어요.</div><div class="zh">早知道会这么后悔，当初就不该做。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
