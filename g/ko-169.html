<h1 lang="ko">-(으)ㅁ（名词化 · 书面）</h1><p><b>（名词形；书面结句）</b> · 高级</p><p>接在词干后构成名词形，多用于书面、公告、笔记、报告中，也可直接作结句（如「회의 장소 변경됨」）。</p><h2>例句</h2><div class="ex"><div lang="ko">그가 범인임이 밝혀졌다.</div><div class="zh">已查明他就是犯人。</div></div><div class="ex"><div lang="ko">아프고 나서야 건강의 소중함을 깨달았다.</div><div class="zh">生病后才认识到健康的珍贵。</div></div><div class="ex"><div lang="ko">내일 오전 10시까지 서류 제출 바람.</div><div class="zh">请于明天上午10点前提交材料。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
