<h1 lang="ko">-기에 앞서</h1><p><b>在……之前</b> · 高级</p><p>书面、正式场合用语，相当于 -기 전에，常用于致辞、公告、说明书。</p><h2>例句</h2><div class="ex"><div lang="ko">회의를 시작하기에 앞서 간단히 인사 말씀 드리겠습니다.</div><div class="zh">会议开始之前，我先简单致辞。</div></div><div class="ex"><div lang="ko">본론에 들어가기에 앞서 용어를 정리해 보겠습니다.</div><div class="zh">进入正题之前，先梳理一下术语。</div></div><div class="ex"><div lang="ko">제품을 사용하기에 앞서 설명서를 꼭 읽으십시오.</div><div class="zh">使用产品之前请务必阅读说明书。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
