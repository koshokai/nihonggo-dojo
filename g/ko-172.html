<h1 lang="ko">-았/었더라면</h1><p><b>如果当时……的话</b> · 高级</p><p>表示与过去事实相反的假设，后句常接 -았/었을 것이다、-았/었을 텐데。</p><h2>例句</h2><div class="ex"><div lang="ko">조금만 일찍 출발했더라면 기차를 놓치지 않았을 거예요.</div><div class="zh">要是早点出发，就不会错过火车了。</div></div><div class="ex"><div lang="ko">그때 네 말을 들었더라면 좋았을 텐데.</div><div class="zh">当时要是听了你的话就好了。</div></div><div class="ex"><div lang="ko">미리 알았더라면 도와줬을 거예요.</div><div class="zh">要是提前知道，我就帮你了。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
