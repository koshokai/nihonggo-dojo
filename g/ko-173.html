<h1 lang="ko">-는 한편</h1><p><b>……的同时；另一方面</b> · 高级</p><p>书面语，表示与前面的事并行的另一方面；也可单独用 한편(으로)。</p><h2>例句</h2><div class="ex"><div lang="ko">그는 회사에 다니는 한편 대학원에서 공부도 한다.</div><div class="zh">他一边上班，一边在研究生院读书。</div></div><div class="ex"><div lang="ko">정부는 일자리를 늘리는 한편 복지 예산도 확대하기로 했다.</div><div class="zh">政府决定在增加就业岗位的同时，扩大福利预算。</div></div><div class="ex"><div lang="ko">합격해서 기쁜 한편으로 걱정도 됐다.</div><div class="zh">考上了很高兴，同时也有些担心。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
