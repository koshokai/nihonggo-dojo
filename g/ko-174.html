<h1 lang="ko">(이)나마</h1><p><b>哪怕（只是）……也好</b> · 高级</p><p>接在名词或副词后，表示虽然不够理想，但仍可勉强接受；有收音的名词后用 이나마。</p><h2>例句</h2><div class="ex"><div lang="ko">늦게나마 축하드립니다.</div><div class="zh">虽然晚了，还是向您表示祝贺。</div></div><div class="ex"><div lang="ko">적은 돈이나마 보태 쓰세요.</div><div class="zh">钱虽然不多，请拿去用吧。</div></div><div class="ex"><div lang="ko">잠시나마 쉴 수 있어서 다행이에요.</div><div class="zh">哪怕只能休息一会儿，也很庆幸。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
