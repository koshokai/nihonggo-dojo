<h1 lang="ko">-(으)로 인해(서) / -(으)로 인한</h1><p><b>由于……、因……</b> · 高级</p><p>书面、新闻常用，接在名词后表示原因；修饰名词时用 -(으)로 인한。</p><h2>例句</h2><div class="ex"><div lang="ko">폭설로 인해 항공편이 결항되었다.</div><div class="zh">由于大雪，航班取消了。</div></div><div class="ex"><div lang="ko">교통사고로 인한 사망자가 줄고 있다.</div><div class="zh">交通事故造成的死亡人数在减少。</div></div><div class="ex"><div lang="ko">스트레스로 인해 잠을 못 자는 사람이 많다.</div><div class="zh">很多人因压力而失眠。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
