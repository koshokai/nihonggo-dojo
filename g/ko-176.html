<h1 lang="ko">-고도</h1><p><b>……了却还……</b> · 高级</p><p>接在动词词干后，表示前一动作完成后出现了与预期相反的情况；前面不加时态。</p><h2>例句</h2><div class="ex"><div lang="ko">그는 잘못을 하고도 사과하지 않았다.</div><div class="zh">他犯了错却不道歉。</div></div><div class="ex"><div lang="ko">약을 먹고도 감기가 낫지 않았다.</div><div class="zh">吃了药，感冒还是没好。</div></div><div class="ex"><div lang="ko">알고도 모르는 척했다.</div><div class="zh">明明知道却装作不知道。</div></div><a class="cta" href="../#ko/grammar">去韩语道场练习 →</a>
