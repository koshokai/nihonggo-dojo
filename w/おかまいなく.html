<h1 lang="ja">おかまいなく<span class="muted">（おかまいなく）</span></h1><p><b>请别张罗</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja">すぐ<ruby>帰<rt>かえ</rt></ruby>りますので、どうぞおかまいなく。</div><div class="zh">我马上就走，请别张罗了。</div></div><div class="ex"><div lang="ja">「お<ruby>茶<rt>ちゃ</rt></ruby>でもいかがですか。」「いえ、おかまいなく。」</div><div class="zh">“喝杯茶吧？”“不用了，请别费心。”</div></div><div class="ex"><div lang="ja"><ruby>私<rt>わたし</rt></ruby>のことはおかまいなく、<ruby>先<rt>さき</rt></ruby>に<ruby>食<rt>た</rt></ruby>べてください。</div><div class="zh">不用管我，请先吃吧。</div></div>
