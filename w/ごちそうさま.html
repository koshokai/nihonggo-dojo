<h1 lang="ja">ごちそうさま<span class="muted">（ごちそうさま）</span></h1><p><b>谢谢款待（饭后）</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja">「ごちそうさま。おいしかったです」</div><div class="zh">“谢谢款待，非常好吃。”</div></div><div class="ex"><div lang="ja"><ruby>食<rt>た</rt></ruby>べ<ruby>終<rt>お</rt></ruby>わったら、ごちそうさまと<ruby>言<rt>い</rt></ruby>いなさい。</div><div class="zh">吃完饭要说“我吃好了”。</div></div><div class="ex"><div lang="ja"><ruby>先輩<rt>せんぱい</rt></ruby>に<ruby>夕食<rt>ゆうしょく</rt></ruby>をおごってもらい、「ごちそうさまでした」とお<ruby>礼<rt>れい</rt></ruby>を<ruby>言<rt>い</rt></ruby>った。</div><div class="zh">前辈请我吃了晚饭，我道谢说“谢谢款待”。</div></div>
