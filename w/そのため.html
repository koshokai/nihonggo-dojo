<h1 lang="ja">そのため<span class="muted">（そのため）</span></h1><p><b>因此</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>昨日<rt>きのう</rt></ruby>は<ruby>大雪<rt>おおゆき</rt></ruby>だった。そのため、<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>大幅<rt>おおはば</rt></ruby>に<ruby>遅<rt>おく</rt></ruby>れた。</div><div class="zh">昨天下了大雪，因此电车严重晚点。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>日本<rt>にほん</rt></ruby>で<ruby>働<rt>はたら</rt></ruby>きたいと<ruby>考<rt>かんが</rt></ruby>えている。そのため、<ruby>毎日<rt>まいにち</rt></ruby><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>している。</div><div class="zh">他想在日本工作，为此每天都在学日语。</div></div><div class="ex"><div lang="ja"><ruby>道路<rt>どうろ</rt></ruby><ruby>工事<rt>こうじ</rt></ruby>が<ruby>行<rt>おこな</rt></ruby>われている。そのため、この<ruby>道<rt>みち</rt></ruby>は<ruby>通行<rt>つうこう</rt></ruby><ruby>止<rt>と</rt></ruby>めだ。</div><div class="zh">正在进行道路施工，因此这条路禁止通行。</div></div>
