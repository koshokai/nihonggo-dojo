<h2>例句</h2><div class="ex"><div lang="ja"><ruby>口<rt>くち</rt></ruby>の<ruby>中<rt>なか</rt></ruby>でとろけるようなチーズケーキだ。</div><div class="zh">这是一款入口即化的芝士蛋糕。</div></div><div class="ex"><div lang="ja"><ruby>暑<rt>あつ</rt></ruby>さでチョコレートがとろけてしまった。</div><div class="zh">巧克力因为太热融化了。</div></div><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>の<ruby>笑顔<rt>えがお</rt></ruby>に、<ruby>彼<rt>かれ</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>はとろけそうになった。</div><div class="zh">她的笑容让他的心都快融化了。</div></div>
