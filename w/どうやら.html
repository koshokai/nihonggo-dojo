<h2>例句</h2><div class="ex"><div lang="ja">どうやら<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>になりそうだ。</div><div class="zh">看样子明天要下雨。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>はどうやら<ruby>道<rt>みち</rt></ruby>に<ruby>迷<rt>まよ</rt></ruby>ったらしい。</div><div class="zh">他好像迷路了。</div></div><div class="ex"><div lang="ja"><ruby>徹夜<rt>てつや</rt></ruby>して、どうやら<ruby>報告<rt>ほうこく</rt></ruby><ruby>書<rt>しょ</rt></ruby>を<ruby>仕上<rt>しあ</rt></ruby>げた。</div><div class="zh">熬了一通宵，总算把报告写完了。</div></div>
