<h1 lang="ja">まして<span class="muted">（まして）</span></h1><p><b>何况</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>大人<rt>おとな</rt></ruby>でも<ruby>難<rt>むずか</rt></ruby>しい<ruby>問題<rt>もんだい</rt></ruby>だ。まして<ruby>子<rt>こ</rt></ruby>どもに<ruby>解<rt>と</rt></ruby>けるはずがない。</div><div class="zh">这道题连大人都觉得难，更何况孩子，不可能解得出来。</div></div><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>の<ruby>会話<rt>かいわ</rt></ruby>もできないのに、まして<ruby>通訳<rt>つうやく</rt></ruby>なんて<ruby>無理<rt>むり</rt></ruby>だ。</div><div class="zh">连日语会话都不会，更别说当翻译了。</div></div><div class="ex"><div lang="ja"><ruby>先輩<rt>せんぱい</rt></ruby>でさえ<ruby>失敗<rt>しっぱい</rt></ruby>したのだから、まして<ruby>新人<rt>しんじん</rt></ruby>の<ruby>私<rt>わたし</rt></ruby>には<ruby>無理<rt>むり</rt></ruby>だろう。</div><div class="zh">连前辈都失败了，我这个新人就更不行了。</div></div>
