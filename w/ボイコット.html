<h1 lang="ja">ボイコット<span class="muted">（ボイコット）</span></h1><p><b>抵制</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>選手<rt>せんしゅ</rt></ruby>たちは<ruby>待遇<rt>たいぐう</rt></ruby><ruby>改善<rt>かいぜん</rt></ruby>を<ruby>求<rt>もと</rt></ruby>めて<ruby>試合<rt>しあい</rt></ruby>をボイコットした。</div><div class="zh">选手们为要求改善待遇而抵制了比赛。</div></div><div class="ex"><div lang="ja"><ruby>消費<rt>しょうひ</rt></ruby><ruby>者<rt>しゃ</rt></ruby>がその<ruby>企業<rt>きぎょう</rt></ruby>の<ruby>製品<rt>せいひん</rt></ruby>をボイコットする<ruby>動<rt>うご</rt></ruby>きが<ruby>広<rt>ひろ</rt></ruby>がった。</div><div class="zh">消费者抵制该企业产品的行动不断扩大。</div></div><div class="ex"><div lang="ja"><ruby>数<rt>すう</rt></ruby>か<ruby>国<rt>こく</rt></ruby>が<ruby>政治<rt>せいじ</rt></ruby><ruby>的<rt>てき</rt></ruby><ruby>理由<rt>りゆう</rt></ruby>で<ruby>国際<rt>こくさい</rt></ruby><ruby>会議<rt>かいぎ</rt></ruby>をボイコットした。</div><div class="zh">几个国家出于政治原因抵制了国际会议。</div></div>
