<h1 lang="ja">一方<span class="muted">（いっぽう）</span></h1><p><b>一方面；另一方面</b> · JLPT N3</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>兄<rt>あに</rt></ruby>はスポーツが<ruby>得意<rt>とくい</rt></ruby>だ。<ruby>一方<rt>いっぽう</rt></ruby>、<ruby>弟<rt>おとうと</rt></ruby>は<ruby>勉強<rt>べんきょう</rt></ruby>が<ruby>得意<rt>とくい</rt></ruby>だ。</div><div class="zh">哥哥擅长运动，而弟弟擅长学习。</div></div><div class="ex"><div lang="ja"><ruby>物価<rt>ぶっか</rt></ruby>は<ruby>上<rt>あ</rt></ruby>がる<ruby>一方<rt>いっぽう</rt></ruby>だ。</div><div class="zh">物价一个劲儿地上涨。</div></div><div class="ex"><div lang="ja"><ruby>一方<rt>いっぽう</rt></ruby>の<ruby>意見<rt>いけん</rt></ruby>だけを<ruby>聞<rt>き</rt></ruby>いて<ruby>決<rt>き</rt></ruby>めてはいけない。</div><div class="zh">不能只听一方的意见就做决定。</div></div>
