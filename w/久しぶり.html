<h2>例句</h2><div class="ex"><div lang="ja"><ruby>久<rt>ひさ</rt></ruby>しぶりですね。お<ruby>元気<rt>げんき</rt></ruby>ですか。</div><div class="zh">好久不见，你好吗？</div></div><div class="ex"><div lang="ja"><ruby>久<rt>ひさ</rt></ruby>しぶりに<ruby>国<rt>くに</rt></ruby>の<ruby>家族<rt>かぞく</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>しました。</div><div class="zh">隔了好久我给国内的家人打了电话。</div></div><div class="ex"><div lang="ja"><ruby>今日<rt>きょう</rt></ruby>は<ruby>久<rt>ひさ</rt></ruby>しぶりにいい<ruby>天気<rt>てんき</rt></ruby>です。</div><div class="zh">今天是好久没有过的好天气。</div></div>
