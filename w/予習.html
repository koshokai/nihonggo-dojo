<h2>例句</h2><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>の<ruby>授業<rt>じゅぎょう</rt></ruby>の<ruby>予習<rt>よしゅう</rt></ruby>をしました。</div><div class="zh">我预习了明天的课。</div></div><div class="ex"><div lang="ja"><ruby>予習<rt>よしゅう</rt></ruby>をしておくと、<ruby>授業<rt>じゅぎょう</rt></ruby>がよくわかります。</div><div class="zh">提前预习的话，上课就容易懂。</div></div><div class="ex"><div lang="ja"><ruby>毎晩三十分予習<rt>まいばんさんじゅっぷんよしゅう</rt></ruby>しています。</div><div class="zh">我每天晚上预习三十分钟。</div></div>
