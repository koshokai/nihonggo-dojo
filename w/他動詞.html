<h1 lang="ja">他動詞<span class="muted">（たどうし）</span></h1><p><b>他动词</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja">「<ruby>開<rt>あ</rt></ruby>ける」は<ruby>他動<rt>たどう</rt></ruby><ruby>詞<rt>し</rt></ruby>で、「<ruby>開<rt>ひら</rt></ruby>く」は<ruby>自動<rt>じどう</rt></ruby><ruby>詞<rt>し</rt></ruby>だ。</div><div class="zh">&quot;開ける&quot;是他动词，&quot;開く&quot;是自动词。</div></div><div class="ex"><div lang="ja"><ruby>他動<rt>たどう</rt></ruby><ruby>詞<rt>し</rt></ruby>は<ruby>普通<rt>ふつう</rt></ruby>、<ruby>目的<rt>もくてき</rt></ruby><ruby>語<rt>ご</rt></ruby>をとる。</div><div class="zh">他动词一般带宾语。</div></div><div class="ex"><div lang="ja"><ruby>自動<rt>じどう</rt></ruby><ruby>詞<rt>し</rt></ruby>と<ruby>他動<rt>たどう</rt></ruby><ruby>詞<rt>し</rt></ruby>の<ruby>区別<rt>くべつ</rt></ruby>は<ruby>学習<rt>がくしゅう</rt></ruby><ruby>者<rt>しゃ</rt></ruby>にとって<ruby>難<rt>むずか</rt></ruby>しい。</div><div class="zh">自动词和他动词的区别对学习者来说很难。</div></div>
