<h1 lang="ja">他方<span class="muted">（たほう）</span></h1><p><b>另一方面</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>仕事<rt>しごと</rt></ruby>に<ruby>厳<rt>きび</rt></ruby>しい。<ruby>他方<rt>たほう</rt></ruby>、<ruby>家庭<rt>かてい</rt></ruby>ではとても<ruby>優<rt>やさ</rt></ruby>しい。</div><div class="zh">他对工作很严格；另一方面，在家里却非常温柔。</div></div><div class="ex"><div lang="ja"><ruby>一方<rt>いっぽう</rt></ruby>の<ruby>意見<rt>いけん</rt></ruby>だけでなく、<ruby>他方<rt>たほう</rt></ruby>の<ruby>言<rt>い</rt></ruby>い<ruby>分<rt>ぶん</rt></ruby>も<ruby>聞<rt>き</rt></ruby>くべきだ。</div><div class="zh">不能只听一方的意见，也应该听听另一方的说法。</div></div><div class="ex"><div lang="ja"><ruby>輸出<rt>ゆしゅつ</rt></ruby>は<ruby>増<rt>ふ</rt></ruby>えたが、<ruby>他方<rt>たほう</rt></ruby>で<ruby>輸入<rt>ゆにゅう</rt></ruby>も<ruby>急増<rt>きゅうぞう</rt></ruby>している。</div><div class="zh">出口增加了，但另一方面进口也在急剧增加。</div></div>
