<h2>例句</h2><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>は<ruby>漢字<rt>かんじ</rt></ruby>と<ruby>仮名<rt>かな</rt></ruby>を<ruby>組<rt>く</rt></ruby>み<ruby>合<rt>あ</rt></ruby>わせて<ruby>書<rt>か</rt></ruby>く。</div><div class="zh">日语是用汉字和假名组合书写的。</div></div><div class="ex"><div lang="ja"><ruby>読<rt>よ</rt></ruby>めない<ruby>漢字<rt>かんじ</rt></ruby>に<ruby>仮名<rt>かな</rt></ruby>をふった。</div><div class="zh">给不会读的汉字注上了假名。</div></div><div class="ex"><div lang="ja"><ruby>子<rt>こ</rt></ruby>どもはまず<ruby>仮名<rt>かな</rt></ruby>から<ruby>覚<rt>おぼ</rt></ruby>える。</div><div class="zh">孩子先从假名学起。</div></div>
