<h1 lang="ja">仮名遣い<span class="muted">（かなづかい）</span></h1><p><b>假名用法</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>古文<rt>こぶん</rt></ruby>は<ruby>現代<rt>げんだい</rt></ruby>とは<ruby>仮名遣<rt>かなづか</rt></ruby>いが<ruby>違<rt>ちが</rt></ruby>う。</div><div class="zh">古文的假名用法与现代不同。</div></div><div class="ex"><div lang="ja"><ruby>作文<rt>さくぶん</rt></ruby>の<ruby>仮名遣<rt>かなづか</rt></ruby>いの<ruby>間違<rt>まちが</rt></ruby>いを<ruby>直<rt>なお</rt></ruby>された。</div><div class="zh">作文中假名用法的错误被订正了。</div></div><div class="ex"><div lang="ja">「こんにちは」の「は」は<ruby>歴史<rt>れきし</rt></ruby><ruby>的<rt>てき</rt></ruby>な<ruby>仮名遣<rt>かなづか</rt></ruby>いの<ruby>名残<rt>なごり</rt></ruby>だ。</div><div class="zh">“こんにちは”中的“は”是历史假名用法的遗留。</div></div>
