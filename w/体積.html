<h2>例句</h2><div class="ex"><div lang="ja">この<ruby>箱<rt>はこ</rt></ruby>の<ruby>体積<rt>たいせき</rt></ruby>を<ruby>計算<rt>けいさん</rt></ruby>してください。</div><div class="zh">请计算这个箱子的体积。</div></div><div class="ex"><div lang="ja"><ruby>水<rt>みず</rt></ruby>は<ruby>凍<rt>こお</rt></ruby>ると<ruby>体積<rt>たいせき</rt></ruby>が<ruby>増<rt>ふ</rt></ruby>える。</div><div class="zh">水结冰后体积会增大。</div></div><div class="ex"><div lang="ja"><ruby>物体<rt>ぶったい</rt></ruby>の<ruby>体積<rt>たいせき</rt></ruby>は、<ruby>水<rt>みず</rt></ruby>に<ruby>沈<rt>しず</rt></ruby>めて<ruby>測<rt>はか</rt></ruby>ることもできる。</div><div class="zh">物体的体积也可以通过沉入水中来测量。</div></div>
