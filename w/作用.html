<h2>例句</h2><div class="ex"><div lang="ja">この<ruby>薬<rt>くすり</rt></ruby>には<ruby>眠<rt>ねむ</rt></ruby>くなる<ruby>作用<rt>さよう</rt></ruby>がある。</div><div class="zh">这种药有让人犯困的作用。</div></div><div class="ex"><div lang="ja"><ruby>二<rt>ふた</rt></ruby>つの<ruby>物質<rt>ぶっしつ</rt></ruby>が<ruby>互<rt>たが</rt></ruby>いに<ruby>作用<rt>さよう</rt></ruby>して<ruby>熱<rt>ねつ</rt></ruby>が<ruby>発生<rt>はっせい</rt></ruby>する。</div><div class="zh">两种物质相互作用产生热量。</div></div><div class="ex"><div lang="ja"><ruby>副<rt>ふく</rt></ruby><ruby>作用<rt>さよう</rt></ruby>が<ruby>心配<rt>しんぱい</rt></ruby>で<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みたくない。</div><div class="zh">担心副作用，不想吃药。</div></div>
