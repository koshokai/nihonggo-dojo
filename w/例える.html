<h1 lang="ja">例える<span class="muted">（たとえる）</span></h1><p><b>比喻</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>人生<rt>じんせい</rt></ruby>はよく<ruby>旅<rt>たび</rt></ruby>に<ruby>例<rt>たと</rt></ruby>えられる。</div><div class="zh">人生常被比作旅行。</div></div><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>の<ruby>笑顔<rt>えがお</rt></ruby>は、<ruby>例<rt>たと</rt></ruby>えるなら<ruby>春<rt>はる</rt></ruby>の<ruby>太陽<rt>たいよう</rt></ruby>のようだ。</div><div class="zh">她的笑容，打个比方，就像春天的太阳。</div></div><div class="ex"><div lang="ja"><ruby>難<rt>むずか</rt></ruby>しい<ruby>内容<rt>ないよう</rt></ruby>も、<ruby>身近<rt>みぢか</rt></ruby>なものに<ruby>例<rt>たと</rt></ruby>えて<ruby>説明<rt>せつめい</rt></ruby>すると<ruby>分<rt>わ</rt></ruby>かりやすい。</div><div class="zh">难懂的内容，用身边的事物打比方来说明就容易理解了。</div></div>
