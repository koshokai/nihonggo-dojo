<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>はその<ruby>事件<rt>じけん</rt></ruby>に<ruby>係<rt>かか</rt></ruby>わっていたらしい。</div><div class="zh">他好像和那个案件有牵连。</div></div><div class="ex"><div lang="ja"><ruby>人<rt>ひと</rt></ruby>の<ruby>命<rt>いのち</rt></ruby>に<ruby>係<rt>かか</rt></ruby>わる<ruby>仕事<rt>しごと</rt></ruby>なので、<ruby>責任<rt>せきにん</rt></ruby>は<ruby>重<rt>おも</rt></ruby>い。</div><div class="zh">这是关乎人命的工作，责任重大。</div></div><div class="ex"><div lang="ja"><ruby>面倒<rt>めんどう</rt></ruby>なことには<ruby>係<rt>かか</rt></ruby>わりたくない。</div><div class="zh">不想牵扯进麻烦事。</div></div>
