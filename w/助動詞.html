<h1 lang="ja">助動詞<span class="muted">（じょどうし）</span></h1><p><b>助动词</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja">「られる」は<ruby>受<rt>う</rt></ruby>け<ruby>身<rt>み</rt></ruby>を<ruby>表<rt>あらわ</rt></ruby>す<ruby>助<rt>じょ</rt></ruby><ruby>動詞<rt>どうし</rt></ruby>だ。</div><div class="zh">“られる”是表示被动的助动词。</div></div><div class="ex"><div lang="ja"><ruby>古文<rt>こぶん</rt></ruby>では<ruby>助<rt>じょ</rt></ruby><ruby>動詞<rt>どうし</rt></ruby>の<ruby>意味<rt>いみ</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えることが<ruby>重要<rt>じゅうよう</rt></ruby>だ。</div><div class="zh">学习古文时，记住助动词的意义很重要。</div></div><div class="ex"><div lang="ja"><ruby>英語<rt>えいご</rt></ruby>の「can」は<ruby>助<rt>じょ</rt></ruby><ruby>動詞<rt>どうし</rt></ruby>に<ruby>分類<rt>ぶんるい</rt></ruby>される。</div><div class="zh">英语的“can”被归类为助动词。</div></div>
