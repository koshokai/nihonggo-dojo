<h1 lang="ja">励ます<span class="muted">（はげます）</span></h1><p><b>鼓励</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>落<rt>お</rt></ruby>ち<ruby>込<rt>こ</rt></ruby>んでいる<ruby>友人<rt>ゆうじん</rt></ruby>を<ruby>励<rt>はげ</rt></ruby>ました。</div><div class="zh">我鼓励了情绪低落的朋友。</div></div><div class="ex"><div lang="ja"><ruby>監督<rt>かんとく</rt></ruby>は<ruby>声<rt>こえ</rt></ruby>を<ruby>励<rt>はげ</rt></ruby>まして<ruby>選手<rt>せんしゅ</rt></ruby>たちに<ruby>指示<rt>しじ</rt></ruby>を<ruby>出<rt>だ</rt></ruby>した。</div><div class="zh">教练提高嗓门向选手们下达指示。</div></div><div class="ex"><div lang="ja"><ruby>母<rt>はは</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>に<ruby>励<rt>はげ</rt></ruby>まされて、もう<ruby>一<rt>いち</rt></ruby><ruby>度<rt>ど</rt></ruby><ruby>挑戦<rt>ちょうせん</rt></ruby>する<ruby>決心<rt>けっしん</rt></ruby>がついた。</div><div class="zh">在母亲的话语鼓舞下，我下定决心再挑战一次。</div></div>
