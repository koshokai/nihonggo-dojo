<h1 lang="ja">単数<span class="muted">（たんすう）</span></h1><p><b>单数</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>英語<rt>えいご</rt></ruby>では、<ruby>主語<rt>しゅご</rt></ruby>が<ruby>単数<rt>たんすう</rt></ruby>か<ruby>複数<rt>ふくすう</rt></ruby>かで<ruby>動詞<rt>どうし</rt></ruby>の<ruby>形<rt>かたち</rt></ruby>が<ruby>変<rt>か</rt></ruby>わる。</div><div class="zh">在英语中，动词形式随主语是单数还是复数而变化。</div></div><div class="ex"><div lang="ja">この<ruby>名詞<rt>めいし</rt></ruby>は<ruby>単数<rt>たんすう</rt></ruby><ruby>形<rt>けい</rt></ruby>と<ruby>複数<rt>ふくすう</rt></ruby><ruby>形<rt>けい</rt></ruby>が<ruby>同<rt>おな</rt></ruby>じだ。</div><div class="zh">这个名词的单数形式和复数形式相同。</div></div><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>の<ruby>名詞<rt>めいし</rt></ruby>には<ruby>単数<rt>たんすう</rt></ruby>と<ruby>複数<rt>ふくすう</rt></ruby>の<ruby>区別<rt>くべつ</rt></ruby>があまりない。</div><div class="zh">日语名词基本没有单数和复数的区别。</div></div>
