<h2>例句</h2><div class="ex"><div lang="ja"><ruby>国民<rt>こくみん</rt></ruby>の<ruby>意見<rt>いけん</rt></ruby>を<ruby>政治<rt>せいじ</rt></ruby>に<ruby>反映<rt>はんえい</rt></ruby>させるべきだ。</div><div class="zh">应该让国民的意见反映到政治中。</div></div><div class="ex"><div lang="ja">この<ruby>小説<rt>しょうせつ</rt></ruby>は<ruby>当時<rt>とうじ</rt></ruby>の<ruby>社会<rt>しゃかい</rt></ruby>を<ruby>反映<rt>はんえい</rt></ruby>している。</div><div class="zh">这部小说反映了当时的社会。</div></div><div class="ex"><div lang="ja"><ruby>変更<rt>へんこう</rt></ruby><ruby>内容<rt>ないよう</rt></ruby>はまだシステムに<ruby>反映<rt>はんえい</rt></ruby>されていない。</div><div class="zh">修改内容还没有反映到系统中。</div></div>
