<h1 lang="ja">句読点<span class="muted">（くとうてん）</span></h1><p><b>标点符号</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>作文<rt>さくぶん</rt></ruby>では<ruby>句読点<rt>くとうてん</rt></ruby>を<ruby>正<rt>ただ</rt></ruby>しく<ruby>使<rt>つか</rt></ruby>いましょう。</div><div class="zh">写作文时要正确使用标点符号。</div></div><div class="ex"><div lang="ja"><ruby>句読点<rt>くとうてん</rt></ruby>の<ruby>位置<rt>いち</rt></ruby>で<ruby>文<rt>ぶん</rt></ruby>の<ruby>意味<rt>いみ</rt></ruby>が<ruby>変<rt>か</rt></ruby>わる。</div><div class="zh">标点位置不同，句子的意思就会变。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>のメールには<ruby>句読点<rt>くとうてん</rt></ruby>がほとんどない。</div><div class="zh">他的邮件里几乎没有标点符号。</div></div>
