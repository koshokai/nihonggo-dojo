<h2>例句</h2><div class="ex"><div lang="ja"><ruby>両国<rt>りょうこく</rt></ruby>は<ruby>貿易<rt>ぼうえき</rt></ruby><ruby>問題<rt>もんだい</rt></ruby>で<ruby>合意<rt>ごうい</rt></ruby>に<ruby>達<rt>たっ</rt></ruby>した。</div><div class="zh">两国在贸易问题上达成了协议。</div></div><div class="ex"><div lang="ja"><ruby>双方<rt>そうほう</rt></ruby>の<ruby>合意<rt>ごうい</rt></ruby>なしに<ruby>契約<rt>けいやく</rt></ruby><ruby>内容<rt>ないよう</rt></ruby>を<ruby>変更<rt>へんこう</rt></ruby>することはできない。</div><div class="zh">未经双方同意，不能变更合同内容。</div></div><div class="ex"><div lang="ja"><ruby>労使<rt>ろうし</rt></ruby><ruby>交渉<rt>こうしょう</rt></ruby>は<ruby>合意<rt>ごうい</rt></ruby>に<ruby>至<rt>いた</rt></ruby>らないまま<ruby>終<rt>お</rt></ruby>わった。</div><div class="zh">劳资谈判没有达成一致就结束了。</div></div>
