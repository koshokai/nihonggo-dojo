<h1 lang="ja">名簿<span class="muted">（めいぼ）</span></h1><p><b>名册</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>卒業<rt>そつぎょう</rt></ruby><ruby>生<rt>せい</rt></ruby>の<ruby>名簿<rt>めいぼ</rt></ruby>を<ruby>作成<rt>さくせい</rt></ruby>した。</div><div class="zh">编制了毕业生名册。</div></div><div class="ex"><div lang="ja"><ruby>参加<rt>さんか</rt></ruby><ruby>者<rt>しゃ</rt></ruby><ruby>名簿<rt>めいぼ</rt></ruby>に<ruby>名前<rt>なまえ</rt></ruby>が<ruby>載<rt>の</rt></ruby>っていなかった。</div><div class="zh">参加者名单上没有我的名字。</div></div><div class="ex"><div lang="ja"><ruby>個人<rt>こじん</rt></ruby><ruby>情報<rt>じょうほう</rt></ruby><ruby>保護<rt>ほご</rt></ruby>のため、<ruby>名簿<rt>めいぼ</rt></ruby>の<ruby>管理<rt>かんり</rt></ruby>には<ruby>注意<rt>ちゅうい</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>だ。</div><div class="zh">为了保护个人信息，名册的管理需要注意。</div></div>
