<h1 lang="ja">否めない<span class="muted">（いなめない）</span></h1><p><b>不可否认</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>準備<rt>じゅんび</rt></ruby><ruby>不足<rt>ふそく</rt></ruby>だったことは<ruby>否<rt>いな</rt></ruby>めません。</div><div class="zh">不可否认准备不足。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>の<ruby>責任<rt>せきにん</rt></ruby>であることは<ruby>否<rt>いな</rt></ruby>めない。</div><div class="zh">不可否认这是他的责任。</div></div><div class="ex"><div lang="ja"><ruby>少<rt>すこ</rt></ruby>し<ruby>高<rt>たか</rt></ruby>いという<ruby>印象<rt>いんしょう</rt></ruby>は<ruby>否<rt>いな</rt></ruby>めません。</div><div class="zh">难免让人觉得有点贵。</div></div>
