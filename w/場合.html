<h2>例句</h2><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>の<ruby>場合<rt>ばあい</rt></ruby>は、<ruby>試合<rt>しあい</rt></ruby>は<ruby>中止<rt>ちゅうし</rt></ruby>です。</div><div class="zh">下雨的情况下，比赛取消。</div></div><div class="ex"><div lang="ja"><ruby>遅<rt>おく</rt></ruby>れる<ruby>場合<rt>ばあい</rt></ruby>は、<ruby>電話<rt>でんわ</rt></ruby>してください。</div><div class="zh">如果要迟到，请打电话。</div></div><div class="ex"><div lang="ja"><ruby>火事<rt>かじ</rt></ruby>の<ruby>場合<rt>ばあい</rt></ruby>は、エレベーターを<ruby>使<rt>つか</rt></ruby>わないでください。</div><div class="zh">发生火灾时请不要使用电梯。</div></div>
