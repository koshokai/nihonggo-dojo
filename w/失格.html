<h1 lang="ja">失格<span class="muted">（しっかく）</span></h1><p><b>失去资格</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja">フライングで<ruby>彼<rt>かれ</rt></ruby>は<ruby>失格<rt>しっかく</rt></ruby>となった。</div><div class="zh">他因抢跑被取消了资格。</div></div><div class="ex"><div lang="ja"><ruby>約束<rt>やくそく</rt></ruby>も<ruby>守<rt>まも</rt></ruby>れないなんて、<ruby>社会<rt>しゃかい</rt></ruby><ruby>人<rt>にん</rt></ruby>として<ruby>失格<rt>しっかく</rt></ruby>だ。</div><div class="zh">连约定都不遵守，作为社会人是不合格的。</div></div><div class="ex"><div lang="ja"><ruby>体重<rt>たいじゅう</rt></ruby>オーバーで<ruby>試合<rt>しあい</rt></ruby>に<ruby>出場<rt>しゅつじょう</rt></ruby>する<ruby>前<rt>まえ</rt></ruby>に<ruby>失格<rt>しっかく</rt></ruby>した。</div><div class="zh">因体重超标，在比赛前就被取消了资格。</div></div>
