<h1 lang="ja">好況<span class="muted">（こうきょう）</span></h1><p><b>繁荣</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>好況<rt>こうきょう</rt></ruby>が<ruby>続<rt>つづ</rt></ruby>き、<ruby>企業<rt>きぎょう</rt></ruby>の<ruby>業績<rt>ぎょうせき</rt></ruby>は<ruby>軒並<rt>のきな</rt></ruby>み<ruby>向上<rt>こうじょう</rt></ruby>した。</div><div class="zh">经济持续繁荣，企业业绩普遍提升。</div></div><div class="ex"><div lang="ja"><ruby>好況<rt>こうきょう</rt></ruby>の<ruby>波<rt>なみ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>って、<ruby>事業<rt>じぎょう</rt></ruby>を<ruby>拡大<rt>かくだい</rt></ruby>した。</div><div class="zh">乘着经济繁荣的浪潮扩大了业务。</div></div><div class="ex"><div lang="ja"><ruby>好況<rt>こうきょう</rt></ruby>のときこそ<ruby>不況<rt>ふきょう</rt></ruby>に<ruby>備<rt>そな</rt></ruby>えておくべきだ。</div><div class="zh">正是经济繁荣的时候，更应该为萧条做好准备。</div></div>
