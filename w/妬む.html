<h1 lang="ja">妬む<span class="muted">（ねたむ）</span></h1><p><b>嫉妒</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>人<rt>ひと</rt></ruby>の<ruby>成功<rt>せいこう</rt></ruby>を<ruby>妬<rt>ねた</rt></ruby>むのはみっともない。</div><div class="zh">嫉妒别人的成功很不体面。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>同期<rt>どうき</rt></ruby>の<ruby>昇進<rt>しょうしん</rt></ruby>を<ruby>妬<rt>ねた</rt></ruby>んでいる。</div><div class="zh">他嫉妒同期同事的晋升。</div></div><div class="ex"><div lang="ja"><ruby>才能<rt>さいのう</rt></ruby>ある<ruby>人<rt>ひと</rt></ruby>ほど<ruby>周囲<rt>しゅうい</rt></ruby>から<ruby>妬<rt>ねた</rt></ruby>まれやすい。</div><div class="zh">越是有才华的人，越容易遭到周围人的嫉妒。</div></div>
