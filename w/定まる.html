<h1 lang="ja">定まる<span class="muted">（さだまる）</span></h1><p><b>确定</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja">ようやく<ruby>方針<rt>ほうしん</rt></ruby>が<ruby>定<rt>さだ</rt></ruby>まった。</div><div class="zh">方针终于确定下来了。</div></div><div class="ex"><div lang="ja"><ruby>天候<rt>てんこう</rt></ruby>が<ruby>定<rt>さだ</rt></ruby>まらず、<ruby>出発<rt>しゅっぱつ</rt></ruby>を<ruby>延期<rt>えんき</rt></ruby>した。</div><div class="zh">天气不稳定，推迟了出发。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>はまだ<ruby>将来<rt>しょうらい</rt></ruby>の<ruby>目標<rt>もくひょう</rt></ruby>が<ruby>定<rt>さだ</rt></ruby>まっていない。</div><div class="zh">他还没有确定将来的目标。</div></div>
