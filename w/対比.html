<h1 lang="ja">対比<span class="muted">（たいひ）</span></h1><p><b>对比</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>新旧<rt>しんきゅう</rt></ruby>の<ruby>制度<rt>せいど</rt></ruby>を<ruby>対比<rt>たいひ</rt></ruby>して<ruby>説明<rt>せつめい</rt></ruby>する。</div><div class="zh">对比新旧制度进行说明。</div></div><div class="ex"><div lang="ja"><ruby>白<rt>しろ</rt></ruby>と<ruby>黒<rt>くろ</rt></ruby>の<ruby>対比<rt>たいひ</rt></ruby>が<ruby>美<rt>うつく</rt></ruby>しい<ruby>作品<rt>さくひん</rt></ruby>だ。</div><div class="zh">这是一部黑白对比鲜明、很美的作品。</div></div><div class="ex"><div lang="ja"><ruby>昨<rt>さく</rt></ruby><ruby>年度<rt>ねんど</rt></ruby>との<ruby>対比<rt>たいひ</rt></ruby>で<ruby>売上<rt>うりあげ</rt></ruby>が<ruby>二<rt>に</rt></ruby><ruby>割<rt>わり</rt></ruby><ruby>増<rt>ふ</rt></ruby>えた。</div><div class="zh">与上一年度相比，销售额增加了两成。</div></div>
