<h1 lang="ja">弁論<span class="muted">（べんろん）</span></h1><p><b>辩论</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>高校<rt>こうこう</rt></ruby><ruby>時代<rt>じだい</rt></ruby>、<ruby>弁論<rt>べんろん</rt></ruby><ruby>大会<rt>たいかい</rt></ruby>で<ruby>優勝<rt>ゆうしょう</rt></ruby>したことがある。</div><div class="zh">他高中时曾在辩论大赛中获得冠军。</div></div><div class="ex"><div lang="ja"><ruby>裁判<rt>さいばん</rt></ruby>の<ruby>最終<rt>さいしゅう</rt></ruby><ruby>弁論<rt>べんろん</rt></ruby>で、<ruby>弁護<rt>べんご</rt></ruby><ruby>士<rt>し</rt></ruby>は<ruby>被告<rt>ひこく</rt></ruby>の<ruby>無罪<rt>むざい</rt></ruby>を<ruby>強<rt>つよ</rt></ruby>く<ruby>訴<rt>うった</rt></ruby>えた。</div><div class="zh">在审判的最终辩论中，律师强烈主张被告无罪。</div></div><div class="ex"><div lang="ja"><ruby>巧<rt>たく</rt></ruby>みな<ruby>弁論<rt>べんろん</rt></ruby>で<ruby>聴衆<rt>ちょうしゅう</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>きつけるのは<ruby>簡単<rt>かんたん</rt></ruby>ではない。</div><div class="zh">用巧妙的辩论吸引听众并非易事。</div></div>
