<h1 lang="ja">当てはめる<span class="muted">（あてはめる）</span></h1><p><b>套用，适用</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>公式<rt>こうしき</rt></ruby>に<ruby>数字<rt>すうじ</rt></ruby>を<ruby>当<rt>あ</rt></ruby>てはめて<ruby>計算<rt>けいさん</rt></ruby>した。</div><div class="zh">我把数字代入公式进行了计算。</div></div><div class="ex"><div lang="ja"><ruby>自分<rt>じぶん</rt></ruby>の<ruby>経験<rt>けいけん</rt></ruby>を<ruby>他人<rt>たにん</rt></ruby>に<ruby>当<rt>あ</rt></ruby>てはめるのはよくない。</div><div class="zh">把自己的经验套用到别人身上是不好的。</div></div><div class="ex"><div lang="ja"><ruby>古<rt>ふる</rt></ruby>い<ruby>規則<rt>きそく</rt></ruby>を<ruby>今<rt>いま</rt></ruby>の<ruby>時代<rt>じだい</rt></ruby>に<ruby>当<rt>あ</rt></ruby>てはめるのは<ruby>難<rt>むずか</rt></ruby>しい。</div><div class="zh">把旧规则套用到当今时代很难。</div></div>
