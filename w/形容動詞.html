<h1 lang="ja">形容動詞<span class="muted">（けいようどうし）</span></h1><p><b>形容动词</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja">「<ruby>静<rt>しず</rt></ruby>かだ」は<ruby>形容<rt>けいよう</rt></ruby><ruby>動詞<rt>どうし</rt></ruby>に<ruby>分類<rt>ぶんるい</rt></ruby>される。</div><div class="zh">“静かだ”被归类为形容动词。</div></div><div class="ex"><div lang="ja"><ruby>形容<rt>けいよう</rt></ruby><ruby>動詞<rt>どうし</rt></ruby>は<ruby>名詞<rt>めいし</rt></ruby>を<ruby>修飾<rt>しゅうしょく</rt></ruby>するとき「な」をつける。</div><div class="zh">形容动词修饰名词时要加“な”。</div></div><div class="ex"><div lang="ja"><ruby>形容<rt>けいよう</rt></ruby><ruby>詞<rt>し</rt></ruby>と<ruby>形容<rt>けいよう</rt></ruby><ruby>動詞<rt>どうし</rt></ruby>の<ruby>違<rt>ちが</rt></ruby>いを<ruby>説明<rt>せつめい</rt></ruby>した。</div><div class="zh">说明了形容词和形容动词的区别。</div></div>
