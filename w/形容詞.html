<h1 lang="ja">形容詞<span class="muted">（けいようし）</span></h1><p><b>形容词</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja">「<ruby>高<rt>たか</rt></ruby>い」や「<ruby>美<rt>うつく</rt></ruby>しい」は<ruby>形容<rt>けいよう</rt></ruby><ruby>詞<rt>し</rt></ruby>だ。</div><div class="zh">“高い”和“美しい”是形容词。</div></div><div class="ex"><div lang="ja"><ruby>形容<rt>けいよう</rt></ruby><ruby>詞<rt>し</rt></ruby>の<ruby>活用<rt>かつよう</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えるのが<ruby>大変<rt>たいへん</rt></ruby>だ。</div><div class="zh">记形容词的词尾变化很费劲。</div></div><div class="ex"><div lang="ja">この<ruby>文<rt>ぶん</rt></ruby>の<ruby>形容<rt>けいよう</rt></ruby><ruby>詞<rt>し</rt></ruby>を<ruby>名詞<rt>めいし</rt></ruby>に<ruby>変<rt>か</rt></ruby>えてください。</div><div class="zh">请把这个句子里的形容词改成名词。</div></div>
