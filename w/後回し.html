<h1 lang="ja">後回し<span class="muted">（あとまわし）</span></h1><p><b>推迟，往后放</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>面倒<rt>めんどう</rt></ruby>な<ruby>仕事<rt>しごと</rt></ruby>を<ruby>後回<rt>あとまわ</rt></ruby>しにしてしまう。</div><div class="zh">总是把麻烦的工作往后推。</div></div><div class="ex"><div lang="ja">その<ruby>問題<rt>もんだい</rt></ruby>は<ruby>後回<rt>あとまわ</rt></ruby>しにして、<ruby>先<rt>さき</rt></ruby>に<ruby>進<rt>すす</rt></ruby>めよう。</div><div class="zh">那个问题先放一放，我们继续往下进行吧。</div></div><div class="ex"><div lang="ja"><ruby>自分<rt>じぶん</rt></ruby>のことは<ruby>後回<rt>あとまわ</rt></ruby>しにして<ruby>家族<rt>かぞく</rt></ruby>のために<ruby>働<rt>はたら</rt></ruby>いた。</div><div class="zh">把自己的事放在一边，为家人工作。</div></div>
