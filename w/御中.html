<h1 lang="ja">御中<span class="muted">（おんちゅう）</span></h1><p><b>公启（寄给团体）</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>会社<rt>かいしゃ</rt></ruby><ruby>宛<rt>あ</rt></ruby>ての<ruby>封筒<rt>ふうとう</rt></ruby>には「<ruby>御中<rt>おんちゅう</rt></ruby>」と<ruby>書<rt>か</rt></ruby>く。</div><div class="zh">寄给公司的信封上要写“公启”。</div></div><div class="ex"><div lang="ja">「<ruby>営業<rt>えいぎょう</rt></ruby><ruby>部<rt>ぶ</rt></ruby><ruby>御中<rt>おんちゅう</rt></ruby>」と<ruby>書<rt>か</rt></ruby>いて<ruby>書類<rt>しょるい</rt></ruby>を<ruby>送<rt>おく</rt></ruby>った。</div><div class="zh">写上“营业部公启”后寄出了文件。</div></div><div class="ex"><div lang="ja"><ruby>個人<rt>こじん</rt></ruby><ruby>名<rt>めい</rt></ruby>を<ruby>書<rt>か</rt></ruby>く<ruby>場合<rt>ばあい</rt></ruby>は、<ruby>御中<rt>おんちゅう</rt></ruby>ではなく<ruby>様<rt>さま</rt></ruby>を<ruby>使<rt>つか</rt></ruby>う。</div><div class="zh">写个人姓名时，不用“公启”，而用“様”。</div></div>
