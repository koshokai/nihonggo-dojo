<h2>例句</h2><div class="ex"><div lang="ja"><ruby>会費<rt>かいひ</rt></ruby>は<ruby>月末<rt>げつまつ</rt></ruby>に<ruby>徴収<rt>ちょうしゅう</rt></ruby>します。</div><div class="zh">会费在月末收取。</div></div><div class="ex"><div lang="ja"><ruby>税金<rt>ぜいきん</rt></ruby>は<ruby>給料<rt>きゅうりょう</rt></ruby>から<ruby>源泉<rt>げんせん</rt></ruby><ruby>徴収<rt>ちょうしゅう</rt></ruby>されている。</div><div class="zh">税款从工资中预先扣缴。</div></div><div class="ex"><div lang="ja"><ruby>入場<rt>にゅうじょう</rt></ruby><ruby>料<rt>りょう</rt></ruby>を<ruby>徴収<rt>ちょうしゅう</rt></ruby>することになった。</div><div class="zh">决定收取入场费。</div></div>
