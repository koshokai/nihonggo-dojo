<h2>例句</h2><div class="ex"><div lang="ja">ご<ruby>注文<rt>ちゅうもん</rt></ruby>、<ruby>承知<rt>しょうち</rt></ruby>しました。</div><div class="zh">好的，您点的我记下了。</div></div><div class="ex"><div lang="ja"><ruby>明日<rt>あした</rt></ruby>までですね。<ruby>承知<rt>しょうち</rt></ruby>しました。</div><div class="zh">明天之前对吧，明白了。</div></div><div class="ex"><div lang="ja"><ruby>父<rt>ちち</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>留学<rt>りゅうがく</rt></ruby>を<ruby>承知<rt>しょうち</rt></ruby>してくれました。</div><div class="zh">父亲同意了我去留学。</div></div>
