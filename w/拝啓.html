<h1 lang="ja">拝啓<span class="muted">（はいけい）</span></h1><p><b>敬启者（书信开头）</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>拝啓<rt>はいけい</rt></ruby>　<ruby>時下<rt>じか</rt></ruby>ますますご<ruby>清栄<rt>せいえい</rt></ruby>のこととお<ruby>慶<rt>よろこ</rt></ruby>び<ruby>申<rt>もう</rt></ruby>し<ruby>上<rt>あ</rt></ruby>げます。</div><div class="zh">敬启者：时下恭祝贵公司日益兴隆。</div></div><div class="ex"><div lang="ja"><ruby>手紙<rt>てがみ</rt></ruby>は「<ruby>拝啓<rt>はいけい</rt></ruby>」で<ruby>始<rt>はじ</rt></ruby>め、「<ruby>敬具<rt>けいぐ</rt></ruby>」で<ruby>結<rt>むす</rt></ruby>ぶのが<ruby>一般<rt>いっぱん</rt></ruby><ruby>的<rt>てき</rt></ruby>だ。</div><div class="zh">书信一般以&quot;敬启者&quot;开头，以&quot;敬上&quot;结尾。</div></div><div class="ex"><div lang="ja"><ruby>拝啓<rt>はいけい</rt></ruby>　<ruby>新緑<rt>しんりょく</rt></ruby>の<ruby>候<rt>こう</rt></ruby>、<ruby>皆<rt>みな</rt></ruby><ruby>様<rt>さま</rt></ruby>いかがお<ruby>過<rt>す</rt></ruby>ごしでしょうか。</div><div class="zh">敬启者：时值新绿时节，各位近来可好？</div></div>
