<h2>例句</h2><div class="ex"><div lang="ja">ドルを<ruby>円<rt>えん</rt></ruby>に<ruby>換算<rt>かんさん</rt></ruby>するといくらになりますか。</div><div class="zh">把美元换算成日元是多少？</div></div><div class="ex"><div lang="ja"><ruby>年収<rt>ねんしゅう</rt></ruby>を<ruby>月給<rt>げっきゅう</rt></ruby>に<ruby>換算<rt>かんさん</rt></ruby>してみた。</div><div class="zh">我把年收入换算成了月薪。</div></div><div class="ex"><div lang="ja">この<ruby>距離<rt>きょり</rt></ruby>をマイルに<ruby>換算<rt>かんさん</rt></ruby>すると<ruby>約<rt>やく</rt></ruby><ruby>十<rt>じゅう</rt></ruby>マイルだ。</div><div class="zh">这段距离换算成英里大约是十英里。</div></div>
