<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>損得<rt>そんとく</rt></ruby>を<ruby>考<rt>かんが</rt></ruby>えずに、<ruby>困<rt>こま</rt></ruby>っている<ruby>人<rt>ひと</rt></ruby>を<ruby>助<rt>たす</rt></ruby>ける。</div><div class="zh">他不计得失地帮助有困难的人。</div></div><div class="ex"><div lang="ja"><ruby>友達<rt>ともだち</rt></ruby><ruby>付<rt>つ</rt></ruby>き<ruby>合<rt>あ</rt></ruby>いを<ruby>損得<rt>そんとく</rt></ruby>で<ruby>考<rt>かんが</rt></ruby>えるのはよくない。</div><div class="zh">用得失来衡量朋友交往是不好的。</div></div><div class="ex"><div lang="ja"><ruby>損得<rt>そんとく</rt></ruby><ruby>勘定<rt>かんじょう</rt></ruby>ばかりしていると、<ruby>信頼<rt>しんらい</rt></ruby>を<ruby>失<rt>うしな</rt></ruby>うよ。</div><div class="zh">总是计较得失的话，会失去信任的。</div></div>
