<h1 lang="ja">数詞<span class="muted">（すうし）</span></h1><p><b>数词</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>の<ruby>数詞<rt>すうし</rt></ruby>には<ruby>和語<rt>わご</rt></ruby>と<ruby>漢語<rt>かんご</rt></ruby>の<ruby>二<rt>に</rt></ruby><ruby>系統<rt>けいとう</rt></ruby>がある。</div><div class="zh">日语的数词有和语和汉语两个体系。</div></div><div class="ex"><div lang="ja"><ruby>数詞<rt>すうし</rt></ruby>と<ruby>助<rt>じょ</rt></ruby><ruby>数詞<rt>すうし</rt></ruby>を<ruby>組<rt>く</rt></ruby>み<ruby>合<rt>あ</rt></ruby>わせて<ruby>物<rt>もの</rt></ruby>を<ruby>数<rt>かぞ</rt></ruby>える。</div><div class="zh">把数词和量词组合起来数东西。</div></div><div class="ex"><div lang="ja"><ruby>文中<rt>ぶんちゅう</rt></ruby>の<ruby>数詞<rt>すうし</rt></ruby>に<ruby>下線<rt>かせん</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>きなさい。</div><div class="zh">请在句中的数词下画线。</div></div>
