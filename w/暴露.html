<h2>例句</h2><div class="ex"><div lang="ja"><ruby>週刊<rt>しゅうかん</rt></ruby><ruby>誌<rt>し</rt></ruby>が<ruby>政治<rt>せいじ</rt></ruby><ruby>家<rt>か</rt></ruby>の<ruby>不正<rt>ふせい</rt></ruby>を<ruby>暴露<rt>ばくろ</rt></ruby>した。</div><div class="zh">周刊杂志揭露了政客的违法行为。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>元<rt>もと</rt></ruby><ruby>同僚<rt>どうりょう</rt></ruby>に<ruby>秘密<rt>ひみつ</rt></ruby>を<ruby>暴露<rt>ばくろ</rt></ruby>されて<ruby>困<rt>こま</rt></ruby>っている。</div><div class="zh">他的秘密被前同事抖了出来，正为此苦恼。</div></div><div class="ex"><div lang="ja"><ruby>今回<rt>こんかい</rt></ruby>の<ruby>事故<rt>じこ</rt></ruby>で<ruby>管理<rt>かんり</rt></ruby><ruby>体制<rt>たいせい</rt></ruby>の<ruby>甘<rt>あま</rt></ruby>さが<ruby>暴露<rt>ばくろ</rt></ruby>された。</div><div class="zh">这次事故暴露了管理体制的松懈。</div></div>
