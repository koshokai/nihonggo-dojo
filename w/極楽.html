<h1 lang="ja">極楽<span class="muted">（ごくらく）</span></h1><p><b>极乐世界</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>温泉<rt>おんせん</rt></ruby>につかると<ruby>極楽<rt>ごくらく</rt></ruby>のような<ruby>気分<rt>きぶん</rt></ruby>だ。</div><div class="zh">泡在温泉里感觉像在天堂一样。</div></div><div class="ex"><div lang="ja"><ruby>祖母<rt>そぼ</rt></ruby>は<ruby>極楽<rt>ごくらく</rt></ruby><ruby>往生<rt>おうじょう</rt></ruby>を<ruby>願<rt>ねが</rt></ruby>って<ruby>毎日<rt>まいにち</rt></ruby><ruby>念仏<rt>ねんぶつ</rt></ruby>を<ruby>唱<rt>とな</rt></ruby>えている。</div><div class="zh">祖母每天念佛，祈愿往生极乐。</div></div><div class="ex"><div lang="ja"><ruby>聞<rt>き</rt></ruby>いて<ruby>極楽<rt>ごくらく</rt></ruby><ruby>見<rt>み</rt></ruby>て<ruby>地獄<rt>じごく</rt></ruby>とはこのことだ。</div><div class="zh">所谓“听着像天堂，看了是地狱”，说的就是这种情况。</div></div>
