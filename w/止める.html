<h2>例句</h2><div class="ex"><div lang="ja"><ruby>健康<rt>けんこう</rt></ruby>のために、たばこを<ruby>止<rt>や</rt></ruby>めました。</div><div class="zh">为了健康，我戒烟了。</div></div><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>なので、<ruby>旅行<rt>りょこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くのを<ruby>止<rt>や</rt></ruby>めました。</div><div class="zh">因为下雨，我不去旅行了。</div></div><div class="ex"><div lang="ja"><ruby>疲<rt>つか</rt></ruby>れたら、<ruby>仕事<rt>しごと</rt></ruby>を<ruby>止<rt>や</rt></ruby>めて<ruby>休<rt>やす</rt></ruby>んでください。</div><div class="zh">累了就停下工作休息吧。</div></div>
