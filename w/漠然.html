<h2>例句</h2><div class="ex"><div lang="ja"><ruby>将来<rt>しょうらい</rt></ruby>に<ruby>対<rt>たい</rt></ruby>して<ruby>漠然<rt>ばくぜん</rt></ruby>とした<ruby>不安<rt>ふあん</rt></ruby>を<ruby>抱<rt>いだ</rt></ruby>いている。</div><div class="zh">对未来怀有一种模糊的不安。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>の<ruby>説明<rt>せつめい</rt></ruby>は<ruby>漠然<rt>ばくぜん</rt></ruby>としていて、<ruby>要点<rt>ようてん</rt></ruby>がつかめなかった。</div><div class="zh">他的说明很含糊，抓不住要点。</div></div><div class="ex"><div lang="ja"><ruby>目標<rt>もくひょう</rt></ruby>もなく<ruby>漠然<rt>ばくぜん</rt></ruby>と<ruby>毎日<rt>まいにち</rt></ruby>を<ruby>過<rt>す</rt></ruby>ごしてしまった。</div><div class="zh">没有目标，稀里糊涂地过着每一天。</div></div>
