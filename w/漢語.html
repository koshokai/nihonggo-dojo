<h1 lang="ja">漢語<span class="muted">（かんご）</span></h1><p><b>汉语词</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>の<ruby>語彙<rt>ごい</rt></ruby>には<ruby>漢語<rt>かんご</rt></ruby>が<ruby>多<rt>おお</rt></ruby>く<ruby>含<rt>ふく</rt></ruby>まれている。</div><div class="zh">日语词汇中包含大量汉语词。</div></div><div class="ex"><div lang="ja"><ruby>漢語<rt>かんご</rt></ruby>を<ruby>使<rt>つか</rt></ruby>うと<ruby>文章<rt>ぶんしょう</rt></ruby>が<ruby>硬<rt>かた</rt></ruby>い<ruby>印象<rt>いんしょう</rt></ruby>になる。</div><div class="zh">使用汉语词会让文章给人生硬的印象。</div></div><div class="ex"><div lang="ja"><ruby>中国人<rt>ちゅうごくじん</rt></ruby>の<ruby>学習<rt>がくしゅう</rt></ruby><ruby>者<rt>しゃ</rt></ruby>は<ruby>漢語<rt>かんご</rt></ruby>の<ruby>意味<rt>いみ</rt></ruby>を<ruby>推測<rt>すいそく</rt></ruby>しやすい。</div><div class="zh">中国学习者容易推测出汉语词的意思。</div></div>
