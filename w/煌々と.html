<h1 lang="ja">煌々と<span class="muted">（こうこうと）</span></h1><p><b>明亮地</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>深夜<rt>しんや</rt></ruby>になってもオフィスには<ruby>明<rt>あ</rt></ruby>かりが<ruby>煌々<rt>こうこう</rt></ruby>とついていた。</div><div class="zh">即使到了深夜，办公室里依然灯火通明。</div></div><div class="ex"><div lang="ja"><ruby>煌々<rt>こうこう</rt></ruby>と<ruby>輝<rt>かがや</rt></ruby>く<ruby>満月<rt>まんげつ</rt></ruby>が<ruby>夜道<rt>よみち</rt></ruby>を<ruby>照<rt>て</rt></ruby>らしていた。</div><div class="zh">明亮的满月照亮了夜路。</div></div><div class="ex"><div lang="ja"><ruby>球場<rt>きゅうじょう</rt></ruby>の<ruby>照明<rt>しょうめい</rt></ruby>が<ruby>煌々<rt>こうこう</rt></ruby>と<ruby>灯<rt>とも</rt></ruby>っている。</div><div class="zh">球场的照明灯明亮地亮着。</div></div>
