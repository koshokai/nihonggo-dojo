<h1 lang="ja">煙る<span class="muted">（けむる）</span></h1><p><b>冒烟</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>生木<rt>なまき</rt></ruby>を<ruby>燃<rt>も</rt></ruby>やしたので、<ruby>部屋<rt>へや</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>が<ruby>煙<rt>けむ</rt></ruby>ってしまった。</div><div class="zh">因为烧的是湿木头，整个房间都烟雾弥漫。</div></div><div class="ex"><div lang="ja">ストーブが<ruby>不<rt>ふ</rt></ruby><ruby>完全<rt>かんぜん</rt></ruby><ruby>燃焼<rt>ねんしょう</rt></ruby>を<ruby>起<rt>お</rt></ruby>こして<ruby>煙<rt>けむ</rt></ruby>っている。</div><div class="zh">炉子燃烧不充分，正在冒烟。</div></div><div class="ex"><div lang="ja"><ruby>雨<rt>あめ</rt></ruby>に<ruby>煙<rt>けむ</rt></ruby>る<ruby>山々<rt>やまやま</rt></ruby>の<ruby>景色<rt>けしき</rt></ruby>が<ruby>実<rt>じつ</rt></ruby>に<ruby>美<rt>うつく</rt></ruby>しい。</div><div class="zh">雨中烟雾朦胧的群山景色实在很美。</div></div>
