<h1 lang="ja">熱意<span class="muted">（ねつい）</span></h1><p><b>热情</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>の<ruby>熱意<rt>ねつい</rt></ruby>に<ruby>負<rt>ま</rt></ruby>けて、<ruby>協力<rt>きょうりょく</rt></ruby>することにした。</div><div class="zh">被他的热情打动，决定合作。</div></div><div class="ex"><div lang="ja"><ruby>面接<rt>めんせつ</rt></ruby>では<ruby>仕事<rt>しごと</rt></ruby>への<ruby>熱意<rt>ねつい</rt></ruby>を<ruby>伝<rt>つた</rt></ruby>えることが<ruby>大切<rt>たいせつ</rt></ruby>だ。</div><div class="zh">面试时传达对工作的热情很重要。</div></div><div class="ex"><div lang="ja"><ruby>熱意<rt>ねつい</rt></ruby>だけでは<ruby>問題<rt>もんだい</rt></ruby>は<ruby>解決<rt>かいけつ</rt></ruby>しない。</div><div class="zh">光有热情是解决不了问题的。</div></div>
