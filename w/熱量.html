<h2>例句</h2><div class="ex"><div lang="ja">この<ruby>食品<rt>しょくひん</rt></ruby>の<ruby>熱量<rt>ねつりょう</rt></ruby>は<ruby>百<rt>ひゃく</rt></ruby>キロカロリーだ。</div><div class="zh">这种食品的热量是一百千卡。</div></div><div class="ex"><div lang="ja"><ruby>運動<rt>うんどう</rt></ruby>で<ruby>消費<rt>しょうひ</rt></ruby>する<ruby>熱量<rt>ねつりょう</rt></ruby>を<ruby>計算<rt>けいさん</rt></ruby>した。</div><div class="zh">计算了运动消耗的热量。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>の<ruby>演説<rt>えんぜつ</rt></ruby>には<ruby>聴衆<rt>ちょうしゅう</rt></ruby>を<ruby>圧倒<rt>あっとう</rt></ruby>する<ruby>熱量<rt>ねつりょう</rt></ruby>があった。</div><div class="zh">他的演讲带着压倒听众的热情。</div></div>
