<h2>例句</h2><div class="ex"><div lang="ja">エンジン<ruby>内<rt>ない</rt></ruby>で<ruby>燃料<rt>ねんりょう</rt></ruby>が<ruby>燃焼<rt>ねんしょう</rt></ruby>する。</div><div class="zh">燃料在发动机内燃烧。</div></div><div class="ex"><div lang="ja"><ruby>有<rt>ゆう</rt></ruby><ruby>酸素<rt>さんそ</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>は<ruby>脂肪<rt>しぼう</rt></ruby>の<ruby>燃焼<rt>ねんしょう</rt></ruby>に<ruby>効果<rt>こうか</rt></ruby><ruby>的<rt>てき</rt></ruby>だ。</div><div class="zh">有氧运动对燃烧脂肪很有效。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>最後<rt>さいご</rt></ruby>の<ruby>試合<rt>しあい</rt></ruby>で<ruby>完全<rt>かんぜん</rt></ruby><ruby>燃焼<rt>ねんしょう</rt></ruby>した。</div><div class="zh">他在最后一场比赛中燃尽了全部力量。</div></div>
