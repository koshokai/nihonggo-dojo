<h2>例句</h2><div class="ex"><div lang="ja"><ruby>長年<rt>ながねん</rt></ruby>の<ruby>独裁<rt>どくさい</rt></ruby><ruby>政権<rt>せいけん</rt></ruby>がついに<ruby>倒<rt>たお</rt></ruby>れた。</div><div class="zh">多年的独裁政权终于倒台了。</div></div><div class="ex"><div lang="ja"><ruby>社長<rt>しゃちょう</rt></ruby>の<ruby>独裁<rt>どくさい</rt></ruby><ruby>的<rt>てき</rt></ruby>な<ruby>経営<rt>けいえい</rt></ruby>に<ruby>社員<rt>しゃいん</rt></ruby>は<ruby>不満<rt>ふまん</rt></ruby>を<ruby>募<rt>つの</rt></ruby>らせている。</div><div class="zh">员工对社长独断专行的经营方式越来越不满。</div></div><div class="ex"><div lang="ja"><ruby>独裁<rt>どくさい</rt></ruby><ruby>者<rt>しゃ</rt></ruby>は<ruby>反対<rt>はんたい</rt></ruby><ruby>派<rt>は</rt></ruby>を<ruby>次々<rt>つぎつぎ</rt></ruby>に<ruby>弾圧<rt>だんあつ</rt></ruby>した。</div><div class="zh">独裁者接连镇压反对派。</div></div>
