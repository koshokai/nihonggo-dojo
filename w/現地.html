<h2>例句</h2><div class="ex"><div lang="ja"><ruby>事故<rt>じこ</rt></ruby>の<ruby>詳<rt>くわ</rt></ruby>しい<ruby>状況<rt>じょうきょう</rt></ruby>は<ruby>現地<rt>げんち</rt></ruby>からの<ruby>報告<rt>ほうこく</rt></ruby>を<ruby>待<rt>ま</rt></ruby>っている。</div><div class="zh">事故的详细情况正在等待来自现场的报告。</div></div><div class="ex"><div lang="ja"><ruby>現地<rt>げんち</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>と<ruby>交流<rt>こうりゅう</rt></ruby>するのが<ruby>旅<rt>たび</rt></ruby>の<ruby>醍醐<rt>だいご</rt></ruby><ruby>味<rt>み</rt></ruby>だ。</div><div class="zh">和当地人交流是旅行的妙趣所在。</div></div><div class="ex"><div lang="ja"><ruby>集合<rt>しゅうごう</rt></ruby><ruby>時間<rt>じかん</rt></ruby>は<ruby>現地<rt>げんち</rt></ruby><ruby>時間<rt>じかん</rt></ruby>の<ruby>午前<rt>ごぜん</rt></ruby><ruby>九時<rt>くじ</rt></ruby>です。</div><div class="zh">集合时间是当地时间上午九点。</div></div>
