<h1 lang="ja">異論<span class="muted">（いろん）</span></h1><p><b>异议</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja">この<ruby>案<rt>あん</rt></ruby>に<ruby>異論<rt>いろん</rt></ruby>はありません。</div><div class="zh">对这个方案没有异议。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>の<ruby>実力<rt>じつりょく</rt></ruby>については<ruby>誰<rt>だれ</rt></ruby>も<ruby>異論<rt>いろん</rt></ruby>を<ruby>唱<rt>とな</rt></ruby>えない。</div><div class="zh">对于他的实力，没有人提出异议。</div></div><div class="ex"><div lang="ja">その<ruby>説<rt>せつ</rt></ruby>には<ruby>異論<rt>いろん</rt></ruby>も<ruby>多<rt>おお</rt></ruby>い。</div><div class="zh">对那种说法也有很多不同意见。</div></div>
