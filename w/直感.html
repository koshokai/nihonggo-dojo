<h1 lang="ja">直感<span class="muted">（ちょっかん）</span></h1><p><b>直觉</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>直感<rt>ちょっかん</rt></ruby>で、この<ruby>人<rt>ひと</rt></ruby>は<ruby>信用<rt>しんよう</rt></ruby>できると<ruby>思<rt>おも</rt></ruby>った。</div><div class="zh">凭直觉，我觉得这个人可以信赖。</div></div><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>の<ruby>直感<rt>ちょっかん</rt></ruby>はよく<ruby>当<rt>あ</rt></ruby>たる。</div><div class="zh">她的直觉常常很准。</div></div><div class="ex"><div lang="ja"><ruby>最後<rt>さいご</rt></ruby>は<ruby>自分<rt>じぶん</rt></ruby>の<ruby>直感<rt>ちょっかん</rt></ruby>を<ruby>信<rt>しん</rt></ruby>じて<ruby>決<rt>き</rt></ruby>めた。</div><div class="zh">最后相信自己的直觉做了决定。</div></div>
