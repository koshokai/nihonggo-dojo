<h1 lang="ja">真相<span class="muted">（しんそう）</span></h1><p><b>真相</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>事件<rt>じけん</rt></ruby>の<ruby>真相<rt>しんそう</rt></ruby>はいまだに<ruby>謎<rt>なぞ</rt></ruby>に<ruby>包<rt>つつ</rt></ruby>まれている。</div><div class="zh">事件的真相至今仍是个谜。</div></div><div class="ex"><div lang="ja"><ruby>記者<rt>きしゃ</rt></ruby>たちは<ruby>真相<rt>しんそう</rt></ruby>を<ruby>突<rt>つ</rt></ruby>き<ruby>止<rt>と</rt></ruby>めようと<ruby>奔走<rt>ほんそう</rt></ruby>した。</div><div class="zh">记者们四处奔走，试图查明真相。</div></div><div class="ex"><div lang="ja"><ruby>真相<rt>しんそう</rt></ruby>を<ruby>明<rt>あ</rt></ruby>かせば<ruby>多<rt>おお</rt></ruby>くの<ruby>人<rt>ひと</rt></ruby>が<ruby>傷<rt>きず</rt></ruby>つくだろう。</div><div class="zh">如果说出真相，会有很多人受到伤害。</div></div>
