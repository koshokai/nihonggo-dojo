<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>着飾<rt>きかざ</rt></ruby>ってパーティーに<ruby>出<rt>で</rt></ruby>かけた。</div><div class="zh">她盛装打扮去参加派对。</div></div><div class="ex"><div lang="ja"><ruby>成人<rt>せいじん</rt></ruby><ruby>式<rt>しき</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>、<ruby>着飾<rt>きかざ</rt></ruby>った<ruby>若者<rt>わかもの</rt></ruby>で<ruby>街<rt>まち</rt></ruby>がにぎわった。</div><div class="zh">成人礼那天，街上满是盛装的年轻人，十分热闹。</div></div><div class="ex"><div lang="ja">いくら<ruby>着飾<rt>きかざ</rt></ruby>っても、<ruby>中身<rt>なかみ</rt></ruby>がなければ<ruby>意味<rt>いみ</rt></ruby>がない。</div><div class="zh">再怎么打扮，没有内涵也没有意义。</div></div>
