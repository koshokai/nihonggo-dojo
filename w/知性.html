<h2>例句</h2><div class="ex"><div lang="ja"><ruby>彼女<rt>かのじょ</rt></ruby>の<ruby>話<rt>はな</rt></ruby>し<ruby>方<rt>かた</rt></ruby>には<ruby>知性<rt>ちせい</rt></ruby>が<ruby>感<rt>かん</rt></ruby>じられる。</div><div class="zh">从她的说话方式中能感受到智慧。</div></div><div class="ex"><div lang="ja"><ruby>知性<rt>ちせい</rt></ruby>と<ruby>教養<rt>きょうよう</rt></ruby>を<ruby>兼<rt>か</rt></ruby>ね<ruby>備<rt>そな</rt></ruby>えた<ruby>人物<rt>じんぶつ</rt></ruby>だ。</div><div class="zh">他是兼具智慧与教养的人。</div></div><div class="ex"><div lang="ja"><ruby>感情<rt>かんじょう</rt></ruby>だけでなく<ruby>知性<rt>ちせい</rt></ruby>で<ruby>判断<rt>はんだん</rt></ruby>すべきだ。</div><div class="zh">不应只凭感情，而应以理智来判断。</div></div>
