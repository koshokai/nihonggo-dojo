<h1 lang="ja">表示<span class="muted">（ひょうじ）</span></h1><p><b>表示，显示</b> · JLPT N3</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>画面<rt>がめん</rt></ruby>に<ruby>時間<rt>じかん</rt></ruby>が<ruby>表示<rt>ひょうじ</rt></ruby>されている。</div><div class="zh">屏幕上显示着时间。</div></div><div class="ex"><div lang="ja"><ruby>食品<rt>しょくひん</rt></ruby>には<ruby>賞味<rt>しょうみ</rt></ruby><ruby>期限<rt>きげん</rt></ruby>の<ruby>表示<rt>ひょうじ</rt></ruby>がある。</div><div class="zh">食品上标有保质期。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>ははっきりと<ruby>反対<rt>はんたい</rt></ruby>の<ruby>意思<rt>いし</rt></ruby>を<ruby>表示<rt>ひょうじ</rt></ruby>した。</div><div class="zh">他明确表示了反对的意愿。</div></div>
