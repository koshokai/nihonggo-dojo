<h2>例句</h2><div class="ex"><div lang="ja"><ruby>環境<rt>かんきょう</rt></ruby><ruby>保護<rt>ほご</rt></ruby>の<ruby>観点<rt>かんてん</rt></ruby>から<ruby>見<rt>み</rt></ruby>ると、この<ruby>計画<rt>けいかく</rt></ruby>は<ruby>問題<rt>もんだい</rt></ruby>がある。</div><div class="zh">从环境保护的角度来看，这个计划有问题。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>独自<rt>どくじ</rt></ruby>の<ruby>観点<rt>かんてん</rt></ruby>から<ruby>作品<rt>さくひん</rt></ruby>を<ruby>分析<rt>ぶんせき</rt></ruby>した。</div><div class="zh">他从独特的视角分析了作品。</div></div><div class="ex"><div lang="ja"><ruby>観点<rt>かんてん</rt></ruby>を<ruby>変<rt>か</rt></ruby>えれば、<ruby>別<rt>べつ</rt></ruby>の<ruby>解決<rt>かいけつ</rt></ruby><ruby>策<rt>さく</rt></ruby>が<ruby>見<rt>み</rt></ruby>えてくる。</div><div class="zh">换个角度看，就能发现别的解决办法。</div></div>
