<h1 lang="ja">試み<span class="muted">（こころみ）</span></h1><p><b>尝试</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>新<rt>あたら</rt></ruby>しい<ruby>試<rt>こころ</rt></ruby>みとして、オンライン<ruby>授業<rt>じゅぎょう</rt></ruby>を<ruby>導入<rt>どうにゅう</rt></ruby>した。</div><div class="zh">作为一种新的尝试，引入了网络授课。</div></div><div class="ex"><div lang="ja"><ruby>何<rt>なん</rt></ruby><ruby>度<rt>ど</rt></ruby>か<ruby>和解<rt>わかい</rt></ruby>の<ruby>試<rt>こころ</rt></ruby>みがなされたが、<ruby>失敗<rt>しっぱい</rt></ruby>に<ruby>終<rt>お</rt></ruby>わった。</div><div class="zh">进行了几次和解的尝试，但都以失败告终。</div></div><div class="ex"><div lang="ja">この<ruby>試<rt>こころ</rt></ruby>みが<ruby>成功<rt>せいこう</rt></ruby>すれば、<ruby>業界<rt>ぎょうかい</rt></ruby>に<ruby>大<rt>おお</rt></ruby>きな<ruby>影響<rt>えいきょう</rt></ruby>を<ruby>与<rt>あた</rt></ruby>えるだろう。</div><div class="zh">如果这次尝试成功，将会对业界产生很大影响吧。</div></div>
