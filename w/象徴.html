<h1 lang="ja">象徴<span class="muted">（しょうちょう）</span></h1><p><b>象征</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>鳩<rt>はと</rt></ruby>は<ruby>平和<rt>へいわ</rt></ruby>の<ruby>象徴<rt>しょうちょう</rt></ruby>だ。</div><div class="zh">鸽子是和平的象征。</div></div><div class="ex"><div lang="ja"><ruby>東京<rt>とうきょう</rt></ruby>タワーは<ruby>戦後<rt>せんご</rt></ruby><ruby>復興<rt>ふっこう</rt></ruby>の<ruby>象徴<rt>しょうちょう</rt></ruby>とされた。</div><div class="zh">东京塔被视为战后复兴的象征。</div></div><div class="ex"><div lang="ja">この<ruby>事件<rt>じけん</rt></ruby>は<ruby>現代<rt>げんだい</rt></ruby><ruby>社会<rt>しゃかい</rt></ruby>の<ruby>問題<rt>もんだい</rt></ruby>を<ruby>象徴<rt>しょうちょう</rt></ruby>している。</div><div class="zh">这一事件象征着现代社会的问题。</div></div>
