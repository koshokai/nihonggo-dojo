<h1 lang="ja">迷惑<span class="muted">（めいわく）</span></h1><p><b>麻烦</b> · JLPT N3</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>夜<rt>よる</rt></ruby><ruby>遅<rt>おそ</rt></ruby>くに<ruby>電話<rt>でんわ</rt></ruby>して、<ruby>迷惑<rt>めいわく</rt></ruby>をかけました。</div><div class="zh">深夜打电话给人添麻烦了。</div></div><div class="ex"><div lang="ja"><ruby>人<rt>ひと</rt></ruby>に<ruby>迷惑<rt>めいわく</rt></ruby>をかけないようにしましょう。</div><div class="zh">尽量不要给别人添麻烦。</div></div><div class="ex"><div lang="ja"><ruby>電車<rt>でんしゃ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>大<rt>おお</rt></ruby>きな<ruby>声<rt>こえ</rt></ruby>で<ruby>話<rt>はな</rt></ruby>すのは<ruby>迷惑<rt>めいわく</rt></ruby>です。</div><div class="zh">在电车里大声说话会打扰别人。</div></div>
