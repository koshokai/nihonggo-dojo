<h1 lang="ja">連帯<span class="muted">（れんたい）</span></h1><p><b>连带，团结</b> · JLPT N1</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>労働<rt>ろうどう</rt></ruby><ruby>者<rt>しゃ</rt></ruby>たちは<ruby>連帯<rt>れんたい</rt></ruby>して<ruby>会社<rt>かいしゃ</rt></ruby>と<ruby>交渉<rt>こうしょう</rt></ruby>した。</div><div class="zh">工人们团结起来与公司谈判。</div></div><div class="ex"><div lang="ja"><ruby>被災<rt>ひさい</rt></ruby><ruby>者<rt>しゃ</rt></ruby>との<ruby>連帯<rt>れんたい</rt></ruby>を<ruby>示<rt>しめ</rt></ruby>す<ruby>集会<rt>しゅうかい</rt></ruby>が<ruby>開<rt>ひら</rt></ruby>かれた。</div><div class="zh">举行了表示与灾民团结一心的集会。</div></div><div class="ex"><div lang="ja"><ruby>彼<rt>かれ</rt></ruby>は<ruby>借金<rt>しゃっきん</rt></ruby>の<ruby>連帯<rt>れんたい</rt></ruby><ruby>保証<rt>ほしょう</rt></ruby><ruby>人<rt>にん</rt></ruby>になってしまった。</div><div class="zh">他成了借款的连带保证人。</div></div>
