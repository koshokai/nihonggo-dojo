<h2>例句</h2><div class="ex"><div lang="ja"><ruby>部屋<rt>へや</rt></ruby>に<ruby>花<rt>はな</rt></ruby>を<ruby>飾<rt>かざ</rt></ruby>りました。</div><div class="zh">我在房间里摆了花。</div></div><div class="ex"><div lang="ja"><ruby>壁<rt>かべ</rt></ruby>に<ruby>家族<rt>かぞく</rt></ruby>の<ruby>写真<rt>しゃしん</rt></ruby>が<ruby>飾<rt>かざ</rt></ruby>ってあります。</div><div class="zh">墙上挂着家人的照片。</div></div><div class="ex"><div lang="ja">クリスマスツリーをきれいに<ruby>飾<rt>かざ</rt></ruby>りましょう。</div><div class="zh">把圣诞树装饰得漂漂亮亮吧。</div></div>
