<h1 lang="ja">騒々しい<span class="muted">（そうぞうしい）</span></h1><p><b>吵闹的</b> · JLPT N2</p>
<h2>例句</h2><div class="ex"><div lang="ja"><ruby>隣<rt>となり</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>が<ruby>騒々<rt>そうぞう</rt></ruby>しくて、<ruby>勉強<rt>べんきょう</rt></ruby>に<ruby>集中<rt>しゅうちゅう</rt></ruby>できない。</div><div class="zh">隔壁房间吵吵闹闹的，我没法集中精力学习。</div></div><div class="ex"><div lang="ja"><ruby>駅前<rt>えきまえ</rt></ruby>は<ruby>一<rt>いち</rt></ruby><ruby>日<rt>にち</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>、<ruby>人<rt>ひと</rt></ruby>と<ruby>車<rt>くるま</rt></ruby>で<ruby>騒々<rt>そうぞう</rt></ruby>しい。</div><div class="zh">车站前一整天都因人和车而喧闹不已。</div></div><div class="ex"><div lang="ja"><ruby>最近<rt>さいきん</rt></ruby>は<ruby>世<rt>よ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>が<ruby>何<rt>なん</rt></ruby>かと<ruby>騒々<rt>そうぞう</rt></ruby>しい。</div><div class="zh">最近世上总是闹哄哄的，不太平静。</div></div>
