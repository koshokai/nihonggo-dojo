<h1 lang="zh-CN">一直<span class="muted">（yī zhí）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">yī zhí</span>　<b>〔副〕ずっと；まっすぐ</b></p><p class="note">「一直走」は「まっすぐ行く」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">雨一直在下。</div><div class="py">yǔ yì zhí zài xià。</div><div class="tr">雨がずっと降っています。</div></div>
