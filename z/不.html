<h1 lang="zh-CN">不<span class="muted">（bù）</span></h1><p>HSK 1級</p><p class="sense"><span class="py">bù</span>　<b>〔副〕…ない（否定）</b></p><p class="note">第4声の前では bú と第2声に変わる。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我不喝咖啡。</div><div class="py">wǒ bù hē kā fēi。</div><div class="tr">私はコーヒーを飲みません。</div></div>
