<h1 lang="zh-CN">东西<span class="muted">（dōng xī）</span></h1><p>HSK 1級 · 繁体字：<span lang=zh-TW>東西</span></p><p class="sense"><span class="py">dōng xī</span>　<b>物；品物</b></p><p class="note">xī を軽声で読むと「物」、第1声だと「東と西」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我去超市买东西。</div><div class="py">wǒ qù chāo shì mǎi dōng xi。</div><div class="tr">スーパーへ買い物に行きます。</div></div>
