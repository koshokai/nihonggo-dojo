<h1 lang="zh-CN">两<span class="muted">（liǎng）</span></h1><p>HSK 2級 · 繁体字：<span lang=zh-TW>兩</span></p><p class="sense"><span class="py">liǎng</span>　<b>二つ；二（量詞の前で）</b></p><p class="note">量詞の前では「二」ではなく「两」を使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我有两个孩子。</div><div class="py">wǒ yǒu liǎng ge hái zi。</div><div class="tr">私には子どもが二人います。</div></div>
