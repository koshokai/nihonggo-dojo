<h1 lang="zh-CN">了<span class="muted">（le）</span></h1><p>HSK 1級</p><p class="sense"><span class="py">le</span>　<b>〔助詞〕動作の完了・状況の変化を表す</b></p><p class="note">動詞の直後なら完了、文末なら「〜になった」という変化を表す。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">天冷了，我买了一件毛衣。</div><div class="py">tiān lěng le， wǒ mǎi le yí jiàn máo yī。</div><div class="tr">寒くなったので、セーターを一着買いました。</div></div>
