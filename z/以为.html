<h1 lang="zh-CN">以为<span class="muted">（yǐ wéi）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>以為</span></p><p class="sense"><span class="py">yǐ wéi</span>　<b>…と思い込む（実際は違った）</b></p><p class="note">事実と違った思い込みによく使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我以为你是中国人。</div><div class="py">wǒ yǐ wéi nǐ shì zhōng guó rén。</div><div class="tr">中国人だと思っていました。</div></div>
