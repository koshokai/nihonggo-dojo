<h1 lang="zh-CN">位<span class="muted">（wèi）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">wèi</span>　<b>〔量詞〕人を数える（敬意を含む）</b></p><p class="note">「几位？」は店員が人数を尋ねる言い方。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">那位老师是我们的校长。</div><div class="py">nà wèi lǎo shī shì wǒ men de xiào zhǎng。</div><div class="tr">あの先生は私たちの校長先生です。</div></div>
