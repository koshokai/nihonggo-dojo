<h1 lang="zh-CN">再<span class="muted">（zài）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">zài</span>　<b>〔副〕また；再び（これから）；それから</b></p><p class="note">これからの繰り返しは「再」、すでに起きた繰り返しは「又」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">明天再来吧。</div><div class="py">míng tiān zài lái ba。</div><div class="tr">また明日来てください。</div></div>
