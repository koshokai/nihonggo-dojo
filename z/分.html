<h1 lang="zh-CN">分<span class="muted">（fēn）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">fēn</span>　<b>分ける；（時間の）分；（点数の）点</b></p><p class="note">お金の単位「分」（1元の100分の1）にも使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">现在是八点十分。</div><div class="py">xiàn zài shì bā diǎn shí fēn。</div><div class="tr">今は8時10分です。</div></div>
