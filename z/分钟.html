<h1 lang="zh-CN">分钟<span class="muted">（fēn zhōng）</span></h1><p>HSK 1級 · 繁体字：<span lang=zh-TW>分鐘</span></p><p class="sense"><span class="py">fēn zhōng</span>　<b>…分間</b></p><p class="note">時刻の「…分」は「分」だけ。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我等了十分钟。</div><div class="py">wǒ děng le shí fēn zhōng。</div><div class="tr">10分待ちました。</div></div>
