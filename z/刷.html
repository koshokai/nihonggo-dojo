<h1 lang="zh-CN">刷<span class="muted">（shuā）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">shuā</span>　<b>磨く；（ブラシで）こする；（カードを）通す</b></p><p class="note">「刷卡」はカードで支払うこと。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我每天刷两次牙。</div><div class="py">wǒ měi tiān shuā liǎng cì yá。</div><div class="tr">毎日2回歯を磨きます。</div></div>
