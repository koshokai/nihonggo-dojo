<h1 lang="zh-CN">叔叔<span class="muted">（shū shu）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">shū shu</span>　<b>おじさん（父の弟；大人の男性への呼びかけ）</b></p><p class="note">子どもが大人の男性を呼ぶときにも使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">叔叔，请问去车站怎么走？</div><div class="py">shū shu， qǐng wèn qù chē zhàn zěn me zǒu？</div><div class="tr">すみません、駅へはどう行けばいいですか。</div></div>
