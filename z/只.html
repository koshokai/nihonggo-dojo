<h1 lang="zh-CN">只<span class="muted">（zhǐ）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">zhǐ</span>　<b>〔副〕ただ…だけ；〔量詞〕動物などを数える</b></p><p class="note">量詞のときは zhī と読む（一只猫）。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我只有一百块钱。</div><div class="py">wǒ zhǐ yǒu yì bǎi kuài qián。</div><div class="tr">100元しか持っていません。</div></div>
