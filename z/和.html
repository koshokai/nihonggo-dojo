<h1 lang="zh-CN">和<span class="muted">（hé）</span></h1><p>HSK 1級 · 繁体字：<span lang=zh-TW>咊</span></p><p class="sense"><span class="py">hé</span>　<b>〔接続詞〕…と；〔前置詞〕…と（一緒に）</b></p><p class="note">名詞をつなぐ語。文と文をつなぐのには使わない。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我和朋友去吃饭。</div><div class="py">wǒ hé péng you qù chī fàn。</div><div class="tr">友達とご飯を食べに行きます。</div></div>
