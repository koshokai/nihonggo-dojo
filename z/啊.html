<h1 lang="zh-CN">啊<span class="muted">（a）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">a</span>　<b>〔助詞〕文末で感嘆・念押しを表す；ああ</b></p><p class="note">前の音によって「呀」「哪」などに変わることがある。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">今天的天气真好啊！</div><div class="py">jīn tiān de tiān qì zhēn hǎo a！</div><div class="tr">今日は本当にいい天気ですね！</div></div>
