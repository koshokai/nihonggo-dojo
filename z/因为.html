<h1 lang="zh-CN">因为<span class="muted">（yīn wèi）</span></h1><p>HSK 2級 · 繁体字：<span lang=zh-TW>因為</span></p><p class="sense"><span class="py">yīn wèi</span>　<b>〔接続詞〕…なので；なぜなら</b></p><p class="note">「因为…所以…」の形でよく使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">因为下雨，我没去。</div><div class="py">yīn wèi xià yǔ， wǒ méi qù。</div><div class="tr">雨だったので行きませんでした。</div></div>
