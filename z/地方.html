<h1 lang="zh-CN">地方<span class="muted">（dì fang）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">dì fang</span>　<b>場所；所</b></p><p class="note">※「地方」は「場所」の意。日本語の「地方（田舎）」の意味は弱い。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">这个地方很漂亮。</div><div class="py">zhè ge dì fang hěn piào liang。</div><div class="tr">ここはきれいな所です。</div></div>
