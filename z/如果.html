<h1 lang="zh-CN">如果<span class="muted">（rú guǒ）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">rú guǒ</span>　<b>〔接続詞〕もし…なら</b></p><p class="note">後ろに「就」がよく呼応する。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">如果明天下雨，我们就不去了。</div><div class="py">rú guǒ míng tiān xià yǔ， wǒ men jiù bú qù le。</div><div class="tr">もし明日雨なら、行くのはやめましょう。</div></div>
