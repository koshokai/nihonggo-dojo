<h1 lang="zh-CN">姓<span class="muted">（xìng）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">xìng</span>　<b>名字（姓）は…という</b></p><p class="note">丁寧に名字を尋ねるときは「您贵姓？」と言う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">您贵姓？——我姓田中。</div><div class="py">nín guì xìng？—— wǒ xìng tián zhōng。</div><div class="tr">「お名前は？」「田中です。」</div></div>
