<h1 lang="zh-CN">小姐<span class="muted">（xiǎo jie）</span></h1><p>HSK 1級</p><p class="sense"><span class="py">xiǎo jie</span>　<b>（若い女性への呼びかけ）…さん；お嬢さん</b></p><p class="note">店員への呼びかけとしては今は「服务员」の方が無難。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">李小姐，你好！</div><div class="py">lǐ xiǎo jie， nǐ hǎo！</div><div class="tr">李さん、こんにちは。</div></div>
