<h1 lang="zh-CN">帮忙<span class="muted">（bāng máng）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>幫忙</span></p><p class="sense"><span class="py">bāng máng</span>　<b>手伝う；助ける</b></p><p class="note">離合詞なので「帮忙我」とは言わず「帮我个忙」と言う。</p>
