<h1 lang="zh-CN">或者<span class="muted">（huò zhě）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">huò zhě</span>　<b>〔接続詞〕または；あるいは</b></p><p class="note">疑問文では「还是」を使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我们周六或者周日去吧。</div><div class="py">wǒ men zhōu liù huò zhě zhōu rì qù ba。</div><div class="tr">土曜か日曜に行きましょう。</div></div>
