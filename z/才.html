<h1 lang="zh-CN">才<span class="muted">（cái）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">cái</span>　<b>〔副〕やっと；ようやく；…したばかり</b></p><p class="note">「遅い・ようやく」の気持ちを表し、「就」と対になる。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">他十点才起床。</div><div class="py">tā shí diǎn cái qǐ chuáng。</div><div class="tr">彼は10時にやっと起きました。</div></div>
