<h1 lang="zh-CN">打电话<span class="muted">（dǎ diàn huà）</span></h1><p>HSK 1級 · 繁体字：<span lang=zh-TW>打電話</span></p><p class="sense"><span class="py">dǎ diàn huà</span>　<b>電話をかける</b></p><p class="note">「给＋人＋打电话」の語順に注意。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我晚上给你打电话。</div><div class="py">wǒ wǎn shang gěi nǐ dǎ diàn huà。</div><div class="tr">夜、電話しますね。</div></div>
