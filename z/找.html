<h1 lang="zh-CN">找<span class="muted">（zhǎo）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">zhǎo</span>　<b>探す；訪ねる；（お釣りを）出す</b></p><p class="note">「找你五块」は「5元のお釣りです」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我在找我的钥匙。</div><div class="py">wǒ zài zhǎo wǒ de yào shi。</div><div class="tr">鍵を探しています。</div></div>
