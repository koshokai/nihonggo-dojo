<h1 lang="zh-CN">把<span class="muted">（bǎ）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">bǎ</span>　<b>〔前置詞〕…を（目的語を動詞の前に出す）；〔量詞〕取っ手のある物を数える</b></p><p class="note">「把」構文では動詞の後に結果や方向などの成分が必要。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">请把门关上。</div><div class="py">qǐng bǎ mén guān shàng。</div><div class="tr">ドアを閉めてください。</div></div>
