<h1 lang="zh-CN">接<span class="muted">（jiē）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">jiē</span>　<b>迎える；受け取る；（電話に）出る</b></p><p class="note">「接电话」は電話に出ること。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我去机场接朋友。</div><div class="py">wǒ qù jī chǎng jiē péng you。</div><div class="tr">空港に友達を迎えに行きます。</div></div>
