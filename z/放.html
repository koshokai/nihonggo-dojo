<h1 lang="zh-CN">放<span class="muted">（fàng）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">fàng</span>　<b>置く；放す；（休みに）なる</b></p><p class="note">「放假」は休みになること。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">把书放在桌子上吧。</div><div class="py">bǎ shū fàng zài zhuō zi shàng ba。</div><div class="tr">本を机の上に置いてください。</div></div>
