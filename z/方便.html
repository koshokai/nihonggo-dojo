<h1 lang="zh-CN">方便<span class="muted">（fāng biàn）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">fāng biàn</span>　<b>便利だ；都合がよい</b></p><p class="note">「方便的时候」は「ご都合のいいときに」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">这里交通很方便。</div><div class="py">zhè lǐ jiāo tōng hěn fāng biàn。</div><div class="tr">ここは交通の便がいいです。</div></div>
