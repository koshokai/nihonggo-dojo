<h1 lang="zh-CN">是<span class="muted">（shì）</span></h1><p>HSK 1級</p><p class="sense"><span class="py">shì</span>　<b>〔動〕…である；はい、そうです</b></p><p class="note">否定は「不是」。「没是」とは言わない。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">他是我的老师。</div><div class="py">tā shì wǒ de lǎo shī。</div><div class="tr">彼は私の先生です。</div></div>
