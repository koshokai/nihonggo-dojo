<h1 lang="zh-CN">有<span class="muted">（yǒu）</span></h1><p>HSK 1級</p><p class="sense"><span class="py">yǒu</span>　<b>〔動〕持っている；（…に）ある・いる</b></p><p class="note">否定は「没有」。「不有」とは言わない。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我有一个哥哥。</div><div class="py">wǒ yǒu yí ge gē ge。</div><div class="tr">私には兄が一人います。</div></div>
