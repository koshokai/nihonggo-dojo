<h1 lang="zh-CN">没关系<span class="muted">（méi guān xi）</span></h1><p>HSK 1級 · 繁体字：<span lang=zh-TW>沒關係</span></p><p class="sense"><span class="py">méi guān xi</span>　<b>大丈夫です；構いません</b></p><p class="note">「对不起」への返事として使う。</p>
