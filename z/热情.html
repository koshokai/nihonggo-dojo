<h1 lang="zh-CN">热情<span class="muted">（rè qíng）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>熱情</span></p><p class="sense"><span class="py">rè qíng</span>　<b>親切だ；心がこもっている；熱意</b></p><p class="note">人に対して温かく親切な態度によく使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">中国朋友对我很热情。</div><div class="py">zhōng guó péng you duì wǒ hěn rè qíng。</div><div class="tr">中国の友達はとても親切にしてくれます。</div></div>
