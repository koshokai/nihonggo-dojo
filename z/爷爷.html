<h1 lang="zh-CN">爷爷<span class="muted">（yé ye）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>爺爺</span></p><p class="sense"><span class="py">yé ye</span>　<b>（父方の）おじいさん</b></p><p class="note">母方の祖父は「姥爷」「外公」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我爷爷每天早上去公园散步。</div><div class="py">wǒ yé ye měi tiān zǎo shang qù gōng yuán sàn bù。</div><div class="tr">祖父は毎朝公園を散歩します。</div></div>
