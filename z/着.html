<h1 lang="zh-CN">着<span class="muted">（zhe）</span></h1><p>HSK 2級 · 繁体字：<span lang=zh-TW>著</span></p><p class="sense"><span class="py">zhe</span>　<b>〔助詞〕…している；…してある（持続）</b></p><p class="note">動作の進行ではなく状態の持続を表すのが基本。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">门一直开着呢。</div><div class="py">mén yì zhí kāi zhe ne。</div><div class="tr">ドアがずっと開いています。</div></div>
