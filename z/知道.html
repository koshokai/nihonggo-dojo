<h1 lang="zh-CN">知道<span class="muted">（zhī dào）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">zhī dào</span>　<b>知っている；分かる</b></p><p class="note">人と面識があることは「认识」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我不知道他的电话号码。</div><div class="py">wǒ bù zhī dao tā de diàn huà hào mǎ。</div><div class="tr">彼の電話番号を知りません。</div></div>
