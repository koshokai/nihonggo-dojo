<h1 lang="zh-CN">离<span class="muted">（lí）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">lí</span>　<b>〔前置詞〕…から（距離・隔たり）</b></p><p class="note">起点を表す「从」と違い、二点間の距離を表す。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">学校离我家很近。</div><div class="py">xué xiào lí wǒ jiā hěn jìn。</div><div class="tr">学校は家から近いです。</div></div>
