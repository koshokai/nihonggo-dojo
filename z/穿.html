<h1 lang="zh-CN">穿<span class="muted">（chuān）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">chuān</span>　<b>着る；履く</b></p><p class="note">服・靴・靴下すべてに使える。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">今天很冷，多穿点儿衣服。</div><div class="py">jīn tiān hěn lěng， duō chuān diǎnr yī fu。</div><div class="tr">今日は寒いから、多めに着てね。</div></div>
