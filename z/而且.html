<h1 lang="zh-CN">而且<span class="muted">（ér qiě）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">ér qiě</span>　<b>〔接続詞〕しかも；その上</b></p><p class="note">「不但…而且…」の形でよく使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">这家店很便宜，而且很好吃。</div><div class="py">zhè jiā diàn hěn pián yi， ér qiě hěn hǎo chī。</div><div class="tr">この店は安くて、しかもおいしいです。</div></div>
