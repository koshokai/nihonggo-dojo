<h1 lang="zh-CN">脚<span class="muted">（jiǎo）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>腳</span></p><p class="sense"><span class="py">jiǎo</span>　<b>足（くるぶしから下）</b></p><p class="note">脚全体は「腿」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">走了一天，我的脚很疼。</div><div class="py">zǒu le yì tiān， wǒ de jiǎo hěn téng。</div><div class="tr">一日歩いて足が痛いです。</div></div>
