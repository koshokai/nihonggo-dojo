<h1 lang="zh-CN">舒服<span class="muted">（shū fu）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">shū fu</span>　<b>気持ちがよい；快適だ</b></p><p class="note">「不舒服」は「体調が悪い」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">洗个热水澡，真舒服。</div><div class="py">xǐ ge rè shuǐ zǎo， zhēn shū fu。</div><div class="tr">熱いお風呂に入って、本当に気持ちいい。</div></div>
