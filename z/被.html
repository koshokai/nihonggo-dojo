<h1 lang="zh-CN">被<span class="muted">（bèi）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">bèi</span>　<b>〔前置詞〕…に（…される）（受け身）</b></p><p class="note">不本意な出来事に使うことが多い。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我的蛋糕被弟弟吃了。</div><div class="py">wǒ de dàn gāo bèi dì di chī le。</div><div class="tr">私のケーキは弟に食べられました。</div></div>
