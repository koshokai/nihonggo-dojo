<h1 lang="zh-CN">见面<span class="muted">（jiàn miàn）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>見面</span></p><p class="sense"><span class="py">jiàn miàn</span>　<b>会う；対面する</b></p><p class="note">離合詞。「跟／和＋人＋见面」と言い、「见面他」とは言わない。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我们明天在车站见面吧。</div><div class="py">wǒ men míng tiān zài chē zhàn jiàn miàn ba。</div><div class="tr">明日駅で会いましょう。</div></div>
