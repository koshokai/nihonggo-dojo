<h1 lang="zh-CN">认识<span class="muted">（rèn shi）</span></h1><p>HSK 1級 · 繁体字：<span lang=zh-TW>認識</span></p><p class="sense"><span class="py">rèn shi</span>　<b>知り合う；知っている；見分けがつく</b></p><p class="note">人と面識がある場合は「知道」ではなく「认识」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">很高兴认识你。</div><div class="py">hěn gāo xìng rèn shi nǐ。</div><div class="tr">お会いできてうれしいです。</div></div>
