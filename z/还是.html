<h1 lang="zh-CN">还是<span class="muted">（hái shi）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>還是</span></p><p class="sense"><span class="py">hái shi</span>　<b>〔接続詞〕それとも；〔副〕やはり</b></p><p class="note">疑問文の「それとも」は「还是」、平叙文の「または」は「或者」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">你喝茶还是喝咖啡？</div><div class="py">nǐ hē chá hái shì hē kā fēi？</div><div class="tr">お茶にしますか、それともコーヒー？</div></div>
