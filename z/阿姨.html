<h1 lang="zh-CN">阿姨<span class="muted">（ā yí）</span></h1><p>HSK 3級</p><p class="sense"><span class="py">ā yí</span>　<b>おばさん（母の姉妹；年上女性への呼びかけ）；お手伝いさん</b></p><p class="note">友達の母親などへの呼びかけにも使う。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">阿姨，您做的菜真好吃！</div><div class="py">ā yí， nín zuò de cài zhēn hǎo chī！</div><div class="tr">おばさん、お料理とてもおいしいです！</div></div>
