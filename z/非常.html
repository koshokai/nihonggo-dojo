<h1 lang="zh-CN">非常<span class="muted">（fēi cháng）</span></h1><p>HSK 2級</p><p class="sense"><span class="py">fēi cháng</span>　<b>〔副〕非常に；とても</b></p><p class="note">※日本語の「非常」（緊急）の意味はない。程度を強める副詞。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">这里的风景非常美。</div><div class="py">zhè lǐ de fēng jǐng fēi cháng měi。</div><div class="tr">ここの景色はとても美しいです。</div></div>
