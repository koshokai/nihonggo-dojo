<h1 lang="zh-CN">骑<span class="muted">（qí）</span></h1><p>HSK 3級 · 繁体字：<span lang=zh-TW>騎</span></p><p class="sense"><span class="py">qí</span>　<b>（またがって）乗る</b></p><p class="note">自転車・バイク・馬に使う。車は「坐」「开」。</p>
<h2>例文</h2><div class="ex"><div lang="zh-CN">我骑自行车去学校。</div><div class="py">wǒ qí zì xíng chē qù xué xiào。</div><div class="tr">自転車で学校に行きます。</div></div>
